    "save_editor/src/view/portraits\\.rs:\\d+:\\d+: delete match arm \\(None, None\\) in Portraits::select",
    # team_widgets: `two_pairs_width`'s toggle column
    # `(SLIDERS.len() + index) % 2` -> `*` swaps the toggles between the two columns (five
    # sliders: `5 * i` and `5 + i` have opposite parities), and the swap leaves the sum
    # unchanged: every slider's control has one width, so `max(slider, A) + max(slider, B)`
