# cargo-mutants configuration (CONTRIBUTING.md "Testing and verification", "Mutation runs").
# What this file excludes is what the mutation runs stop measuring, so every entry names the
# equivalence that makes the mutant unkillable; a mutant that is merely hard to kill stays in.

# `just mutants`/`mutants-diff` run two cargo processes at once (`--jobs 2`), and `.cargo/config.toml`'s
# `build.jobs = -2` caps each one separately, so together they took every logical processor. Each
# process therefore gets half of the CPUs-minus-two budget: build jobs by cargo's negative form
# (CPUs - 9 = 7 on the maintainer's 16-thread machine; cargo floors it at 1 elsewhere), test threads
# as a hard 7 because libtest has no relative form. Local tooling only; CI never runs mutants.
additional_cargo_args = ["--jobs", "-9"]
additional_cargo_test_args = ["--", "--test-threads=7"]

# Each run copies the source tree to a `%TEMP%` build directory, and by default the copy includes
# gitignored files: the session scratch `.tmp/` (17 GB of archived runs and probes at 3.8) filled
# the disk and killed both of 3.7's diff runs. No test reads a gitignored file.
gitignore = true

# python_bindings is a `test = false` cdylib whose one test is the wheel's smoke test (`just
# bindings`). cargo-mutants cannot run that, and `cargo test`/`cargo check` never compile the
# lib, so at 2.20j every mutant came back "missed" in 0 s without building (`PyResult::new()`
# "succeeded" too). Its mutants are measured by hand against `just bindings` at converge.
exclude_globs = ["crates/libs/python_bindings/**"]

exclude_re = [
    # Bit packing: `a | b` and `a ^ b` are the same value when the operands share no set bit,
    # which is every packed-field write in the format crates (the fields are masked and shifted
    # into disjoint ranges). The kit_config probe had 25 of its 46 survivors here, all equivalent.
    # Accepted loss: an OR of overlapping operands is no longer mutated either.
    "replace \\| with \\^",
    # `relaunch_elevated` mutants can only be exercised through the UAC consent prompt,
    # which no test can click: the `-> Ok(())` replacements, the SHELLEXECUTEINFOW field
    # deletes (a separate mutant genre whose name the function pattern does not match, hence
    # the second entry) and the ERROR_CANCELLED arm all live behind it. The plan
    # (libs/elevation.md) makes the relaunch a manual check at the first tool phase that
    # needs it. The not-windows-not-unix `is_elevated` arm is unreachable on every host we
    # test on for the same underlying reason (the platform it belongs to never runs the
    # suite): it is not matched by either pattern and will keep appearing in missed.txt,
    # accepted as unreachable.
    "relaunch_elevated",
    "SHELLEXECUTEINFOW",
    # Not excluded, accepted: `pipeline`'s `available_memory` has one arm per platform, and only
    # the host's arm compiles, so each run lists the others' replacements as missed. The Windows
    # arm is caught on Windows, the Linux arm on Linux (the VPS, measured 2026-10-01); the
    # other-platform arm (a plain `None`) compiles on no tested OS. A pattern telling the arms
    # apart would need line numbers, which drift.
    # pes_model 2.20g equivalences, each checked by reasoning rather than a
    # distinguishing input existing:
    # `locate`'s `relative < section.bytes.len()` -> `<=` is equivalent. The
    # only address where they differ is one equal to a section's end, which
    # is the next section's start; `record_at` never finds a record there
    # (records sit at offsets >= 12 inside their array, and an empty array
    # has none), so `resolve` returns the same BadReference either way.
    "replace < with <= in locate",
    # `check_stream`'s `(end - start)` -> `(end + start)` is equivalent.
    # The expression evaluates only on ranges that passed start ==
    # expected_start, end >= start and end <= len; inductively every such
    # start is a multiple of 3 (the first is 0 and each passed range ends
    # at start + 3k), so end + start and end - start agree mod 3.
    "replace - with \\+ in check_stream",
    # `check`'s weights `(sum - 1.0).abs() > 1e-3` -> `>=` is equivalent.
    # f32(1e-3) = 0x3A83126F = 0.0010000000474974; a sum's exact f32
    # difference from 1.0 is k*2^-23 above (nearest: 8388*2^-23 = 0.0009999
    # and 8389*2^-23 = 0.00100005) or k*2^-24 below — neither side lands
    # exactly on the threshold, so `>=` can never fire where `>` does not.
    "check\\.rs:210:39: replace > with >=",
    # `SectionList::push`'s `bytes.len() + pad4(len)` -> `-` is equivalent.
    # Everything pushed is `SectionBuilder::finish`/`name_section` output:
    # 12-byte TOC plus 4-aligned header, records and blobs — always a
    # multiple of 4, so pad4 returns 0 and `len + 0`/`len - 0` resize the
    # same.
    "replace \\+ with - in SectionList::push",
    # `detect_style`'s two `start > 0` -> `>=` are equivalent. It runs only
    # after the document parsed, so a root element sits before the first
    # `<material`; the scan back over spaces/tabs stops at that tag's
    # bytes and start can never reach 0 for `>=` to differ (or panic).
    "replace > with >= in detect_style",
    # model_convert 2.20h equivalences:
    # `assemble`'s `skip(g + 1)` -> `skip(g)` is equivalent. `Model::validate`
    # rejects a group that is its own parent, so on every validated model the
    # group's own entry already fails `keep[g]` independently of the child
    # scan: including the group itself in `group_children` changes nothing.
    "hand_split\\.rs:210:25: replace \\+ with \\*",
    # `quantize_weights`' `remaining_weight > 0.0` -> `>=` is equivalent.
    # `remaining_weight` reaches exactly 0 only when every unprocessed slot's
    # weight is 0 (IR weights are non-negative), and `0.0 / 0.0` then gives
    # NaN whose `as i32` cast saturates to 0 — the same byte the `else` arm
    # writes.
    "replace > with >= in quantize_weights",
    # `retarget`'s `weights[slot] > 0.0` -> `>=` at lines 212 and 229 are
    # equivalent. A zero-weight slot entering the blend arm contributes
    # `0.0 * moved` — exactly 0 whichever transform `delta[slot]` holds —
    # so the accumulated point/direction is unchanged either way. (Line
    # 195's gate indexes the bone group and is not equivalent: without a
    # fold remap, an out-of-range unweighted entry panics there.)
    "retarget\\.rs:212:37: replace > with >=",
    "retarget\\.rs:229:37: replace > with >=",
    # model_convert 2.20h round-1 equivalences:
    # `fox_has_hand_weights` in every form. The helper feeds only
    # `needs_conversion`'s Fox branch, which runs for Fox targets (18/19/21)
    # alone; on all three versions a shared name's `hand_*` matrix differs
    # from `body`'s by <=1.3e-5, far under `MOVED_TOLERANCE` (1e-3), so
    # `conforming` returns a bone whose matrix `bone_moved` always judges
    # the same whichever table order is used.
    "fox_has_hand_weights",
    # `blend_direction`'s `sum` guard and `/=` division (retarget.rs:236,
    # :238) are equivalent in any form: the caller passes the closure's
    # output through `normalized()`, which absorbs any positive scalar —
    # the division changes only the length `normalized()` rewrites. And
    # `blend`'s `sum > 0.0` -> `>=` (retarget.rs:219) is equivalent: a
    # vertex reaches the blend only when `any_moved`, which requires a
    # positive weight, so `sum` is always positive there.
    "retarget\\.rs:236:28: replace > with",
    "retarget\\.rs:238:40: replace /= with \\*=",
    "retarget\\.rs:219:28: replace > with >=",
    # pes_savefile 2.20i equivalences:
    # `fresh_salt`'s `n > 0` -> `n >= 0` is equivalent. It only rehashes
    # chunk 0 as well, so every chunk is still a distinct link of the
    # payload-and-clock hash chain, and the salt's only contract is that
    # diversity (it has no fixed expected value). The `==` and `<` forms stop
    # the chain after chunk 0, leave the chunks equal, and stay in: the
    # pairwise-distinct test kills them.
    "replace > with >= in fresh_salt",
]
