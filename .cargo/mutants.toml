    "save_editor/src/view/appearance/mod\\.rs:\\d+:\\d+: replace \\^ with & in odd_seed",
    "save_editor/src/view/appearance/mod\\.rs:\\d+:\\d+: replace \\^ with \\| in odd_seed",
    # `clock_seed` whole: the wall clock is
    # its only input, so no test observes its return without depending on
    # the clock — `-> 1` survives `the_clock_seed_is_odd` (1 is odd), and
    # which odd seed the clock takes is unconstrained. The arithmetic it
