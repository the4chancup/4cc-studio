    "team_widgets/src/violations\\.rs:\\d+:\\d+: replace > with >= in bound",
    # pes_savefile: `text_spans`' character walk
    # `end < bytes.len()` -> `<=` is equivalent: `is_char_boundary(len)` is true, so at
