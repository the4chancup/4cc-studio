    "studio_core/src/shell/first_run\\.rs:1\\d\\d:\\d+: replace FirstRun::up -> bool with true",
    # studio_core: the log panel's `at_bottom` guard
    # `max_offset < 0.0` -> `<=` is equivalent: at an end of exactly 0 egui clamps the offset
