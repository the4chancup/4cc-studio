    "pes_savefile/src/model/names\\.rs:112:23: replace < with <= in text_spans",
    # save_editor: `odd_seed`'s seed is
    # `nanos ^ secs | 1`: `^` -> `&` or `|` still yields an odd seed, the
    # seed's only requirement (a zero state would draw 1 forever); which odd
