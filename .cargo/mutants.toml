    "team_widgets/src/tactics/instructions\\.rs:\\d+:\\d+: replace > with >= in capped_combo",
    # studio: `overflow_the_stack` only has to
    # recurse until the stack runs out. `depth + 1` -> `depth * 1` keeps `depth` at the 0 it
