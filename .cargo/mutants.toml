    # Pinned by line and column: the function's other `+` stay measured.
    "team_widgets/src/tactics/mod\\.rs:305:28: replace \\+ with \\* in two_pairs_width",
    # `capped_combo`'s hover guard `text_width > cap - chrome` -> `>=` is equivalent in what
