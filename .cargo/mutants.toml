    "tools/[a-z_]+/src/lib\\.rs:\\d+:\\d+: replace <impl StudioTool for Tool>::icon -> &'static str with",
    # studio_core: in `StatusBar::expire`, the repaint
    # request's guard `remaining > 0.0` -> `>=` is equivalent: at exactly no time left the same
    # call dismisses the notice, so the only difference is one zero-delay repaint, which draws
    # what the dismissal already drew. Pinned to its site: `> 0.0` -> `==` stays measured.
    "studio_core/src/shell/status_bar\\.rs:\\d+:\\d+: replace > with >= in StatusBar::expire",
    # studio: `run_cli_mode`'s `printer.join().is_err() ||
    # !matches!(notices.join(), ..)` -> `&&` is not equivalent, but neither printer can fail
