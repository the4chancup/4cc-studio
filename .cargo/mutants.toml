    # stderr, and a test cannot hand the binary either portably. Unmeasured on purpose.
    "studio/src/main\\.rs:\\d+:\\d+: replace \\|\\| with && in run_cli_mode",
    # studio_core: `Settings::save`'s
    # read-back guard `read_back == desired` -> `true` survives because no known file edits into
