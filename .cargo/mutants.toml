    "team_widgets/src/pitch/lineup\\.rs:\\d+:\\d+: replace < with <= in bench_row",
    "team_widgets/src/pitch/lineup\\.rs:\\d+:\\d+: replace > with >= in bench_row",
    # save_editor: `Portraits::select`'s `(None, None)`
    # arm deleted sends "no game, still no game" to the restart: it sets the selection and the
