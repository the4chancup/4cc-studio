# cargo-mutants configuration (CONTRIBUTING.md "Testing and verification", "Mutation runs").
# What this file excludes is what the mutation runs stop measuring, so every entry names the
# equivalence that makes the mutant unkillable; a mutant that is merely hard to kill stays in.

# These two lines size a bare `cargo mutants` only. `just mutants`/`mutants-diff` run two cargo
# processes at once (`--jobs 2`) from a copy of this file that `scripts/mutants.py`
# (`sized_config`) writes per machine, giving each process half the logical CPUs, and start
# cargo-mutants at below-normal priority, so the run uses every CPU the user's own work leaves
# idle rather than holding two back. A bare run keeps the old fixed budget: half of CPUs minus two
# per process, build jobs by cargo's negative form (CPUs - 9 = 7 on the maintainer's 16-thread
# machine; cargo floors it at 1 elsewhere), test threads a hard 7 because libtest has no relative
# form. Local tooling only; CI never runs mutants.
additional_cargo_args = ["--jobs", "-9"]
additional_cargo_test_args = ["--", "--test-threads=7"]

# A mutant's tests time out at five times the baseline's test time, cargo-mutants' default,
# which leaves a starved low-priority local run (RUNBOOK "Mutation runs") room before a slow
# test counts as a hang. The baseline is one crate's suite: `just mutants` takes one crate and
# `mutants-diff` runs each crate on its own (`scripts/mutants_diff.py`). When one diff run tested
# every crate, its baseline summed them, and a `music_export` mutant that hung a loop (its tests
# take 1-2 s) waited 751 s here; three times was tried then, and per-crate baselines replaced it.
timeout_multiplier = 5.0

# Each run copies the source tree to a `%TEMP%` build directory, and by default the copy includes
# gitignored files: the session scratch `.tmp/` (17 GB of archived runs and probes, once) filled
# the disk and killed two diff runs. No test reads a gitignored file.
gitignore = true

# python_bindings is a `test = false` cdylib whose one test is the wheel's smoke test (`just
# bindings`). cargo-mutants cannot run that, and `cargo test`/`cargo check` never compile the
# lib, so every mutant came back "missed" in 0 s without building (`PyResult::new()`
# "succeeded" too). Its mutants are measured by hand against `just bindings` when a phase closes.
#
# pes_savefile's `fixtures.rs` is test plumbing (the fixture payloads, the test salt and
# `fixture_save`), compiled for the crate's tests and for the `test-support` feature, so
# cargo-mutants takes it for library code. Its only behavior is handing tests their fixtures:
# any salt serves (the tests need a fixed one, not a particular one), and `fixture_save`'s test
# is in `team_compiler` (`tests/fixture_save.rs`), which a `pes_savefile` run does not execute.
exclude_globs = ["crates/libs/python_bindings/**", "crates/libs/pes_savefile/src/fixtures.rs"]

exclude_re = [
    # Entries naming a `line:column` drift when the file changes above them: a drifted one
    # matches nothing and its mutant reappears in missed.txt. Each phase's close re-checks
    # every entry against `cargo mutants --list`.
    #
    # Bit packing: `a | b` and `a ^ b` are the same value when the operands share no set bit.
    # In the files of the first entry every `|` joins masked, shifted fields into disjoint
    # ranges (the kit_config probe had 25 of its 46 survivors there, all equivalent); accepted
    # loss: a new `|` added to one of them is excluded too. In `f16.rs` only the listed
    # positions are disjoint: the quiet-NaN ORs at 17:25 and 39:30 overlap a payload bit, so `^`
    # turns a NaN into an infinity, and the tests kill both. Left in as well: the material-flag
    # ORs (`to_fox::resolve`, `pes_model/export.rs`), whose flags can already hold the bit
    # being set, so `^` clears it.
    "(color_tools/src/kit|cpk/src/(crilayla|read|utf)|fmdl/src/ops/antiblur|ftex/src/dds|kit_config/src/binary|pes_savefile/src/(codec/bits|container/mt19937|schema/texport))\\.rs:\\d+:\\d+: replace \\| with \\^",
    "fmdl/src/format/f16\\.rs:(19:36|19:50|24:36|26:25|26:52|39:21|43:21|55:44|66:21|69:53|76:10): replace \\| with \\^",
    # The Ruleset editor's native file dialog: `ruleset_dialog` is `#[cfg(not(test))]` (a test
    # would open a real window; the tests stub the pickers), so no test compiles it, let alone
    # sees the filter or start folder it sets. Matched by name, which does not drift.
    "ruleset_editor/src/view/mod\\.rs:\\d+:\\d+: replace ruleset_dialog -> rfd::FileDialog with",
    # `relaunch_elevated`'s Windows arm can only be exercised through the UAC consent prompt,
    # which no test can click: the `-> Ok(())` replacements of the body (`windows.rs`) and of
    # its wrapper (`lib.rs:51`), and the ERROR_CANCELLED arm. The relaunch is checked by hand
    # instead, when a tool first uses it. The wrapper for other platforms (`lib.rs:65`) compiles
    # on no tested OS. The Unix arm (`lib.rs:59`, `posix.rs`) stays in: `relaunch_is_unsupported`
    # kills it on Linux, and on Windows, where it does not compile, it is listed as missed like
    # `available_memory`'s arms below. Not excludable, accepted: the six SHELLEXECUTEINFOW field
    # deletions, because cargo-mutants (27.1) applies neither `exclude_re` nor `--re` to "delete
    # field" mutants (measured), and the not-windows-not-unix `is_elevated` arm, which compiles on
    # no tested OS either.
    "elevation/src/(windows\\.rs:\\d+|lib\\.rs:(51|65)):\\d+: .*relaunch_elevated",
    # `studio_core::run_gui` and `studio`'s `run_gui_mode` open a native window and return
    # when it closes, which no test can do (the suite runs without a display, and a test that
    # opened one would wait for a person to close it). Everything the window shows is tested
    # headless through `StudioApp`'s `logic`/`ui`; these two are what the manual TC-GUI-01 run
    # proves.
    "replace run_gui(_mode)? -> ",
    # `dds_convert`'s wasm stand-in for the GPU encoder (`lib.rs`, `mod gpu` under
    # `cfg(target_arch = "wasm32")`): an uninhabited enum whose methods no value can reach,
    # compiled on no tested OS, so its mutants build and "pass" untouched. The native encoder's
    # mutants are in `gpu.rs` and stay measured.
    "dds_convert/src/lib\\.rs:\\d+:\\d+: replace gpu::GpuEncoder::",
    # `dds_convert`'s GPU upload: every `|` in `gpu_encode_scoped` joins distinct wgpu usage
    # flags (`COPY_DST | TEXTURE_BINDING`, `COPY_SRC | STORAGE`, `COPY_DST | MAP_READ`), which
    # share no bit, so `^` gives the same set.
    "replace \\| with \\^ in GpuEncoder::gpu_encode_scoped",
    # Not excluded, accepted: `pipeline`'s `available_memory` has one arm per platform, and only
    # the host's arm compiles, so each run lists the others' replacements as missed. The Windows
    # arm is caught on Windows, the Linux arm on Linux (the VPS, measured); the other-platform
    # arm (a plain `None`) compiles on no tested OS. A pattern telling the arms apart would need
    # line numbers, which drift. The same holds for `studio_core`'s running-PES probe
    # (`pes_process.rs`). Its Linux arm (`cmdlines`, `probe`), drawn into the Windows half, is
    # listed missed there and caught on Linux by `cmdlines_hold_this_test_process` and
    # `running_pes_lists_a_running_game_with_its_exe` (checked by reading). Its Windows arm,
    # drawn into the Linux half, is rerun here (`WINDOWS_ONLY_TESTS` in `scripts/mutants.py`).
    # Its other-platform `probe` compiles on no tested OS.
    # pes_model equivalences, each checked by reasoning rather than a
    # distinguishing input existing:
    # `locate`'s `relative < section.bytes.len()` -> `<=` is equivalent. The
    # only address where they differ is one equal to a section's end, which
    # is the next section's start; `record_at` never finds a record there
    # (records sit at offsets >= 12 inside their array, and an empty array
    # has none), so `resolve` returns the same BadReference either way.
    "replace < with <= in locate",
    # `check_stream`'s `(end - start)` -> `(end + start)` is equivalent.
    # The expression evaluates only on ranges that passed start ==
    # expected_start, end >= start and end <= len; inductively every such
    # start is a multiple of 3 (the first is 0 and each passed range ends
    # at start + 3k), so end + start and end - start agree mod 3.
    "replace - with \\+ in check_stream",
    # `check`'s weights `(sum - 1.0).abs() > 1e-3` -> `>=` is equivalent.
    # f32(1e-3) = 0x3A83126F = 0.0010000000474974; a sum's exact f32
    # difference from 1.0 is k*2^-23 above (nearest: 8388*2^-23 = 0.0009999
    # and 8389*2^-23 = 0.00100005) or k*2^-24 below — neither side lands
    # exactly on the threshold, so `>=` can never fire where `>` does not.
    "check\\.rs:210:39: replace > with >=",
    # `SectionList::push`'s `bytes.len() + pad4(len)` -> `-` is equivalent.
    # Everything pushed is `SectionBuilder::finish`/`name_section` output:
    # 12-byte TOC plus 4-aligned header, records and blobs — always a
    # multiple of 4, so pad4 returns 0 and `len + 0`/`len - 0` resize the
    # same.
    "replace \\+ with - in SectionList::push",
    # `detect_style`'s two `start > 0` -> `>=` are equivalent. It runs only
    # after the document parsed, so a root element sits before the first
    # `<material`; the scan back over spaces/tabs stops at that tag's
    # bytes and start can never reach 0 for `>=` to differ (or panic).
    "replace > with >= in detect_style",
    # model_convert equivalences:
    # `assemble`'s `skip(g + 1)` -> `skip(g)` is equivalent. `Model::validate`
    # rejects a group that is its own parent, so on every validated model the
    # group's own entry already fails `keep[g]` independently of the child
    # scan: including the group itself in `group_children` changes nothing.
    "hand_split\\.rs:210:25: replace \\+ with \\*",
    # `quantize_weights`' `remaining_weight > 0.0` -> `>=` is equivalent. Before the last
    # slot, `remaining_weight` becomes exactly 0 only after a slot whose weight equals what
    # remained (`x - y == 0` only when `x == y`), and that slot took `round(1.0 * total)`, the
    # whole total left, so every later slot computes `weight / 0.0 * 0`, a NaN whose `as i32`
    # cast is 0: the byte the `else` arm writes. Measured: no differing output over 6
    # million inputs. (The audit first took `[1.0, 2^-25, 0, 0]` to kill it; by the second
    # slot that input's total is already 0.)
    "replace > with >= in quantize_weights",
    # `retarget`'s `weights[slot] > 0.0` -> `>=` at lines 212 and 229 are
    # equivalent. A zero-weight slot entering the blend arm contributes
    # `0.0 * moved` — exactly 0 whichever transform `delta[slot]` holds —
    # so the accumulated point/direction is unchanged either way. (Line
    # 195's gate indexes the bone group and is not equivalent: without a
    # fold remap, an out-of-range unweighted entry panics there.)
    "retarget\\.rs:212:37: replace > with >=",
    "retarget\\.rs:229:37: replace > with >=",
    # More model_convert equivalences:
    # `fox_has_hand_weights` in every form. The helper feeds only
    # `needs_conversion`'s Fox branch, which runs for Fox targets (18/19/21)
    # alone; on all three versions a shared name's `hand_*` matrix differs
    # from `body`'s by <=1.3e-5, far under `MOVED_TOLERANCE` (1e-3), so
    # `conforming` returns a bone whose matrix `bone_moved` always judges
    # the same whichever table order is used. The `.model` side,
    # `prefox_has_hand_weights`, is not covered by this argument and its tests
    # kill it, hence the `replace`/` in` prefix keeping `prefox_` out.
    "(replace| in) fox_has_hand_weights",
    # `blend_direction`'s `sum` guard and `/=` division (retarget.rs:236,
    # :238) are equivalent in any form: the caller passes the closure's
    # output through `normalized()`, which absorbs any positive scalar —
    # the division changes only the length `normalized()` rewrites. And
    # `blend`'s `sum > 0.0` -> `>=` (retarget.rs:219) is equivalent: a
    # vertex reaches the blend only when `any_moved`, which requires a
    # positive weight, so `sum` is always positive there.
    "retarget\\.rs:236:28: replace > with",
    "retarget\\.rs:238:40: replace /= with \\*=",
    "retarget\\.rs:219:28: replace > with >=",
    # pes_savefile equivalences:
    # `fresh_salt`'s `n > 0` -> `n >= 0` is equivalent. It only rehashes
    # chunk 0 as well, so every chunk is still a distinct link of the
    # payload-and-clock hash chain, and the salt's only contract is that
    # diversity (it has no fixed expected value). The `==` and `<` forms stop
    # the chain after chunk 0, leave the chunks equal, and stay in: the
    # pairwise-distinct test kills them.
    "replace > with >= in fresh_salt",
    # pes_savefile: `write_undecoded`'s `(byte & mask) | (source & !mask)` -> `^` is
    # equivalent: the two operands are masked by a mask and its complement, so they share no
    # set bit and `|` and `^` give the same byte.
    "replace \\| with \\^ in IngameFace::write_undecoded",
    # team_compiler equivalences:
    # `centre_square`'s and `letterboxed`'s `width > height` -> `>=` are equivalent. Both
    # are called by `squared` alone, after its `width == height` early return, so the two
    # comparisons differ on no input they ever see.
    "replace > with >= in (centre_square|letterboxed)",
    # team_compiler: `ModelFolder::own_package`'s `ingame_face` guard is read by
    # no consumer of `roles()`: a marked player's own copy or link wins `resolve_path` before
    # any package is consulted, his models are `PreFoxPart`s naming their own package, and he
    # plans no face task. So answering the face for him changes no output. The answer is kept
    # because it is the true one, should a consumer start reading it.
    "replace match guard self\\.ingame_face with false in ModelFolder::own_package",
    # export_upgrader: in `model_folders::run`, the skip of a copy whose `.mtl` or `face.xml`
    # is rewritten, `||` -> `&&`, is equivalent: no file is both, so nothing is skipped, and
    # every copy written is then replaced by its rewrite, written after every copy. Pinned to
    # its site: the two `==` beside it stay measured. The same skip in `upgrade::run` is
    # equivalent the same way: its rewrites (`kits.written`, `materials.written`, `face_xml`)
    # are written after every copy.
    "export_upgrader/src/model_folders\\.rs:389:13: replace \\|\\| with && in run",
    "export_upgrader/src/upgrade\\.rs:628:13: replace \\|\\| with && in run",
    # export_upgrader: `Tool::default_settings` returns an empty table, which is what
    # `Default::default()` returns: the tool has no settings.
    "export_upgrader/src/lib\\.rs:\\d+:\\d+: replace <impl StudioTool for Tool>::default_settings -> toml::Table with Default::default\\(\\)",
    # export_upgrader: in `kit_folders`, the empty `p1` a Full export gains,
    # `!=` -> `==`, is equivalent: the slot set feeds only the `all/` hoist, and an inserted
    # slot has no copies, so wherever the two forms differ ({g1} alone, or no g1) an empty kit
    # already blocks every hoist or there are fewer than two kits.
    "export_upgrader/src/kits\\.rs:600:42: replace != with == in kit_folders",
    # Every tool's `icon()`: `studio`'s `every_registered_tool_has_a_matching_planned_entry`
    # pins each registered tool's glyph to its `PLANNED` entry, and a run of the tool's own crate
