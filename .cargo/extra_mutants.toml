# extra_mutants configuration: the extra kinds' list of what the runs no longer
# measure, as `.cargo/mutants.toml` is for cargo-mutants (CONTRIBUTING.md "Testing
# and verification", "Mutation runs"). An entry drops every listed mutant whose
# path, kind and whole description it names — exact text, no regex, no line
# number — so two identically described flags share one entry and one reason.
# Every entry's `why` names the equivalence that makes the mutant unkillable (or
# the reason nothing reads it); a mutant that is merely hard to kill stays in.
# An entry that matches nothing its crate lists is stale — the code changed under
# the ruling — and the run reports it for triage.

[[exclude]]
path = "crates/tools/team_compiler/src/check.rs"
kind = "bool"
description = "in run: validation_pass arg 6: false becomes true | removed: false"
why = "memory only: check never reads the decompressed content"

[[exclude]]
path = "crates/tools/team_compiler/src/deep/materials.rs"
kind = "bool"
description = "in insert_link: self.textures.insert_link arg 1: true becomes false | removed: true"
why = "feeds only the .mtl supply check, an .any over places; links and combined share the Common home and order is never read"

[[exclude]]
path = "crates/tools/team_compiler/src/deep/materials.rs"
kind = "bool"
description = "in held_common: textures.insert arg 1: true becomes false | removed: true"
why = "same .any check; own and combined also share the Folder home"

[[exclude]]
path = "crates/tools/team_compiler/src/deep/model.rs"
kind = "bool"
description = "in fired: hand_weighted: false becomes true | removed: false"
why = "the .mtl arm's flag; every consumer tests contains() on model or link paths, never a .mtl"

# Also drops the PesModel arm's `metal: false`, which shares this description:
# the caught mutant the site naming cannot tell apart (accepted loss).
[[exclude]]
path = "crates/tools/team_compiler/src/deep/model.rs"
kind = "bool"
description = "in fired: metal: false becomes true | removed: false"
why = "the .mtl arm's flag; converts_metal asks metal_models.contains() of converted-model paths, never a .mtl"

[[exclude]]
path = "crates/tools/team_compiler/src/deep/model.rs"
kind = "bool"
description = "in material_read: mesh_used: false becomes true | removed: false"
why = "mesh_used is read only for .model entries; a .mtl's MaterialRead is never filtered by it"

[[exclude]]
path = "crates/tools/team_compiler/src/messages.rs"
kind = "bool"
description = "in tool_message: message arg 5: false becomes true | removed: false"
why = "raised matters only for two-severity codes, which no tool_message call passes"

[[exclude]]
path = "crates/tools/team_compiler/src/mtl_search.rs"
kind = "bool"
description = "in mtl_for: Candidate::new arg 2: false becomes true | removed: false"
why = "linked is read only by the sort key; every in_common candidate shares the value"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "bool"
description = "in plan_run: ingame_face: false becomes true | removed: false"
why = "a shared boots/gloves folder holds no face-named model or link, so the flag's remap is unreachable and its package resolves the same"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "bool"
description = "in plan_run: common_models arg 4: false becomes true | removed: false"
why = "the FolderModels it builds are read only as CommonModel or link roles, which never differ on the flag"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "bool"
description = "in plan_run: environment_map: false becomes true | removed: false"
why = "overwritten by converts_metal before any read"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "bool"
description = "in plan_run: refkit_body: false becomes true | removed: false"
why = "read only in the face package; a shared folder's tasks are its own kind only"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "bool"
description = "in plan_run: folder_tasks arg 5: false becomes true | removed: false"
why = "blank_face is and-ed with a Face package; a shared folder's packages are Boots/Gloves only"

[[exclude]]
path = "crates/tools/team_compiler/src/processing/model.rs"
kind = "bool"
description = "in package: common_folders.insert arg 1: true becomes false | removed: true"
why = "both place homes resolve to common_home, and two entries colliding on one folded key store identical values"

[[exclude]]
path = "crates/tools/team_compiler/src/processing/model.rs"
kind = "bool"
description = "in package: common_folders.insert_link arg 1: true becomes false | removed: true"
why = "a link standing for a Common/ texture and that texture file one folded key with identical values"

[[exclude]]
path = "crates/tools/team_compiler/src/processing/prefox_face.rs"
kind = "bool"
description = "in common: folders.insert arg 1: true becomes false | removed: true"
why = "common only ever calls insert, so each directory's place list is the same single place"

[[exclude]]
path = "crates/libs/model_convert/src/formats/fmdl/export.rs"
kind = "bool"
description = "in ir_to_fmdl: vertex_loop_preservation: false becomes true | removed: false"
why = "encode_model overwrites it (worklog 5.0g2)"

[[exclude]]
path = "crates/libs/archives/src/lib.rs"
kind = "bool"
description = "in read: Ok arg 1: false becomes true | removed: false"
why = "stopping early only saves work: the mismatch is returned after the iteration either way"

[[exclude]]
path = "crates/libs/pes_savefile/src/settings_toml/mod.rs"
kind = "bool"
description = "in narrow_to: toml_form arg 3: false becomes true | removed: false"
why = "narrow_to checks the key's widest range first; inside it the stored-width bound cannot refuse and both modes convert alike"

[[exclude]]
path = "crates/studio_core/src/pes_process.rs"
kind = "bool"
description = "in image_path: OpenProcess arg 2: false becomes true | removed: false"
why = "bInheritHandle only: a query-limited handle closed before image_path returns; a child started meanwhile could inherit no more than that query right, and nothing the suite outputs reads it"

[[exclude]]
path = "crates/tools/team_compiler/src/deep/mod.rs"
kind = "bool"
description = "in content_findings: pass_through_eligible: false becomes true | removed: false"
why = "the flag is read only for DropFile/DropFolder findings (issues::pass_through, deep::drops_file); this finding is Keep"

# Also drops the second face.xml arm's (the unused-face-file one, a line below), which shares
# this description: the caught mutant the site naming cannot tell apart (accepted loss).
[[exclude]]
path = "crates/tools/team_compiler/src/plan/roles.rs"
kind = "normalize"
description = "in pre_fox_file: eq_ignore_ascii_case becomes == | removed: file.path.name().eq_ignore_ascii_case(\"face.xml\")"
why = "a shared folder's FACE.XML then gets UnusedFaceFile, not None: both unused (no package), and the case-insensitive is_user_face_xml reports it as xml_ignored_shared first"

[[exclude]]
path = "crates/tools/team_compiler/src/texture_lookup.rs"
kind = "literal"
description = "in at: the matches! pattern loses an alternative | removed: \".\" |"
why = "a . segment lands verbatim in the key folder() looks up, and no place key (a real directory below the folder) holds one, so the lookup misses as the guard does"

[[exclude]]
path = "crates/tools/team_compiler/src/texture_lookup.rs"
kind = "literal"
description = "in at: the matches! pattern loses an alternative | removed: | \"..\""
why = "a .. segment lands verbatim in the key folder() looks up, and no place key (a real directory below the folder) holds one, so the lookup misses as the guard does"

[[exclude]]
path = "crates/tools/team_compiler/src/validation.rs"
kind = "literal"
description = "in unread_for_a_known_reason: the matches! pattern loses an alternative | removed: FileKind::Model(ModelFormat::Fmdl) |"
why = "pre_fox_file gives every FMDL a role unless beaten, so one reaching here is beaten (the first disjunct) or out of role position (the structure-pass disjunct)"

[[exclude]]
path = "crates/tools/export_upgrader/src/source.rs"
kind = "order"
description = "in flatten_same_named: the sort() statement is deleted | removed: files.sort();"
why = "files arrive sorted (below_root) and a flatten strips one segment from every file below one top, a contiguous block whose order and place it keeps, so the sort finds them sorted"

[[exclude]]
path = "crates/tools/team_compiler/src/plan/mod.rs"
kind = "order"
description = "in plan_run: the sort_by_key() statement is deleted | removed: packing.sort_by_key(|(_, id)| *id);"
why = "orders only the shared folders' build tasks: the CPK writer sorts its entries by path and the player tables keep their rows by player id, so no output byte follows the task order"

[[exclude]]
path = "crates/tools/ruleset_editor/src/view/mod.rs"
kind = "bool"
description = "in new: start_open: false becomes true | removed: false"
why = "the modal start page (New from template) draws only over a document, and set_document, the one way to get one, sets start_open false"
