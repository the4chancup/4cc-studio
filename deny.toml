# cargo-deny configuration: the license allowlist from the core plan, "License".
# Run through `just deps-check`. A dependency under any other license is a question for the
# maintainer, not an entry to add here.

# Every feature on, so a dependency behind an optional feature is checked too.
[graph]
all-features = true

[licenses]
# The list is policy, not a mirror of the current graph: an allowed license nobody uses yet is
# not a warning.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    # Font licenses, for egui's bundled default fonts only (epaint_default_fonts)
    "OFL-1.1",
    "Ubuntu-font-1.0",
]
