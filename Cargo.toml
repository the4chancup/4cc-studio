[workspace]
resolver = "3"
members = ["crates/studio", "crates/studio_core", "crates/libs/*", "crates/tools/*", "crates/dev/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/the4chancup/4cc-studio"
rust-version = "1.98"

# Every shared dependency is declared once here; crates inherit with `dep.workspace = true`
# (core plan, "Workspace guardrails" rule 2). Only crates listed in the core plan's
# "External Dependencies" table may be added (CONTRIBUTING.md "Dependencies").
[workspace.dependencies]
anyhow = "1.0.104"
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
binrw = "0.15.2"
block_compression = { version = "0.10.0", default-features = false, features = ["bc15", "bc7"] }
clap = { version = "4.6.6", features = ["derive"] }
crossbeam-channel = "0.5.17"
directories = "6.0.0"
# Exact, so a bare `cargo update` cannot move even a patch release unreviewed (`spec/core/gui.md`
# "egui version discipline"). The crates built on egui (`egui-wgpu`, `egui_extras`) each require
# the `egui` of their release, so the exact `egui` pin holds them without a pin of their own.
eframe = "=0.36.2"
egui = "=0.36.2"
# Icon font glyphs for the shell's sidebar, toolbar and status icons (`plans/core/README.md`
# "External Dependencies"); exact like `egui`, which it must match (this release is egui 0.36's).
egui-phosphor = "=0.14.0"
# The help window's Markdown (`plans/core/README.md` "External Dependencies"): exact like `egui`,
# 0.25.0 being the last release on egui 0.36; no image loaders, the help shows no images.
egui_commonmark = { version = "=0.25.0", default-features = false, features = ["pulldown_cmark"] }
env_logger = { version = "0.11.11", default-features = false }
flate2 = "1.1.10"
libc = "0.2.189"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "tga", "tiff"] }
indexmap = "2.14.2"
log = "0.4.34"
md-5 = "0.11.0"
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
pyo3 = { version = "0.29.2", features = ["abi3-py311", "extension-module"] }
pyo3-log = "0.13.4"
rayon = "1.12.0"
# `sync` makes a loaded ruleset shareable across threads: the whole-save AATF check runs its
# teams in parallel, and the Live AATF worker uses the ruleset the window loaded
# (`spec/aatf_rules.md` "The host").
rhai = { version = "1.26.1", default-features = false, features = ["std", "serde", "only_i64", "sync"] }
# The native file dialogs (`plans/core/README.md` "External Dependencies"). `xdg-portal`
# is the Linux backend, its dialog drawn by the desktop portal through libdbus with
# `pollster` blocking, so no async runtime enters the tree; `wayland` (a parent-window
# handle we never set) and `gtk3` are off.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sha2 = "0.11.0"
syn = { version = "3.0.5", default-features = false, features = ["full", "visit", "parsing", "printing"] }
thiserror = "2.0.20"
tiff = { version = "0.11.3", default-features = false }
toml = "0.9.8"
toml_edit = "0.23.9"
unicode-normalization = "0.1.25"
# `dds_convert`'s GPU BC7 device (native only); the version eframe's egui-wgpu already
# resolves, so the build holds one wgpu (`plans/libs/README.md` "First-release desktop GPU BC7").
wgpu = "30.0.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
roxmltree = "0.21.1"
sevenz-rust2 = { version = "0.22.2", default-features = false }
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# Workspace crates, so a member depends on another by name alone.
aatf = { path = "crates/libs/aatf" }
aesthetics_export = { path = "crates/libs/aesthetics_export" }
archives = { path = "crates/libs/archives" }
color_tools = { path = "crates/libs/color_tools" }
cpk = { path = "crates/libs/cpk" }
dds_convert = { path = "crates/libs/dds_convert" }
elevation = { path = "crates/libs/elevation" }
export_upgrader = { path = "crates/tools/export_upgrader" }
fmdl = { path = "crates/libs/fmdl" }
fox2 = { path = "crates/libs/fox2" }
fpc = { path = "crates/libs/fpc" }
fpk = { path = "crates/libs/fpk" }
kit_config = { path = "crates/libs/kit_config" }
ftex = { path = "crates/libs/ftex" }
model_convert = { path = "crates/libs/model_convert" }
music_export = { path = "crates/libs/music_export" }
pes_model = { path = "crates/libs/pes_model" }
pes_savefile = { path = "crates/libs/pes_savefile" }
pes_version = { path = "crates/libs/pes_version" }
pipeline = { path = "crates/libs/pipeline" }
save_editor = { path = "crates/tools/save_editor" }
studio_core = { path = "crates/studio_core" }
team_compiler = { path = "crates/tools/team_compiler" }
team_widgets = { path = "crates/libs/team_widgets" }
teams_list = { path = "crates/libs/teams_list" }
uniparam = { path = "crates/libs/uniparam" }
vtree = { path = "crates/libs/vtree" }
wezlib = { path = "crates/libs/wezlib" }

# The lint policy, inherited by every member via `[lints] workspace = true`
# (core plan, "Workspace guardrails" rule 5). Gates run clippy with `-D warnings`, so a
# `warn` here is a red gate; `deny` is for the rules that must fail even outside the gates.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
let_underscore_must_use = "deny"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"

# Dependencies build without debug info; workspace crates keep theirs
# (core plan, "Phase 1"; DECISIONS.md 2026-09-12 "dependencies build without debug info").
[profile.dev.package."*"]
debug = false

# The BC7 encoder is unusable unoptimized: one 1024x1024 texture took 56 s in a test build
# against 9 s optimized, and every mutant reruns that test (DECISIONS.md 2026-10-03 "the BC7
# encoder builds optimized in dev").
[profile.dev.package.block_compression]
opt-level = 3

# The AATF rules interpreter and the save container's inflate and hashes are the bulk of the
# test suites' time unoptimized: `check-aatf` over a fixture save's 220 teams took 128 s in a
# test build against 19 s with these four optimized, a one-team check 5.6 s against 2.5 s, and
# the build took no longer (DECISIONS.md 2026-10-22 "the hot dependencies build optimized in
# dev"). Every dependency optimized gained little more and cost 88 s per cold
# build, which every mutation run pays.
[profile.dev.package.rhai]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.md-5]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
