[package]
name = "studio"
description = "The 4cc Studio binary: registers the tools, launches the GUI or dispatches the CLI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "4cc-studio"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossbeam-channel.workspace = true
directories.workspace = true
env_logger.workspace = true
export_upgrader.workspace = true
indicatif.workspace = true
log.workspace = true
rfd.workspace = true
ruleset_editor.workspace = true
save_editor.workspace = true
studio_core.workspace = true
team_compiler.workspace = true

[dev-dependencies]
pes_savefile = { workspace = true, features = ["test-support"] }
pes_version.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[lints]
workspace = true
