[package]
name = "pes_savefile"
description = "The PES EDIT savefile: container crypto for PES 2015-2021, the schema-driven player/team/tactics codec, EditFile, and savefile discovery"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
flate2 = { workspace = true, optional = true }
fpc.workspace = true
md-5.workspace = true
pes_version.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml_edit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
directories.workspace = true

[dev-dependencies]
flate2.workspace = true

[features]
# The fixture saves as whole encrypted files (`fixture_save`), for other
# crates' tests.
test-support = ["dep:flate2"]

[lints]
workspace = true
