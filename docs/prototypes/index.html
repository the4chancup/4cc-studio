// Sidebar, top to bottom as gui.md "Sidebar" 1-5.
// An icon-font glyph in a .ph span (the rail's icons are 24 px).
const ph = glyph => h("span", { class: "ph" }, glyph);
// The sidebar's items, drawn the same in the rail and in the opened layer so
// the glyphs sit at the same x and y in both: `full` only swaps the two-digit
// selector for the labelled one (the labels stay hidden in the rail).
function sidebarItems(full) {
  const items = [
    h("div", { class: "logo", title: "About " + APP_NAME, onclick: openAbout },
      h("span", { class: "clover" }, h("span", { class: "ring" }, "\uF100"),
        h("span", { class: "leaves" }, "\uF101")))];
  const pesSel = combo(
    PES_VERSIONS.map(v => [v, full ? "PES " + v : v.slice(2)]),
    S.pesVersion, setPesVersion,
    { title: pesSelectorTip(), cls: pesSelectorClass(), disabled: !!S.blocker });
  // The rail's keeps the id the checks use; the layer's is a second select.
  pesSel.id = full ? "pes-version-open" : "pes-version";
  if (!full) pesSel.addEventListener("mousedown", pesSelectorFromRail);
  // A disabled control shows no tooltip in the browser (egui:
  // on_disabled_hover_text), so a blocked selector's reason sits on a
  // wrapper that still senses hover (ST-SIDE-04).
  items.push(S.blocker ? h("span", { class: "sel-block", title: pesSelectorTip() }, pesSel) : pesSel);
  items.push(h("div", { class: "sep" }));
  // Registered entries take focus and switch on Enter or Space; the planned
  // ones take no focus in either state. While the layer is open the rail's
  // covered controls leave the Tab order.
  const ti = (!full && S.sidebarOpen) ? "-1" : "0";
  if (!full && S.sidebarOpen) pesSel.tabIndex = -1;
  const pick = t => { if (t.registered) { S.activeTool = t.id; render(); } };
  for (const t of TOOLS.filter(t => t.registered).concat(TOOLS.filter(t => !t.registered))) {
    items.push(h("span", { class: "sel tool" + (S.activeTool === t.id ? " on" : "")
        + (t.registered ? "" : " planned"), "data-id": t.id,
      tabindex: t.registered ? ti : null,
      title: t.registered ? null : "Coming soon™",
      onclick: () => pick(t),
      onkeydown: e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pick(t); } } },
      ph(t.icon), h("span", { class: "tlabel" }, t.label)));
  }
  items.push(h("div", { class: "sep", style: "margin-top:auto" }));
  // The tail's entries are tool rows (same metrics in both states); the
  // rail's keeps the ids the checks use, the layer's are second controls.
  const tailEntry = (glyph, label, fn, id) => h("button", {
    class: "sel tool frame0", id: full ? id + "-open" : id, tabindex: ti,
    onclick: fn },
    ph(glyph), h("span", { class: "tlabel" }, label));
  items.push(h("div", { class: "tail" },
    // "(WIP)" until the help and the settings menu are complete, as their
    // windows' titles.
    tailEntry("\uE3E8", "Help (WIP)", () => openHelp({ tool: S.activeTool }), "help-btn"),
    tailEntry("\uE270", "Settings (WIP)", openSettings, "settings-btn")));
  return items;
}
// The opened layer stays while the pointer rests on it or focus is inside
// it, or while a popup it opened is up: the PES selector's list (the select
// focused, covered by the focus check) and the About window. No other window
// holds it.
function sidebarHeld() {
  const ae = document.activeElement;
  if (ae && (document.getElementById("sidebar").contains(ae)
    || (document.getElementById("sb-open") || { contains: () => false }).contains(ae)))
    return true;
  return !!document.querySelector('#overlay .window[data-dlg="about"]');
}
// The close when everything that kept it open ended: pointer outside, no
// focus inside, no holding popup. The pointer test is :hover: a modal drawn
// over the layer leaves it unhovered while the pointer is really off it.
function sidebarCloseCheck() {
  const over = document.querySelector("#sidebar:hover, #sb-open:hover");
  if (!over && !sidebarHeld()) { S.sidebarOpen = false; drawSidebarLayer(); }
}
let sidebarTimer = null;
// A pointer resting on the rail for 100 ms opens the layer (a pointer
// crossing it opens nothing); leaving closes it once nothing holds it. The
// handlers toggle only the layer, never the rail under the pressed control:
// a press inside the rail keeps the focus from opening it mid-press.
let sidebarPress = false;
function drawSidebarLayer() {
  // While the layer is open the rail's covered controls leave the Tab order;
  // a closed sidebar puts them back.
  document.querySelectorAll("#sidebar select, #sidebar button, #sidebar .tool[tabindex]")
    .forEach(c => c.tabIndex = S.sidebarOpen ? -1 : 0);
  const old = document.getElementById("sb-open");
  if (old) old.remove();
  if (!S.sidebarOpen) return;
  const layer = h("div", { id: "sb-open", class: "rail sidebar" });
  layer.append(...sidebarItems(true));
  // Moving between the rail and the layer is not leaving the sidebar.
  layer.addEventListener("pointerleave", e => {
    if (!document.getElementById("sidebar").contains(e.relatedTarget)) sidebarLeave();
  });
  layer.addEventListener("pointerdown", () => sidebarPress = true);
  layer.addEventListener("pointerup", () => sidebarPress = false);
  layer.addEventListener("focusout", () => {
    setTimeout(sidebarCloseCheck);
  });
  // Right after the rail in the DOM: Tab runs rail -> layer -> center.
  document.getElementById("sidebar").after(layer);
}
function sidebarEnter() {
  clearTimeout(sidebarTimer);
  sidebarTimer = setTimeout(() => { if (!S.sidebarOpen) { S.sidebarOpen = true; drawSidebarLayer(); } }, 100);
}
// A press on the rail's selector opens the layer at once and drops the list
// from the layer's selector, so the list shows the full names however soon
// after the hover it is pressed (the rail's own would list the two digits).
function pesSelectorFromRail(e) {
  if (S.sidebarOpen) return;
  e.preventDefault();
  clearTimeout(sidebarTimer); sidebarTimer = null;
  S.sidebarOpen = true; drawSidebarLayer();
  const twin = document.getElementById("pes-version-open");
  twin.focus();
  // Not every browser opens a select's list from script; there the focused
  // twin opens on the next press or Alt+Down.
  if (twin.showPicker) twin.showPicker();
}
function sidebarLeave() {
  clearTimeout(sidebarTimer); sidebarTimer = null;
  sidebarCloseCheck();
}
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  sb.append(...sidebarItems(false));
  // A pointer or focus outside everything that holds the layer closes it; a
  // window opening or a control inside taking focus keeps it.
  if (S.sidebarOpen) sidebarCloseCheck();
  drawSidebarLayer();
}
// Listeners once on the rail itself: hover arms the 100 ms open, leaving or
// moving to the layer decides; keyboard focus inside opens at once.
document.getElementById("sidebar").addEventListener("pointerenter", sidebarEnter);
document.getElementById("sidebar").addEventListener("pointerleave", e => {
  if (!(document.getElementById("sb-open") || { contains: () => false }).contains(e.relatedTarget)) sidebarLeave();
});
document.getElementById("sidebar").addEventListener("pointerdown", () => sidebarPress = true);
// A press on a rail control spends the rest timer (its focus must not open the
// layer mid-press), so the release on the rail starts the rest again: the
// pointer is still resting there.
document.getElementById("sidebar").addEventListener("pointerup", () => {
  sidebarPress = false;
  if (!S.sidebarOpen) sidebarEnter();
});
document.getElementById("sidebar").addEventListener("focusin", e => {
  clearTimeout(sidebarTimer); sidebarTimer = null;
  if (sidebarPress) return;
  if (!S.sidebarOpen) { S.sidebarOpen = true; drawSidebarLayer(); }
  // The twin under the layer is covered: the layer's same control takes
  // focus (tool entries by data-id, the rest by id + "-open").
  const ae = e.target;
  const sel = ae.dataset && ae.dataset.id ? `.tool[data-id="${ae.dataset.id}"]`
    : ae.id ? "#" + ae.id + "-open" : null;
  const same = sel && document.getElementById("sb-open")
    && document.getElementById("sb-open").querySelector(sel);
  if (same) same.focus();
});
document.getElementById("sidebar").addEventListener("focusout", () => {
  setTimeout(sidebarCloseCheck);
});

// The central panel is the active tool's: each registered tool gets a stub until
// its own draft exists (tools/<tool>.js).
// The link the page opened on (set by the last script): applied once, after
// the named view's firstShow, before its first draw.
let pendingLink = null, inFirstShow = false;
function renderCenter() {
  const center = document.getElementById("center");
  const oldLog = center.querySelector(".log-body");
  if (oldLog) S.logScroll = oldLog.scrollTop;
  center.className = "center"; // a view may add its own classes each draw
  const t = TOOLS.find(t => t.id === S.activeTool);
  const view = VIEWS[S.activeTool];
  // The first-run dialog asks before any tool view (ST-RUN-01).
  if (S.settingsFile === "none") { center.innerHTML = ""; return; }
  if (view) {
    // Once per page life; marked shown first, since firstShow may render().
    if (view.firstShow && !view.shown) {
      view.shown = true; inFirstShow = true;
      view.firstShow();
      inFirstShow = false;
    }
    // A render firstShow triggered has drawn its own start; the link's state
    // wins the draw below.
    if (pendingLink && !inFirstShow) {
      const pl = pendingLink; pendingLink = null;
      if (view.linkOpen) view.linkOpen(pl.screen, pl.keys);
    }
    view.draw(center); // the view owns the center's content (not cleared)
    return;
  }
  center.innerHTML = "";
  center.append(h("h2", {}, t.label),
    weak("This view will be drawn in its own draft, tools/" + t.id.replaceAll("-", "_") + ".js."));
  if (t.id === "team-compiler") {
    const a = S.activities["team-compiler"];
    const compileBtn = button("Compile", startCompile, { disabled: !!a, title: "A fake run of 48 teams" });
    compileBtn.id = "compile-btn";
    // The pipeline tool's claim order (gui.md "Shell layout"): the grid in what
    // remains, the run strip, the log panel at the bottom.
    center.append(h("div", { class: "pipe" },
      named(h("div", { class: "pipe-grid" },
        h("table", { class: "grid" },
          [["/3/", "701"], ["/a/", "702"], ["/co/", "714"]].map(([name, id]) =>
            h("tr", { class: "sel" + (S.gridHighlight === name ? " highlight" : ""), "data-scope": name },
              h("td", { class: "mono" }, name), h("td", { class: "mono" }, id)))),
        // The common settings reach every tool at its next frame (ST-SET-02).
        weak("Threads: " + S.settings.common.thread_count)), "compile-grid"),
      named(row(compileBtn,
        a ? h("span", { class: "mono", id: "compile-progress" }, `${a.done}/${a.total} · ${mmss(a.elapsed)}`) : null), "run"),
      named(logPanel(), "log")));
    const lb = center.querySelector(".log-body");
    if (lb) lb.scrollTop = S.logStick ? lb.scrollHeight : S.logScroll;
  }
}

// Status bar (gui.md "Status bar"): left the version (always visible, the one
// always-visible item) then one entry per ShellCondition; middle the latest
// Notice, centred as a group in its kind's bright colour; right the other
// tools' ToolActivitys. The row is a fixed 24px: long texts are cut and carry
// the full text as their tooltip.
function renderStatus() {
  const left = document.getElementById("status-left");
  left.innerHTML = "";
  left.append(h("span", { class: "weak small" }, "v0.1.0"));
  // A frameless button in the version's own small weak text, so it reads as
  // part of the bar: the window back to its default size, centred, a
  // maximized one restored first. Absent while the window is at that size.
  const reset = button("Reset window", () => { sizeWindow("default"); render(); },
    { frame0: true, title: "Back to the default window size, centred on its monitor" });
  reset.id = "reset-window";
  reset.classList.add("weak", "small");
  left.append(reset);
  showReset();
  for (const c of CONDITION_DEFS) if (S.conditions.includes(c.id))
    left.append(h("span", { class: "cond", title: c.tip() },
      h("span", { class: "icon" }, c.icon), h("span", {}, c.text()),
      c.action && button(c.action.label, () =>
        window_(c.action.label, weak(c.action.does), [button("OK", closeWindow)]))));
  const mid = document.getElementById("status-middle");
  mid.innerHTML = "";
  const n = S.notice;
  if (n) {
    mid.append(h("span", { class: "notice-txt " + n.kind, title: n.text }, n.text));
    if (n.action) {
      // An action that switches the PES version (SwitchVersion) is the
      // selector's change, so the selector's blocker disables it, with the
      // blocked reason on a hover-sensing wrapper, and the notice stays.
      const blocked = n.action.switchesVersion && !!S.blocker;
      const actBtn = button(n.action.label, () => {
        const act = n.action; dismissNotice(); act.run();
      }, { disabled: blocked });
      actBtn.id = "notice-action";
      mid.append(blocked ? h("span", { title: pesSelectorTip() }, actBtn) : actBtn);
    }
    const x = button("\uE4F6", dismissNotice, { frame0: true, title: "Dismiss" });
    x.id = "notice-dismiss";
    mid.append(x);
  }
  const right = document.getElementById("status-right");
  right.innerHTML = "";
  activityIds(false).forEach((id, i) => {
    const txt = activityText(id, S.activities[id]);
    if (i) right.append(h("span", { class: "weak" }, " · "));
    right.append(h("span", { class: "act", title: txt }, txt));
  });
}

// The middle slot's item kind. A new notice replaces the current one (older
// notices are not kept); one without an action leaves by itself after the
// draft's timeout, one with an action stays until clicked or dismissed. A
// notice published while the window is unfocused holds its text in the title.
let noticeTimer = null;
// kind is the notice's NoticeKind ("success" / "info" / "warning"): it picks the
// text's colour, so every publisher says one.
// Returns the notice, which a tool script keeps to ask noticeShown(n) later
// (its own S shadows the shell's).
function publishNotice(text, action, kind) {
  const n = { text, action, kind };
  S.notice = n;
  clearTimeout(noticeTimer); noticeTimer = null;
  if (!action) noticeTimer = setTimeout(() => {
    if (S.notice === n) { S.notice = null; render(); }
  }, S.noticeTimeoutS * 1000);
  if (!S.focused) S.heldTitleNotice = text;
  render();
  return n;
}
function dismissNotice() { S.notice = null; clearTimeout(noticeTimer); noticeTimer = null; render(); }
// Whether the notice n is still the one the status bar shows (not dismissed,
// acted on or replaced by a newer one).
function noticeShown(n) { return S.notice === n; }
// The stub every "Open output" action runs (the compile's included).
// sample wording: the fake window's text.
const openOutputStub = () => window_("Open output",
  weak("Opens the output folder in the file browser"), [button("OK", closeWindow)]);

// The Team compiler stub's fake run: 48 teams, one every 250 ms, elapsed counted
// from the start; its activity is what the right slot and the title read while
// another tool is active. No cancel button: the tool's own draft owns that.
let compileTimer = null;
function startCompile() {
  const start = Date.now();
  S.activities["team-compiler"] = { done: 0, total: 48, elapsed: 0 };
  let warnFlip = 0; // every fourth team reports logo_upscaled, kit_colors_derived in turn
  render();
  compileTimer = setInterval(() => {
    const a = S.activities["team-compiler"];
    if (!a) { clearInterval(compileTimer); compileTimer = null; return; }
    const team = COMPILE_TEAMS[a.done];
    a.done++;
    a.elapsed = Math.floor((Date.now() - start) / 1000);
    const lines = [mkLine("export_identified", team)];
    if (a.done % 4 === 0)
      lines.push(mkLine(["logo_upscaled", "kit_colors_derived"][warnFlip++ % 2], team));
    if (team === "/co/") lines.push(mkLine("portrait_conflict", team));
    appendLog(lines);
    if (a.done >= a.total) {
      clearInterval(compileTimer); compileTimer = null;
      delete S.activities["team-compiler"];
      appendLog([{ severity: "Info", code: null, scope: null, text: "Info - Compiled 48 teams" }]);
      publishNotice("Compiled 48 teams", { label: "Open output", run: openOutputStub }, "success");
      return;
    }
  }, 250);
}

// ---- Log panel (gui.md "Log panel"), drawn in the Team compiler's stub ----
// The simulated compile's 48 teams: teams_list.txt rows 701 to 748, so the
// three grid rows (/3/, /a/, /co/) are real scopes.
const COMPILE_TEAMS = ["/3/", "/a/", "/aco/", "/adv/", "/an/", "/asp/", "/b/", "/bant/",
  "/biz/", "/c/", "/cgl/", "/ck/", "/cm/", "/co/", "/d/", "/diy/", "/e/", "/f/", "/fa/",
  "/fit/", "/g/", "/gd/", "/gif/", "/h/", "/his/", "/hm/", "/hr/", "/i/", "/ic/", "/int/",
  "/jp/", "/k/", "/lgbt/", "/lit/", "/m/", "/mlp/", "/mu/", "/n/", "/o/", "/out/", "/p/",
  "/po/", "/pol/", "/pw/", "/r9k/", "/s/", "/s4s/", "/sci/"];
const LOG_CAP = 300;
// One line per catalog code, in the panel's own shape: the severity, the scope,
// the code (drawn as a link) and the condition's text with its `code` spans
// unwrapped.
function mkLine(code, scope) {
  const r = CATALOG["team-compiler"].find(r => r.code === code);
  return { severity: r.severity, code, scope,
    text: `${r.severity} - ${scope} - ${code}: ${r.condition.replaceAll("`", "")}` };
}
// The Team compiler's stub's options: the code links open its catalog, a line
// click highlights the scope's grid row.
const LOG_COMPILER = { tool: "team-compiler", onLine: gotoScope };
// The widget's single append point: while the view is not stuck to the bottom,
// arrivals are counted for the jump indicator instead of moving it. st is the
// panel state (the shell's S, or a view's own copy of its six log* fields).
function appendLog(lines, st = S) {
  st.log.push(...lines);
  if (!st.logStick) st.logNew += lines.length;
  render();
}
const LOG_FILTERS = {
  all: () => true,
  warnings: l => l.severity !== "Info",
  errors: l => l.severity === "Error" || l.severity === "Fatal",
};
const filteredLog = st => st.log.filter(LOG_FILTERS[st.logFilter]);
// A finding line's scope is a grid row's team name; the click highlights it
// (one at a time) and scrolls it into view. A scope with no row highlights
// nothing.
function gotoScope(scope) {
  S.gridHighlight = scope;
  render();
  const tr = document.querySelector(`#center tr[data-scope="${scope}"]`);
  if (tr) tr.scrollIntoView({ block: "nearest" });
}
// One displayed line, coloured by severity. The code is a link to its catalog
// row in the help (ST-HELP-03); the rest of a Warning, Error or Fatal line
// cross-links to the grid (gui.md "Log panel", "Cross-linking").
// sample wording: the link's tooltip.
function logLine(l, opts) {
  const cls = l.severity === "Warning" ? " warn" : l.severity === "Info" ? "" : " err";
  const kids = [l.text];
  if (l.code && (CATALOG[opts.tool] || []).some(r => r.code === l.code)) {
    // " <code>": the console's "<Severity> <code> at", the stub's "<scope> - <code>:".
    const i = l.text.indexOf(" " + l.code) + 1;
    if (i > 0) kids.splice(0, 1, l.text.slice(0, i),
      h("span", { class: "msg-link", title: "Open the help at this message",
        onclick: e => { e.stopPropagation();
          openHelp({ tool: opts.tool, topic: "messages", anchor: l.code }); } }, l.code),
      l.text.slice(i + l.code.length));
  }
  return h("div", { class: "line" + cls,
    onclick: l.severity === "Info" ? null : opts.onLine ? () => opts.onLine(l.scope) : null }, kids);
}
// The 4px handle above the header: a drag rewrites S.logHeight (min 60), the
// body follows at the next render.
function logDivider(st) {
  return h("div", { class: "log-divider", onmousedown: e => {
    if (e.button !== 0) return;
    const startY = e.clientY, startH = st.logHeight, scl = winScale();
    const move = ev => { st.logHeight = Math.max(60, startH + (startY - ev.clientY) / scl); };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      render();
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
    e.preventDefault();
  } });
}
// The scroll area: fixed S.logHeight, the last LOG_CAP filtered lines. Leaving
// the bottom pauses the stick and shows the jump counter; returning to it (or
// clicking it) resumes. The rebuild restores the paused scrollTop, so arriving
// lines never move the view. sample wording: the jump button's tooltip, the
// chevrons' tooltips and the header's count line.
function logBody(st, lines, opts) {
  const body = h("div", { class: "log-body", style: `height:${st.logHeight}px`,
    onscroll: e => {
      const b = e.currentTarget;
      if (b.scrollTop + b.clientHeight >= b.scrollHeight - 2) {
        if (!st.logStick || st.logNew) { st.logStick = true; st.logNew = 0; render(); }
      } else if (st.logStick) { st.logStick = false; render(); }
    } }, lines.map(l => logLine(l, opts)));
  return h("div", { class: "log-wrap" }, body,
    !st.logStick && st.logNew > 0
      ? h("button", { class: "jump", title: "Jump to the newest line",
          onclick: () => { st.logStick = true; st.logNew = 0; render(); } }, `↓ ${st.logNew} new`)
      : null);
}
function logPanel(st = S, opts = LOG_COMPILER) {
  const chevron = button(st.logCollapsed ? "▸" : "▾",
    () => { st.logCollapsed = !st.logCollapsed; render(); },
    { frame0: true, title: st.logCollapsed ? "Expand the log" : "Collapse the log" });
  chevron.id = "log-chevron";
  const chips = [["all", "All"], ["warnings", "Warnings"], ["errors", "Errors"]].map(([v, label]) =>
    selectable(label, st.logFilter === v, () => st.logFilter = v));
  const shown = filteredLog(st);
  const drawn = shown.slice(-LOG_CAP);
  const count = shown.length > LOG_CAP ? `last ${LOG_CAP} of ${shown.length}`
    : shown.length < st.log.length ? `${shown.length} of ${st.log.length} lines`
    : `${shown.length} lines`;
  const header = h("div", { class: "log-header" }, chevron, strong("Log"), chips,
    h("span", { class: "weak log-count" }, count));
  if (st.logCollapsed) return h("div", { class: "log-panel" }, header);
  return h("div", { class: "log-panel" }, logDivider(st), header, logBody(st, drawn, opts));
}

// ---- Layout edit (gui.md "Prototypes before implementation") ----
// The maintainer tunes an arrangement by hand and pastes the result to the
// lead; the tweaks are evidence, never a layout the views load. A move pins
// the panel where it was dropped (window points; the slot keeps its place so
// the move pushes nothing, and no other panel's resize moves it), a resize a
// fixed width and height (the neighbours reflow). One localStorage object,
// applied after every render whether the toggle is on or off.
const LAYOUT_KEY = "drafts.layout";
const loadLayout = () => JSON.parse(localStorage.getItem(LAYOUT_KEY) || "{}");
const saveLayout = t => localStorage.setItem(LAYOUT_KEY, JSON.stringify(t));
// The active view's screen (its hook, or "main").
const viewScreen = () => {
  const v = VIEWS[S.activeTool];
  return v && v.screen ? v.screen() : "main";
};
// The key a panel's tweak is stored under: <tool>/<screen>/<name>; a floating
// panel window's is <tool>/window/<name>, whatever the tab it was opened on.
const layoutKey = el => S.activeTool + "/" +
  (el.classList.contains("panel") ? "window" : viewScreen()) + "/" + el.dataset.panel;
// The inline styles a tweak or the edit overlay set, kept so an untouched
// panel returns to the page's own values.
const layoutOriginals = new WeakMap();
const captureOriginals = el => {
  if (!layoutOriginals.has(el)) layoutOriginals.set(el,
    { transform: el.style.transform, width: el.style.width,
      height: el.style.height, position: el.style.position,
      left: el.style.left, top: el.style.top, right: el.style.right,
      outline: el.style.outline });
};
function untweak(el) {
  const o = layoutOriginals.get(el);
  if (!o) return;
  el.style.transform = o.transform; el.style.width = o.width;
  el.style.height = o.height; el.style.position = o.position;
  el.style.left = o.left; el.style.top = o.top; el.style.right = o.right;
  el.style.outline = o.outline;
  layoutOriginals.delete(el);
}
// Window points: the layout coordinates inside #win-body (the scale's own
// unit), origin at .main's top left, the frame copyLayout already uses.
// getBoundingClientRect is drawn pixels, so a rect read divides by the scale;
// offset* and inline styles are already points.
const mainRect = () => document.querySelector("#win .main").getBoundingClientRect();
const rectPoints = r => {
  const s = winScale(), m = mainRect();
  return { x: (r.left - m.left) / s, y: (r.top - m.top) / s,
    w: r.width / s, h: r.height / s };
};
// The stored resize of a panel of the active screen, or 0 when it is not
// resized: a tool's columned panel reads it at draw to pick its column count.
const layoutPanelW = name => {
  const t = loadLayout()[S.activeTool + "/" + viewScreen() + "/" + name];
  return t && t.w != null ? t.w : 0;
};
function applyTweak(el, t, store) {
  captureOriginals(el);
  // A move's old form (a dx/dy offset from the layout spot) is read once as
  // the position it had put the panel at, then stored as a pin: saved
  // layouts survive the change of shape.
  if (t.x == null && (t.dx != null || t.dy != null)) {
    const p = rectPoints(el.getBoundingClientRect());
    t.x = Math.round(p.x + (t.dx || 0)); t.y = Math.round(p.y + (t.dy || 0));
    delete t.dx; delete t.dy;
    if (store) saveLayout(store);
  }
  if (t.w != null) el.style.width = t.w + "px";
  if (t.h != null) el.style.height = t.h + "px";
  if (t.x != null) {
    // Pinned where it was dropped: the slot keeps the panel's place and
    // current size in the flow (a resize still reflows the others), and the
    // panel draws at the point, whatever the layout around it does. Fixed,
    // so the transformed #win-body is the containing block at every scale. A
    // .panel window was never in the flow, so it leaves no slot.
    if (!el.classList.contains("panel")) {
      // Measured before the slot lands: the slot itself could squeeze the
      // panel in a flex row. Its drawn size holds, like its slot's: fixed
      // and left at the containing block's edge or past it, the panel would
      // shrink to fit the space that remains.
      const w0 = el.offsetWidth, h0 = el.offsetHeight;
      el.before(h("div", { class: "le-slot",
        style: `width:${w0}px; height:${h0}px; flex:none` }));
      el.style.width = w0 + "px"; el.style.height = h0 + "px";
    }
    el.style.position = "fixed";
    el.style.left = t.x + "px"; el.style.top = t.y + "px"; el.style.right = "auto";
  }
}
// After every render(): the stored tweaks on the active tool's panels, plus
// the edit overlays while the toggle is on.
function layoutApply() {
  const center = document.getElementById("center");
  center.classList.toggle("layout-editing", S.layoutEdit);
  center.querySelectorAll(".le-ov, .le-slot").forEach(e => e.remove());
  const store = loadLayout();
  const scr = viewScreen();
  center.querySelectorAll("[data-panel]").forEach(el => {
    const key = layoutKey(el);
    if (store[key]) applyTweak(el, store[key], store);
    if (!S.layoutEdit) {
      // The tweaks stay (toggle on or off); only the overlay's own marks go.
      // A pinned panel keeps the position the pin set.
      const o = layoutOriginals.get(el);
      if (o) { el.style.outline = o.outline;
        if (!(store[key] && store[key].x != null)) el.style.position = o.position; }
      if (!store[key]) untweak(el);
      return;
    }
    // An untweaked panel returns to the page's own values (Reset run with the
    // toggle on, or a tweak dropped from another screen).
    if (!store[key]) untweak(el);
    let depth = 0, p = el.parentElement;
    while (p) { if (p.dataset && p.dataset.panel) depth++; p = p.parentElement; }
    captureOriginals(el);
    if (getComputedStyle(el).position === "static") el.style.position = "relative";
    el.style.outline = "1px dashed var(--sel-fg)";
    el.append(h("div", { class: "le-ov", style: "z-index:" + Math.min(60 + depth, 99) },
      h("span", { class: "le-tag" },
        h("span", { class: "le-name" }, el.dataset.panel),
        h("span", { class: "le-handle", title: "Drag to move",
          onmousedown: e => layoutDrag(e, el, key, "move") }, "↕")),
      h("span", { class: "le-grip", title: "Drag to resize",
        onmousedown: e => layoutDrag(e, el, key, "resize") }, "◢")));
  });
}
// The handle's drag, in window points (a pointer delta reads drawn pixels,
// so it divides by the scale): a move pins the panel where it lands, a
// resize gives a width and height (40 px minimum) the neighbours reflow
// around.
function layoutDrag(e, el, key, kind) {
  if (e.button !== 0) return;
  e.preventDefault(); e.stopPropagation();
  const startX = e.clientX, startY = e.clientY, scl = winScale();
  const base = kind === "move" ? rectPoints(el.getBoundingClientRect())
    : { w: el.offsetWidth, h: el.offsetHeight };
  let pending = null;
  const move = ev => {
    const ddx = (ev.clientX - startX) / scl, ddy = (ev.clientY - startY) / scl;
    pending = kind === "move" ? { x: Math.round(base.x + ddx), y: Math.round(base.y + ddy) }
      : { w: Math.max(40, base.w + ddx), h: Math.max(40, base.h + ddy) };
    // The drag's preview is the plain translate, applied on top of whatever
    // the panel's tweak already draws.
    if (kind === "move") el.style.transform = `translate(${ddx}px, ${ddy}px)`;
    else { el.style.width = pending.w + "px"; el.style.height = pending.h + "px"; }
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    // A resize stores the size the layout actually gave, not the one asked
    // for. A render mid-drag may have detached the element, so the size is
    // read on the same-named panel now drawn, or the asked one when there is
    // none; a drag that changed nothing stores nothing. A columned panel
    // (data-colw) stores the asked size instead: what the layout gave is the
    // un-reflowed size, the reflow itself following the asked one.
    if (kind === "resize" && el.dataset.colw === undefined) {
      const live = el.isConnected ? el
        : document.getElementById("center").querySelector(`[data-panel="${el.dataset.panel}"]`);
      if (live) pending = { w: live.offsetWidth, h: live.offsetHeight };
    }
    const same = pending && (kind === "move"
      ? pending.x === Math.round(base.x) && pending.y === Math.round(base.y)
      : pending.w === base.w && pending.h === base.h);
    if (pending && !same) {
      const s = loadLayout(), cur = s[key] || {};
      if (kind === "move") { delete cur.dx; delete cur.dy; }
      s[key] = { ...cur, ...pending }; saveLayout(s);
    }
    render();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}
// One line per tweaked panel of the active tool, in the window's points;
// the window_'s field shows it too (a page from disk may refuse the
// clipboard).
function copyLayout() {
  const store = loadLayout();
  const center = document.getElementById("center");
  // Rectangles in the window's content area (under #titlebar, inside #win's
  // border), which .main's top left is.
  const winBox = document.getElementById("win").getBoundingClientRect();
  const wh = Math.round(winBox.width - SBW) + "x" + Math.round(winBox.height);
  const zoom = Math.round(devicePixelRatio * 100) + "%";
  const scr = viewScreen();
  const fmt = r => { const p = rectPoints(r);
    return Math.round(p.x) + "," + Math.round(p.y) + " " + Math.round(p.w) + "x" + Math.round(p.h); };
  const lines = ["The drafts' layout tweaks, rectangles in window points before -> after:"];
  for (const [key, t] of Object.entries(store)) {
    const parts = key.split("/");
    const tool = parts[0], screen = parts.slice(1, -1).join("/"), panel = parts[parts.length - 1];
    if (tool !== S.activeTool) continue;
    const head = `${tool}/${screen} window ${wh} zoom ${zoom}`;
    const el = screen === scr || screen === "window"
      ? center.querySelector(`[data-panel="${panel}"]`) : null;
    const sz = `${t.x != null ? "pinned at " + Math.round(t.x) + "," + Math.round(t.y) : "not pinned"} size ${t.w == null ? "unchanged" : t.w + "x" + t.h}`;
    if (!el) {
      lines.push(`${head} ${panel}: ${screen === scr || screen === "window"
        ? "not drawn now (a closed window or an empty panel)" : "not on this screen"}, ${sz}`);
      continue;
    }
    if (el.getClientRects().length === 0) {
      lines.push(`${head} ${panel}: hidden now, ${sz}`);
      continue;
    }
    // "Before" is the panel with the page's own inline values, not with
    // none: its slot, hidden while it is measured, is where a pinned one
    // would sit.
    const saved = { transform: el.style.transform, width: el.style.width, height: el.style.height,
      position: el.style.position, left: el.style.left, top: el.style.top, right: el.style.right };
    const own = layoutOriginals.get(el) || { transform: "", width: "", height: "",
      position: "", left: "", top: "", right: "" };
    const slot = el.previousElementSibling && el.previousElementSibling.classList.contains("le-slot")
      ? el.previousElementSibling : null;
    el.style.transform = own.transform; el.style.width = own.width; el.style.height = own.height;
    el.style.position = own.position; el.style.left = own.left; el.style.top = own.top;
    el.style.right = own.right;
    if (slot) slot.style.display = "none";
    const before = fmt(el.getBoundingClientRect());
    applyTweak(el, t);
    const after = fmt(el.getBoundingClientRect());
    // The re-apply left its own slot beside the kept one: it goes, and the
    // styles back to the drawn ones.
    const reSlot = el.previousElementSibling !== slot && el.previousElementSibling
      && el.previousElementSibling.classList.contains("le-slot") ? el.previousElementSibling : null;
    el.style.transform = saved.transform; el.style.width = saved.width; el.style.height = saved.height;
    el.style.position = saved.position; el.style.left = saved.left; el.style.top = saved.top;
    el.style.right = saved.right;
    if (reSlot) reSlot.remove();
    if (slot) slot.style.display = "";
    lines.push(`${head} ${panel}: ${before} -> ${after}`);
  }
  const text = lines.join("\n");
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  window_("Copy layout", h("textarea", { class: "mono", readonly: true,
    style: "width:620px; height:220px" }, text), [button("OK", closeWindow)]);
}

// ---- Remarks (gui.md "The host's other review aids") ----
// The maintainer pins a note to the panel or control it is about, and Copy
// remarks hands the lead one line per note with the link that reopens the
// state it was made on. While the toggle is on, a click inside the window
// opens a note instead of acting, and the screen's notes show as numbered
// markers. One localStorage list, like the layout tweaks.
const REMARKS_KEY = "drafts.remarks";
const loadRemarks = () => JSON.parse(localStorage.getItem(REMARKS_KEY) || "[]");
const saveRemarks = list => localStorage.setItem(REMARKS_KEY, JSON.stringify(list));
// The controls a note pins to: the nearest of these around the click.
const REMARK_CONTROLS = "button, select, input, textarea, label, .sel, td";
// A control's name: its visible text, else its title, placeholder or label.
// A select shows its picked option; an input's typed value is not its name,
// since an edit would lose the note's element.
function remarkControlName(el) {
  const text = el.tagName === "SELECT" ? (el.selectedOptions[0] || {}).text
    : el.tagName === "INPUT" || el.tagName === "TEXTAREA" ? "" : el.innerText;
  const label = el.labels && el.labels[0] ? el.labels[0].innerText : "";
  const name = [text, el.title, el.placeholder, label]
    .map(s => (s || "").replace(/\s+/g, " ").trim()).find(s => s) || "";
  return name.slice(0, 40);
}
// What a click is about: the nearest named panel (or the window), and the
// control it landed on, null on a panel's empty area.
function remarkTarget(el) {
  const panel = el.closest("[data-panel]"), control = el.closest(REMARK_CONTROLS);
  return { panel: panel ? panel.dataset.panel : "window",
    control: control ? remarkControlName(control) || null : null };
}
// The element a note is drawn on now (the first drawn control of its name in
// its panel, or the panel), or null.
function remarkElement(note) {
  const win = document.getElementById("win");
  const drawn = el => el && el.getClientRects().length > 0 ? el : null;
  if (note.control === null)
    return drawn(note.panel === "window" ? win : win.querySelector(`[data-panel="${note.panel}"]`));
  return [...win.querySelectorAll(REMARK_CONTROLS)].find(el => {
    if (el.closest(".rm-pop") || !drawn(el)) return false;
    const t = remarkTarget(el);
    return t.panel === note.panel && t.control === note.control;
  }) || null;
}
const closeRemarkPopup = () => document.querySelectorAll(".rm-pop").forEach(p => p.remove());
// The note's popup at the click, titled with what it is pinned to; index is
// the saved note's place in the list, or -1 for a new one.
function remarkPopup(x, y, target, index) {
  closeRemarkPopup();
  const field = h("textarea", { style: "width:280px; height:80px" },
    index >= 0 ? loadRemarks()[index].text : "");
  const store = change => {
    const notes = loadRemarks();
    change(notes);
    saveRemarks(notes);
    closeRemarkPopup();
    render();
  };
  const save = () => store(notes => {
    const note = { ...target, text: field.value.trim(),
      link: location.pathname.split("/").pop() + location.hash };
    if (index >= 0) notes[index] = note; else notes.push(note);
  });
  const win = document.getElementById("win");
  // Keys typed into the note stay out of the view's shortcuts.
  const pop = h("div", { class: "rm-pop", onkeydown: e => e.stopPropagation() },
    h("div", { class: "title" }, target.panel + (target.control ? " › " + target.control : "")),
    field,
    h("div", { class: "row", style: "justify-content:flex-end; margin-top:6px" },
      button("Save", save),
      index >= 0 ? button("Delete", () => store(notes => notes.splice(index, 1))) : null,
      button("Cancel", closeRemarkPopup)));
  win.append(pop);
  // Kept inside the window, as a menu is.
  const [left, top] = inWin(x, y);
  pop.style.left = Math.max(4, Math.min(left, win.clientWidth - pop.offsetWidth - 4)) + "px";
  pop.style.top = Math.max(4, Math.min(top, win.clientHeight - pop.offsetHeight - 4)) + "px";
  field.focus();
}
// Caught in the capture phase on the window, before the page's own handlers,
// so the control under the click does not act: a pointer press would start
// a drag, a mouse press open a select, a click toggle or switch. The note's
// popup and the Copy remarks window keep their own clicks.
function remarkCatch(e) {
  if (!S.remarkEdit || e.target.closest(".rm-pop, [data-dlg='copy-remarks']")) return;
  e.preventDefault();
  e.stopPropagation();
  if (e.type !== "click") return;
  const target = { tool: S.activeTool, screen: viewScreen(), ...remarkTarget(e.target) };
  const index = loadRemarks().findIndex(n => n.tool === target.tool && n.screen === target.screen
    && n.panel === target.panel && n.control === target.control);
  remarkPopup(e.clientX, e.clientY, target, index);
}
for (const type of ["pointerdown", "mousedown", "click", "dblclick"])
  document.getElementById("win").addEventListener(type, remarkCatch, true);

// The Overlay control (gui.md "The host's other review aids"): the built window's capture
// of the active screen, <tool>_<screen>.png in the captures folder, the client area at the
// simulated window's size. The folder is named once, by this literal, which the bundler
// leaves as it is: the captures do not travel with an attachment.
const CAPTURES = "assets/captures/";
const captureFile = () => CAPTURES + S.activeTool.replaceAll("-", "_") + "_" + viewScreen() + ".png";
// After every render(): the capture over the window body at half opacity (clicks pass
// through it to the draft), or beside the window; a missing file shows, in its place, the
// name it looked for.
function overlayApply() {
  document.querySelectorAll(".capture").forEach(c => c.remove());
  if (S.overlay === "off") return;
  const img = h("img", { src: captureFile(), alt: "" });
  img.addEventListener("error", () =>
    img.replaceWith(h("div", { class: "capture-missing weak" }, "No capture: " + captureFile())));
  const box = h("div", { class: "capture capture-" + S.overlay }, img);
  const win = document.getElementById("win"), body = document.getElementById("win-body");
  if (S.overlay === "over") {
    box.style.left = body.offsetLeft + "px";
    box.style.top = body.offsetTop + "px";
    win.append(box);
  } else {
    // Level with the window body: the capture is the client area, under no title bar.
    box.style.marginTop = (win.offsetTop + win.clientTop + body.offsetTop) + "px";
    win.after(box);
  }
}
// After every render(): the screen's notes as markers at their element's
// top-right corner, numbered by their line in Copy remarks; none, and no
// popup, while the toggle is off.
function remarksApply() {
  const win = document.getElementById("win");
  win.querySelectorAll(".rm-mark").forEach(m => m.remove());
  if (!S.remarkEdit) { closeRemarkPopup(); return; }
  const scr = viewScreen();
  loadRemarks().forEach((note, i) => {
    if (note.tool !== S.activeTool || note.screen !== scr) return;
    const el = remarkElement(note);
    if (!el) return;
    const r = el.getBoundingClientRect();
    const [left, top] = inWin(r.right, r.top);
    // Clamped, so the window's own corner (a note on no panel) stays in view.
    win.append(h("span", { class: "rm-mark", style:
      `left:${Math.min(left, win.clientWidth - 8)}px; top:${Math.max(top, 8)}px` }, String(i + 1)));
  });
}
// Every tool's notes, one line each: what it is pinned to, the note (its
// line breaks joined) and its link; the window_'s field shows them too (a
// page from disk may refuse the clipboard).
function copyRemarks() {
  const lines = ["The drafts' remarks, one per note: tool/screen › panel › control: note, then the link to its state:"];
  for (const n of loadRemarks())
    lines.push(`${n.tool}/${n.screen} › ${n.panel}${n.control ? " › " + n.control : ""}: `
      + `${n.text.split(/\r?\n/).join(" / ")}  ${n.link}`);
  const text = lines.join("\n");
  if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {});
  window_("Copy remarks", h("textarea", { class: "mono", readonly: true,
    style: "width:620px; height:220px" }, text), [button("OK", closeWindow)], "copy-remarks");
}

</script>
<script src="tools/ruleset_editor.js"></script>
<script src="tools/save_editor.js"></script>
<script src="tools/export_upgrader.js"></script>
<script>
// Last, after the tool scripts: they must have registered their views with
// registerTool first. The hash picks the first tool and carries its state:
// #<tool>/<screen>?<key>=<value>&... (the id's hyphens as underscores); the
// bare #<tool-id> still opens the tool at its start.
const hashText = location.hash.slice(1);
const qAt = hashText.indexOf("?");
const pathPart = qAt < 0 ? hashText : hashText.slice(0, qAt);
const queryPart = qAt < 0 ? "" : hashText.slice(qAt + 1);
const slashAt = pathPart.indexOf("/");
const hashTool = (slashAt < 0 ? pathPart : pathPart.slice(0, slashAt)).replaceAll("_", "-");
// The shell's windows apply after the first render: a firstShow or a
// linkOpen window would replace them if they opened first.
const afterLink = [];
if (TOOLS.some(t => t.id === hashTool && t.registered)) {
  S.activeTool = hashTool;
  const keys = Object.fromEntries(new URLSearchParams(queryPart));
  // The shell's own keys apply first; the view's pendingLink sees the rest.
  const take = (name, apply) => {
    if (keys[name] === undefined) return;
    apply(keys[name]);
    delete keys[name];
  };
  // pes is the shell's own key, set before the view's firstShow reads it.
  take("pes", v => PES_VERSIONS.includes(v) ? setPesVersion(v)
    : console.warn("link: pes=" + v));
  take("exe", v => {
    if (["selected", "other", "none", "no_folder"].includes(v)) {
      S.exeFound = v;
      if (v === "other") S.exeFoundVersion = "2017";
    } else console.warn("link: exe=" + v);
  });
  take("blocker", v => {
    if (v === "1") S.blocker = { tool: "Match tracker",
      reason: "The match tracker holds live memory addresses" };
    else if (v !== "0") console.warn("link: blocker=" + v);
  });
  take("cond", v => {
    S.conditions = v.split(",").filter(id => {
      if (CONDITION_DEFS.some(c => c.id === id)) return true;
      console.warn("link: unknown condition " + id);
      return false;
    });
  });
  take("settings", v => {
    if (["portable", "config", "none"].includes(v)) S.settingsFile = v;
    else console.warn("link: settings=" + v);
  });
  take("rodata", v => {
    if (v === "1") S.dataDirUnwritable = true;
    else if (v !== "0") console.warn("link: rodata=" + v);
  });
  take("overlay", v => {
    if (["over", "beside"].includes(v)) S.overlay = v;
    else console.warn("link: overlay=" + v);
  });
  take("help", v => {
    const [chId, topic] = v.split("/", 2);
    const ch = HELP.find(c => c.id === chId);
    // "messages" is a virtual topic off the tool's catalog, not in HELP.
    const ok = ch && (ch.topics.some(t => t.slug === topic)
      || (topic === "messages" && CATALOG[chId]));
    if (ok) afterLink.push(() => openHelp({ tool: chId, topic }));
    else console.warn("link: help=" + v);
  });
  take("anchor", v => {
    afterLink.push(() => {
      if (S.help) { S.help.anchor = v; S.help.scrollPending = true; }
      else console.warn("link: anchor= without help " + v);
    });
  });
  take("win", v => {
    if (v === "settings") afterLink.push(() => openSettings());
    else if (v === "about") afterLink.push(() => openAbout());
    else console.warn("link: win=" + v);
  });
  try {
    if (slashAt >= 0 && VIEWS[hashTool])
      pendingLink = { screen: decodeURIComponent(pathPart.slice(slashAt + 1)), keys };
  } catch (e) {
    console.warn("link: malformed escape in " + pathPart);
  }
} else if (hashText) console.warn("link: unknown tool " + hashText);
render();
afterLink.forEach(fn => fn());
// An afterLink state change that draws no window itself (the anchor's scroll)
// needs one more pass.
if (afterLink.length) render();
// A link pasted into the open page's address fires hashchange; reopen the
// page so the link parses as a fresh one (replaceState does not fire it).
addEventListener("hashchange", () => location.reload());
// A page framing the draft (the font trial) keeps it hidden until it has drawn with its faces
// loaded: the canvas text of a render before that is in a fallback font, so it draws again.
if (parent !== window) document.fonts.ready.then(() => {
  render();
  requestAnimationFrame(() => parent.postMessage({ draftDrawn: true }, "*"));
});
</script>
