<title>Unlimited Tool Works (drafts)</title>
<!--
  The drafts' host page (docs/plans/core/gui.md "Prototypes before implementation"),
  drawn only with what egui can draw: the simulated window, the shell's elements
  (the sidebar with the PES selector's states and the About popup, the status
  bar's three slots, the window title, the settings menu, the help window, the
  log panel, the first-run data-location dialog, and stub central panels for the
  tools without a script), the shared stylesheet and the drawing helpers. Each
  tool's view is a script under tools/ (tools/<tool>.js) that registers itself
  with the host and draws into the central panel. Its behaviour is faked with
  sample data, nothing is written.
  Widget mapping: <select> = ComboBox, <input> = TextEdit / DragValue / CheckBox,
  .sel = SelectableLabel, .menu = menu_button, details = CollapsingHeader,
  table.grid = Grid, .window inside .modal-bg = egui's Modal, .help-win = a
  floating Window (its title-bar drag and CSS resize stand for the movable and
  resizable Window; drags elsewhere are Sense::drag), title="" = on_hover_text,
  .sidebar = Panel::left, .bottom = Panel::bottom, .center = CentralPanel,
  .titlebar = ViewportCommand::Title, .log-body = the log panel's ScrollArea.
-->

     (assets/fonts/README.md, verbatim):

     A subset of emoji-icon-font.ttf (https://github.com/jslegers/emoji-icon-font),
     containing only the five glyphs that egui exposes as `egui::special_emojis`:

         U+E618  the Android logo

         U+E624  the GitHub logo
         U+E625  the word `git`
         U+F8FF  the Apple logo

     emoji-icon-font.ttf is left out (the `monochrome_emoji_fonts` feature).

<style>
  :root {
    color-scheme: dark;
    --panel: #1b1b1b; --extreme: #0a0a0a; --faint: #202020; --widget: #3c3c3c;
    --hover: #464646; --active: #373737; --stroke: #3c3c3c; --text: #8c8c8c;
    --strong: #dcdcdc; --sel-bg: #005c80; --sel-fg: #c0deff; --link: #5aaaff;
    --warn: #ff8f00; --error: #ff0000; --changed: #2a3a1e; --success: #4cd964;
    /* The 4cc clover's two greens, its own in both themes. */
    --clover-ring: #129648; --clover-leaf: #8cc642;
    /* The app's own font chains (plans/core/gui.md, the Dark/light theme row), the files
       in assets/fonts/; no system font and no generic family, so a glyph none of them has
       shows as the browser's fallback, which scripts/draft_fonts.py reports. */
    --font-body: "Roboto Flex", "Symbols", "Icons", "egui-icons";
    --font-mono: "Hack", "Roboto Flex", "Symbols", "Icons", "egui-icons";
    /* The pitch's formation name alone: the semibold weight, whose stroke matches the
       game's label (worklog 0.0.1x); everything else stays regular. */
    --font-label: "Roboto Flex Semibold", "Roboto Flex", "Symbols", "Icons", "egui-icons";
  }
  /* The symbols the body font lacks are scripts/make_symbols.py's build, on the body font's
     metrics; egui-icons keeps egui's scale tweak (epaint's FontDefinitions::default). */
  @font-face { font-family: "Roboto Flex"; src: url("assets/fonts/RobotoFlex-Regular.ttf"); }
  @font-face { font-family: "Roboto Flex Semibold"; src: url("assets/fonts/RobotoFlex-Semibold.ttf"); }
  @font-face { font-family: "Symbols"; src: url("assets/fonts/symbols.ttf"); }
  @font-face { font-family: "Hack"; src: url("assets/fonts/Hack-Regular.ttf"); }
  @font-face { font-family: "egui-icons"; src: url("assets/fonts/egui-icons.ttf"); size-adjust: 90%; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: #3a3f47; color: var(--text);
    /* egui's row height: the font's hhea height (1.17 times the size) rounded to whole
       pixels, 15 at 12.5 and 18 at 15, where a browser's normal line keeps the fraction. */
    font: 400 12.5px/1.2 var(--font-body);
    display: flex; align-items: flex-start; overflow: auto;
  }
  /* The simulated window: Studio's window at its default size (plans/core/gui.md "Shell
     layout"), on a desktop-colored page, so the draft shows what fits at that size. The
     harness, not the UI, like the draft controls. Its transform makes the fixed-position
     menus, dialogs and the help window place themselves inside it, as egui's do. */
  /* --win-w and --win-h are the client area's size, as the app's window sizes are: the drawn
     title bar (--tb-h) and the 1px border lie outside it. The window is also drawn wider by
     --sbw, the browser's scroll-bar width (0 where scroll bars overlay the content): a strip
     on its right where the scrolling panes put their bars, so the content gets the width the
     app gives it, whose scroll bars float over the content and take none (the browsers' bars
     differ, 15 points in Chromium and wider in Firefox, where the player view's third column
     wrapped under the first). */
  .win { flex: none; margin: 8px 16px 12px; width: calc(var(--win-w, 50vw) + var(--sbw, 0px) + 2px);
    height: calc(var(--win-h, 50vh) + var(--tb-h, 23px) + 2px);
    display: flex; flex-direction: column; overflow: hidden; position: relative;
    transform: translateZ(0); background: var(--panel);
    border: 1px solid #000; box-shadow: 0 8px 32px #000c; }
  /* Resizable from its bottom-right corner, and maximized to fill the page by the title
     bar's button or a double-click on the bar, as Studio Web's window is (plans/core/gui.md
     "Browser deployment: Studio Web"); the column's Window section reads its size live. */
  .win { resize: both; min-width: 480px; min-height: 320px; }
  .win.max { position: fixed; inset: 0; margin: 0; width: auto !important; height: auto !important;
    resize: none; z-index: 1000; border: none; }
  .titlebar { align-items: center; }
  .titlebar .win-title { flex: 1; }
  .titlebar .win-max { padding: 0 6px; line-height: 1; }
  /* The system's maximize box, drawn rather than typed: the title bar stands for the OS's,
     which egui does not draw, so it takes no glyph from the app's fonts. */
  .titlebar .win-max::before { content: ""; display: inline-block; width: 8px; height: 8px;
    border: 1px solid currentColor; }
  /* The draft controls: one column left of the simulated window, scrolling on its own, in
     sections top to bottom (the window's size, the shell's, the active tool's), each group of
     a section under a rule. Not part of Studio; above a modal, so it stays usable. */
  /* On the app's panel colour, not the desktop page: the theme's greys are tuned for that
     background, and on the page the weak text fell near 2:1. Weak text here reads as body
     text; the sections' strong headings and the groups' rules carry the hierarchy. */
  .draft-side { flex: none; width: 300px; box-sizing: border-box; height: 100vh;
    overflow-y: auto; position: sticky; top: 0; z-index: 15; padding: 8px 8px 8px 10px;
    display: flex; flex-direction: column; gap: 4px; background: var(--panel);
    border-right: 1px solid #000; }
  .draft-side .weak { color: var(--text); }
  .win-size, .draft-controls { display: flex; flex-direction: column; align-items: flex-start;
    gap: 4px; }
  .draft-side .dcsection { color: var(--strong); margin-top: 10px; align-self: stretch;
    border-bottom: 1px solid var(--stroke); padding-bottom: 2px; }
  .draft-side .dcgroup { margin-top: 6px; align-self: stretch; padding-top: 4px;
    border-top: 1px dashed var(--stroke); }
  .draft-side label.cb, .draft-side .group { flex-wrap: wrap; }
  .draft-side select { max-width: 100%; }
  .draft-controls > details { align-self: stretch; }
  /* Everything under the title bar, scaled down together by transform when
     the window is under the design width (the applyScale comment). Always
     transformed (scale(1) at full width), so the fixed-position panels
     inside are contained by it at every size, in window points. */
  .win-body { flex: none; display: flex; flex-direction: column; transform-origin: 0 0; }
  .top, .bottom { background: var(--panel); padding: 3px 8px; display: flex; gap: 8px; align-items: center; }
  .top { border-bottom: 1px solid var(--stroke); }
  .bottom { border-top: 1px solid var(--stroke); min-height: 26px; }
  /* The status bar's contents end where the window's size does, its frame running on
     over the scroll-bar strip. */
  .bottom { padding-right: calc(8px + var(--sbw, 0px)); }
  .main { flex: 1; display: flex; min-height: 0; position: relative; }
  .rail { border-right: 1px solid var(--stroke); padding: 6px; display: flex; flex-direction: column; gap: 3px; }
  /* The icon font the rail draws its 24 px glyphs in (assets/fonts/icons.ttf,
     scripts/make_icons.py's build of resources/icons/; licence above). */
  @font-face { font-family: "Icons"; src: url("assets/fonts/icons.ttf"); }
  .ph { font-family: "Icons"; font-size: 24px; line-height: 1; }
  /* Its scroll bar in the window's strip, kept while nothing scrolls (the .win comment). */
  .center { flex: 1; overflow: auto; padding: 8px 8px 40px; min-width: 0; scrollbar-gutter: stable; }
  .data { width: 590px; border-left: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
  .data pre { flex: 1; margin: 0; overflow: auto; background: var(--extreme); padding: 6px; font: 12px/1.2 var(--font-mono); color: #b4b4b4; }
  .data pre div { white-space: pre; min-height: 14px; }
  .data pre div.changed { background: var(--changed); }
  /* egui's item spacing: 8 across, 3 down (a horizontal layout's, so a built row needs no override).
     Every gap between two controls side by side or stacked takes it. The other gaps are layout,
     not item spacing, and keep their own figure: a grid's or a view's columns (12, 14, 16, 28),
     a gap between blocks of rows (6, so each block reads as one), and the parts of one compound
     widget (a list row's columns, a segmented choice's segments). */
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  h2 { font: 400 15px/1.2 var(--font-body); color: var(--strong); margin: 4px 0 8px; }
  .strong { color: var(--strong); }
  .weak { color: #6e6e6e; }
  .warn { color: var(--warn); }
  .err { color: var(--error); }
  .mono { font-family: var(--font-mono); font-size: 12px; }
  button, select, input { font: inherit; color: #b4b4b4; }
  /* egui's floor under a widget's height, interact_size.y: a button's, a combo's, a drag
     value's and a checkbox row's (its text alone is 15 at the body's 1.2 line). */
  button, select, input[type=number], label.cb { min-height: 18px; }
  /* A combo and a text box are 18 tall, as egui's are: the browser drew a combo 19 by its own
     sizing and a text box 19 from its border, padding and line, which put a form's rows of
     them 23 apart where egui's are 22. */
  select, input[type=text] { height: 18px; }
  input[type=text] { padding-top: 0; padding-bottom: 0; }
  /* egui's button_padding as theme.rs pins it, 4 x 1. */
  button { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 4px; cursor: default; }
  button:hover:not(:disabled) { background: var(--hover); color: #f0f0f0; }
  button:active:not(:disabled) { background: var(--active); }
  /* A disabled button keeps the app's box, egui's resting grey at half opacity over the
     panel (#2b2b2b), and dims its text further than that fade would (egui's lands at #6c6c6c). */
  button:disabled { color: #5a5a5a; background: #2b2b2b; }
  button.frame0 { background: transparent; }
  button.frame0:hover:not(:disabled) { background: var(--hover); }
  select { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 2px; }
  /* An open combo as egui draws it (comboPopup below): the button in the open state, the
     list right under it on the panel colour, a 1-point border, corner 6, margin 6 and the
     popup shadow; rows 18 high and 3 apart, unwrapped, hovered as a button, the current one
     in the selection's colours; inside the margin, past egui's combo_height, 200, the rows
     scroll, from the top. */
  select.open { background: #2d2d2d; box-shadow: inset 0 0 0 1px var(--stroke); }
  .combo-pop { position: fixed; z-index: 140; background: var(--panel); border: 1px solid var(--stroke);
    border-radius: 6px; padding: 6px; box-shadow: 6px 10px 4px #00000060; }
  .combo-pop > div { display: flex; flex-direction: column; gap: 3px; max-height: 200px; overflow-y: auto; }
  .combo-pop > div > div:not(.sep) { flex: none; display: flex; align-items: center; min-height: 18px;
    padding: 0 4px; border-radius: 2px; color: #b4b4b4; white-space: nowrap; cursor: default; }
  .combo-pop > div > div:not(.sep):hover { background: var(--hover); box-shadow: inset 0 0 0 1px #969696;
    border-radius: 3px; color: #f0f0f0; }
  .combo-pop > div > div.on { background: var(--sel-bg); color: var(--sel-fg); }
  .combo-pop > div > .sep { flex: none; margin: 0; }
  /* A removable row's ×: a frameless small button at the row's right end, 12 from its text. */
  .combo-pop .combo-x { margin-left: auto; padding: 0 2px 0 12px; color: #8c8c8c; }
  .combo-pop .combo-x:hover { color: var(--error); }
  /* An open select's list: Firefox draws it outside the page, where the page's own fonts
     are not loaded, so without a generic family it falls to the browser's serif default.
     The app's combo list is in the body font; the system sans is the nearest a browser
     gives here. The page keeps no generic family (above) so a missing glyph still shows. */
  option { font-family: var(--font-body), sans-serif; }
  input[type=text], input[type=number] { background: var(--extreme); border: 1px solid var(--stroke); border-radius: 3px; padding: 1px 4px; }
  input[type=number] { width: 52px; background: var(--widget); border: 0; text-align: center; }
  /* A DragValue has no spin arrows (the browsers draw theirs in the box). */
  input[type=number] { appearance: textfield; -moz-appearance: textfield; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button {
    -webkit-appearance: none; margin: 0; }
  input[type=text]:focus, input[type=number]:focus { outline: 1px solid var(--sel-fg); }
  input[type=color] { width: 22px; height: 16px; border: 0; padding: 0; background: none; }
  /* The swatch outlined as a resting text box is (its stroke and corners), so a colour as dark
     as the panel still shows its box. */
  input[type=color]::-webkit-color-swatch-wrapper { padding: 0; }
  input[type=color]::-webkit-color-swatch { border: 1px solid var(--stroke); border-radius: 3px; }
  input[type=color]::-moz-color-swatch { border: 1px solid var(--stroke); border-radius: 3px; }
  /* egui's CheckBox and RadioButton in theme.rs's widget states: a 14-point box (corner 2)
     or circle on the widget fill, no border; the tick a polyline across the box's central
     8 points, the dot's radius a third of them, both in the label's colour. Hovered or pressed
     anywhere on the row, since egui's response covers the label: the fill lighter or
     darker, a 1-point border inside, the tick 1.5 or 2 wide. A checked box or selected radio
     button is filled in the selection blue, its tick or dot in the selection's text colour,
     the tick 2 wide in every state, so a choice made stands out; egui's own leave them grey
     with a 1-point tick. */
  label.cb { display: inline-flex; align-items: center; gap: 4px; color: #b4b4b4; }
  input[type=checkbox], input[type=radio] {
    appearance: none; margin: 0; flex: none; width: 14px; height: 14px; border-radius: 2px;
    background: var(--widget) no-repeat center / 14px 14px; }
  input[type=radio] { border-radius: 50%; }

<body>
<div class="draft-side" id="draft-side">
<div class="weak">Draft controls, not part of the app</div>
<div class="win-size" id="win-size"></div>
<div class="draft-controls" id="draft-controls"></div>
<div class="draft-controls" id="tool-controls"></div>
</div>
<div class="win" id="win">
<div class="titlebar" id="titlebar"></div>
<div class="win-body" id="win-body">
<div class="main">
  <div class="rail sidebar" id="sidebar"></div>
  <div class="center" id="center"></div>
</div>
<div class="bottom" id="bottom"><span id="status-left"></span><span id="status-middle"></span><span id="status-right"></span></div>
</div>
<div id="help-layer"></div>
<div id="overlay"></div>
</div>
<script>
"use strict";

// The body-font trial (worklog 0.0.1w4): `?fontsrc=<a @font-face src>&scale=<percent>` draws
// the text in that face, at that size-adjust, in Roboto Flex's place in every chain; a trial page
// beside the candidate files sets them. Without the keys the drafts draw as always.
// The trial page then switches candidates by message ({ fontsrc, scale }), not by reloading:
// the new face loads first and replaces the old in one step, so no frame draws in a fallback
// font, which a reload did while its face loaded. The chains keep naming "Trial", so the
// canvas font strings, read once below, stay right.
const trial = new URLSearchParams(location.search);
const trialFace = (src, scale) => new FontFace("Trial", src, { weight: "400", sizeAdjust: scale + "%" });
let trialShown = null, trialAsked = 0;
if (trial.get("fontsrc")) {
  trialShown = trialFace(trial.get("fontsrc"), trial.get("scale") || "100");
  document.fonts.add(trialShown);
  const root = document.documentElement;
  for (const chain of ["--font-body", "--font-mono", "--font-label"])
    root.style.setProperty(chain, getComputedStyle(root).getPropertyValue(chain)
      .replaceAll('"Roboto Flex"', '"Trial"'));
  addEventListener("message", async e => {
    if (!e.data || !e.data.fontsrc) return;
    const face = trialFace(e.data.fontsrc, e.data.scale), asked = ++trialAsked;
    await face.load();
    // Two quick switches: the later one wins, whichever face loads last.
    if (asked !== trialAsked) return;
    document.fonts.delete(trialShown);
    document.fonts.add(face);
    trialShown = face;
    render();
  });
}
// Every font face loads now, not when DOM text first needs it: canvas text (the pitch) never
// triggers a load, and a face that is not loaded yet draws in the browser's fallback.
document.fonts.forEach(face => face.load());
// The app's font chains for canvas text, from the stylesheet's variables.
const FONT_BODY = getComputedStyle(document.documentElement).getPropertyValue("--font-body").trim();
const FONT_LABEL = getComputedStyle(document.documentElement).getPropertyValue("--font-label").trim();

// ---- The simulated window (the harness, not the UI) ----
// Studio's window opens at 1280 × 800 points, centered (plans/core/gui.md "Shell layout",
// "The window's size"), its height alone fitted on a monitor too short for it, to 90% of the
// monitor's logical height, and its width only on one too narrow for 1280 points and the
// frame's borders (16 points, ST-WIN-01's). `screen` is in CSS pixels, which are logical pixels as
// egui's points are (browser zoom at 100%), so the draft fits its window as Studio does. The
// size choice also tries the smallest default a member meets (1264 × 648), the minimum a
// member's resize can reach (960 × 600, `window_size::MIN_SIZE`, drawn scaled down) and the
// whole monitor.
const WIN_SIZES = [
  ["default", "The app's default"],
  ["smallest", "the smallest default (1264 × 648)"],
  ["minimum", "the minimum (960 × 600)"],
  ["monitor", "the whole monitor"],
];
function fitted(monitorW, monitorH) {
  const BORDERS = 16;
  return [Math.min(1280, monitorW - BORDERS), Math.min(780, Math.round(0.9 * monitorH))];
}
// A view is laid out for its window's design width, 1280 points for every
// draft today (the main tools; gui.md "Scaling with the width"): narrower
// than that the content draws scaled by width/1280 with the layout computed
// at the design width, at or above it the layout reflows. transform: scale()
// on #win-body, not zoom: under transform the layout stays in points
// (offsetWidth reads the point size, getBoundingClientRect the drawn one,
// and the fixed-position panels inside are contained by the transformed box
// in points), while the menus and dialogs outside #win-body keep their own
// coordinates. The scale reads the client area's width, as the app's zoom
// does, so the plan's sizes scale exactly: 1 at 1280, 0.75 at 960.
const DESIGN_W = 1280;
// The browser's scroll-bar width, the strip the window is drawn wider by (the .win rule):
// measured once as the gutter a box keeps for its bar, which is what the scrolling panes
// keep (a bar itself can be hidden while its gutter stays, as headless Chromium does), 0
// where scroll bars overlay the content.
const SBW = (() => {
  const probe = document.createElement("div");
  probe.style.cssText = "position:absolute; visibility:hidden; width:100px; height:100px;"
    + " overflow:auto; scrollbar-gutter:stable";
  document.body.append(probe);
  const width = probe.offsetWidth - probe.clientWidth;
  probe.remove();
  return width;
})();
document.documentElement.style.setProperty("--sbw", SBW + "px");
// The client area's width, without the border and that strip: the size the app's window has.
const winWidth = () => document.getElementById("win").clientWidth - SBW;
// The client area's height, below the drawn title bar.
const winHeight = () => document.getElementById("win").clientHeight
  - document.getElementById("titlebar").offsetHeight;
const winScale = () => Math.min(1, winWidth() / DESIGN_W);
// The drawn scale's layout box: the design width and the window's height in
// points (the height never scales: a shorter window just shows fewer points).
function applyScale() {
  const win = document.getElementById("win"), body = document.getElementById("win-body");
  const s = winScale();
  body.style.width = (s < 1 ? DESIGN_W + SBW : win.clientWidth) + "px";
  body.style.height =
    (win.clientHeight - document.getElementById("titlebar").offsetHeight) / s + "px";
  body.style.transform = "scale(" + s + ")";
}
// The default size as drawn, measured when the window takes it. Reset window shows only while
// the window is maximized or at another size (gui.md "Status bar"). Every draft's tool is a
// main tool, so this is the main class's size; a special tool's window compares with its own.
let defaultDims = null;
function atDefaultSize() {
  const win = document.getElementById("win");
  return !win.classList.contains("max") && defaultDims !== null
    && win.offsetWidth === defaultDims[0] && win.offsetHeight === defaultDims[1];
}
function showReset() {
  const reset = document.getElementById("reset-window");
  if (reset) reset.style.display = atDefaultSize() ? "none" : "";
}
function sizeWindow(which) {
  const win = document.getElementById("win");
  win.classList.remove("max");
  win.style.width = ""; win.style.height = "";
  const [w, hgt] = which === "monitor" ? [screen.width, screen.height]
    : which === "smallest" ? [1264, 648]
    : which === "minimum" ? [960, 600] : fitted(screen.width, screen.height);
  win.style.setProperty("--win-w", w + "px");
  win.style.setProperty("--win-h", hgt + "px");
  if (which === "default") defaultDims = [win.offsetWidth, win.offsetHeight];
  const bar = document.getElementById("win-size");
  bar.innerHTML = "";
  const pick = document.createElement("select");
  for (const [key, label] of WIN_SIZES) {
    const o = document.createElement("option");
    o.value = key; o.textContent = label;
    o.selected = key === which;
    pick.append(o);
  }
  pick.onchange = () => sizeWindow(pick.value);
  const label = document.createElement("span");
  label.className = "weak"; label.id = "win-size-label";
  const head = document.createElement("div");
  head.className = "dcsection"; head.textContent = "Window";
  bar.append(head, pick, label);
  sizeLabel();
}
// The size readout, kept live while the corner is dragged, so a default can be read off a
// size that feels right: the window's size and its share of the monitor.
function sizeLabel() {

  S.autoSwitchUsed = true;
  saveSettings();
  pesVersionChanged();
}
// Every view's pesVersionChanged hook, after the selector changed by hand,
// through the menu or by the auto-switch.
function pesVersionChanged() {
  for (const view of Object.values(VIEWS)) if (view.pesVersionChanged) view.pesVersionChanged(S.pesVersion);
}
// A tool script's own S shadows the shell's, so it reads the selector through this.
function shellPesVersion() { return S.pesVersion; }
// A tool script switches the active tool through this (S is the shell's again).
function switchToTool(id) { S.activeTool = id; render(); }
// A tool script reports its status-bar activity through this (S.activities).
function toolActivity(id, activity) { if (activity) S.activities[id] = activity; else delete S.activities[id]; }
// The once-per-life auto-switch to the running game (ST-SIDE-05): a blocker
// defers it without consuming it, a manual change consumes it.
function pollRunningPes() {
  const rp = S.runningPes;
  if (!rp || rp.version === S.pesVersion || S.autoSwitchUsed || S.blocker) return;
  S.pesVersion = rp.version;
  S.autoSwitchUsed = true;
  saveSettings(); // the switch writes the pes_version setting
  pesVersionChanged();
  const action = folderOf(rp.path) !== resolvedPesFolder()
    ? { label: "Fix PES path", run: fixPesPath } : null;
  // sample wording: the notice text and its action's label. A switch whose
  // Fix PES path action points at another folder's exe warns, a plain one
  // informs.
  publishNotice("Switched to PES " + rp.version, action, action ? "warning" : "info");
}
// "Fix PES path" rewrites pes_folder_path from the running exe's folder,
// putting ** back for the two digits of the version in the exe's own folder
// segment only (D:\Games\PES2021 -> D:\Games\PES20**; a segment without the
// version's year keeps it and the path writes unchanged); opt-in, never
// automatic. Once any version has a folder of its own, it writes the running
// version's row instead, the folder as it is: a rewritten main row would move
// every version that falls back to it.
function fixPesPath() {
  const rp = S.runningPes;
  if (!rp) return;
  if (Object.keys(pesFolders()).length) {
    pesFolders()[rp.version.slice(2)] = folderOf(rp.path);
  } else {
    const segs = folderOf(rp.path).split("\\");
    segs[segs.length - 1] = segs[segs.length - 1].replaceAll(rp.version, "20**");
    S.pesFolder = segs.join("\\");
  }
  saveSettings(); // both are common settings
  render();
}

// The topic body's Markdown, rendered by this tiny stand-in for
// egui_commonmark: it covers only what the sample bodies use (## headings,
// paragraphs split on blank lines, `code` spans, **strong**, - list items,
// ``` fenced blocks as pre.mono, and [text](tool-id#topic-slug) links).
function mdInline(text) {
  const kids = [];
  let rest = text;
  while (rest.length) {
    const m = rest.match(/\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/);
    if (!m) { kids.push(rest); break; }
    if (m.index) kids.push(rest.slice(0, m.index));
    if (m[1] !== undefined) kids.push(strong(m[1]));
    else if (m[2] !== undefined) kids.push(h("code", { class: "mono" }, m[2]));
    else kids.push(helpLink(m[3], m[4]));
    rest = rest.slice(m.index + m[0].length);
  }
  return kids;
}
// An in-doc link, [text](tool-id#topic-slug): opens the help at that topic.
function helpLink(text, target) {
  const [tool, topic] = target.split("#");
  return h("a", { href: "#",
    onclick: e => { e.preventDefault(); openHelp({ tool, topic }); } }, text);
}
// A topic body as block elements; hlPara marks the paragraph index a search
// jump highlights.
function md(body, hlPara) {
  return body.split(/\n\s*\n/).map((b, i) => {
    const cls = i === hlPara ? "hl" : "";
    if (b.startsWith("## ")) return h("h3", { class: cls }, mdInline(b.slice(3)));
    if (b.startsWith("```"))
      return h("pre", { class: "mono" + (cls ? " " + cls : "") }, b.split("\n").slice(1, -1).join("\n"));
    // A list: each item from its "- " to the next, its wrapped lines joined.
    if (b.startsWith("- "))
      return h("div", { class: "ul" + (cls ? " " + cls : "") }, b.split(/\n(?=- )/).map(item =>
        h("div", {}, "• ", mdInline(item.slice(2).replaceAll("\n", " ").replace(/ +/g, " ")))));
    return h("p", { class: cls }, mdInline(b.replaceAll("\n", " ")));
  });
}

// The help window's own drawer (like windowDrawer for modals): render() calls
// it every frame, so it must keep the search text, the input's focus and the
// panes' scroll positions across its own rebuild.
// sample wording: the window's strings (title, search placeholder, the empty
// result line, the Messages table's headers).
function drawHelp() {
  const layer = document.getElementById("help-layer");
  if (!S.help) { layer.innerHTML = ""; return; }
  const oldInput = layer.querySelector(".help-search");
  const hadFocus = oldInput && document.activeElement === oldInput;
  const caret = hadFocus ? oldInput.selectionStart : 0;
  // Opened first at 1000 x 600, or 90% of Studio's window where that is smaller, centered
  // in it; then where the member left it (plans/core/gui.md "Help window"). 1000 holds the
  // tree and the 720 text column with a scroll bar beside it.
  // The client area is #win-body: #win also holds the drawn title bar, which egui's
  // window never covers, so measured on #win the window came out 5 taller and 23 higher.
  if (!S.helpWindow) {
    const area = document.getElementById("win-body");
    const areaW = area.getBoundingClientRect().width / winScale() - SBW;
    const areaH = area.getBoundingClientRect().height / winScale();
    const w = Math.min(1000, Math.round(areaW * 0.9)), hgt = Math.min(600, Math.round(areaH * 0.9));
    S.helpWindow = { x: area.offsetLeft + Math.round((areaW - w) / 2),
      y: area.offsetTop + Math.round((areaH - hgt) / 2), w, h: hgt };
  }
  const geo = S.helpWindow;
  const closeBtn = button("×", closeHelp, { frame0: true, title: "Close" });
  const win = h("div", { class: "window help-win",
    style: `left:${geo.x}px; top:${geo.y}px; width:${geo.w}px; height:${geo.h}px` },
    h("div", { class: "title-row", onmousedown: e => {
      if (!e.target.closest("button")) startHelpDrag(e, win);
    } }, h("div", { class: "title" }, "Help (WIP)"), closeBtn),
    h("input", { type: "text", class: "help-search", placeholder: "Search the help",
      value: S.help.search,
      oninput: e => { S.help.search = e.target.value; drawHelpPanes(win); } }),
    h("div", { class: "help-body" }));
  layer.innerHTML = "";
  layer.append(win);
  drawHelpPanes(win);
  if (hadFocus) {
    const s = win.querySelector(".help-search");
    s.focus(); s.setSelectionRange(caret, caret);
  }
  // Geometry lives in S.helpWindow: a real resize (CSS resize: both) and a drag
  // end write it; closing does not touch it, so it survives close and reopen.
  new ResizeObserver(es => { for (const en of es) {
    S.helpWindow.w = en.target.offsetWidth; S.helpWindow.h = en.target.offsetHeight;
  } }).observe(win);
}
// The tree and the topic/results panes, rebuilt on every draw and on each
// keystroke of the search box (the input itself is left alone there, so it
// keeps focus).
function drawHelpPanes(win) {
  const body = win.querySelector(".help-body");
  const oldTree = body.querySelector(".help-tree");
  const oldTopic = body.querySelector(".help-topic");
  if (oldTree) S.helpScroll.tree = oldTree.scrollTop;
  if (oldTopic && !S.help.scrollPending) S.helpScroll.topic = oldTopic.scrollTop;
  body.innerHTML = "";
  const tree = h("div", { class: "help-tree" });
  const right = h("div", { class: "help-topic" });
  body.append(tree, right);
  // A jump (openHelp, a topic or a result click) scrolls itself; only a plain
  // redraw restores the kept scroll positions.
  const jumped = S.help.search.trim() ? (drawHelpResults(right), false) : drawHelpTopic(right);
  for (const ch of HELP) {
    tree.append(collapsing("help/" + ch.id, ch.title, () => helpTopics(ch).map(t =>
      h("span", { class: "sel" + (S.help.tool === ch.id && S.help.topic === t.slug ? " on" : ""),
        onclick: () => helpGo(ch.id, t.slug) }, t.title))));
  }
  tree.scrollTop = S.helpScroll.tree;
  if (!jumped) right.scrollTop = S.helpScroll.topic;
}
function drawHelpTopic(right) {
  const ch = helpChapter(S.help.tool) || HELP[0];
  if (S.help.topic === "messages" && CATALOG[ch.id])
    right.append(h("h2", {}, "Messages"), messagesTable(ch.id));
  else {
    const t = ch.topics.find(t => t.slug === S.help.topic) || ch.topics[0];
    right.append(h("h2", {}, t.title), ...md(t.body, S.help.para));
  }
  if (!S.help.scrollPending) return false;
  S.help.scrollPending = false;
  const hl = right.querySelector(".hl");
  if (hl) hl.scrollIntoView(); else right.scrollTop = 0;
  return true;
}
// The generated Messages topic: one row per catalog entry, the code's cell
// carrying a msg-<code> id for anchors, the severity coloured (a cell holding
// E or F red), the text cells' Markdown rendered.
function messagesTable(chId) {
  const sevCls = s => s === "Info" ? "weak" : s === "Warning" ? "warn"
    : /[EF]/.test(s) ? "err" : "";
  const [h3, h4] = CATALOG_HEADERS[chId];
  return h("table", { class: "grid" },
    h("tr", {}, h("th", {}, "ID"), h("th", {}, "Severity"),
      h("th", {}, h3), h("th", {}, h4)),
    CATALOG[chId].map(r => h("tr", { class: r.code === S.help.anchor ? "hl" : "" },
      h("td", {}, h("code", { class: "mono", id: "msg-" + r.code }, r.code)),
      h("td", {}, h("span", { class: sevCls(r.severity) }, r.severity)),
      h("td", {}, mdInline(r.condition)),
      h("td", {}, mdInline(r.consequence)))));
}
// Case-insensitive substring over every topic paragraph and every catalog row
// (gui.md "Help window": no index, no fuzzy matching). Each hit is a result:
// { ch, slug, label, para } for a paragraph, { ch, slug, label, code } for a row.
function helpSearch(q) {
  const res = [];
  for (const ch of HELP) {
    for (const t of ch.topics)
      t.body.split(/\n\s*\n/).forEach((para, i) => {
        if (!para.toLowerCase().includes(q)) return;
        // The label is the matching physical line (the hit stays the paragraph),
        // its Markdown marks dropped: a label draws no bold or code.
        const line = para.split("\n").find(l => l.toLowerCase().includes(q));
        const plain = (line ?? para.replaceAll("\n", " ")).replace(/\*\*|`/g, "")
          .trim().replace(/^- /, "");
        res.push({ ch: ch.id, slug: t.slug, para: i,
          label: `${ch.title} › ${t.title} › ${plain}` });
      });
    for (const r of CATALOG[ch.id] || []) {
      const cells = [r.severity, r.condition, r.consequence];
      const codeHit = r.code.toLowerCase().includes(q);
      const cellHit = cells.findIndex(c => c.toLowerCase().includes(q));
      if (!codeHit && cellHit < 0) continue;
      // The label ends with the cell that matched; a code match shows the condition.
      res.push({ ch: ch.id, slug: "messages", code: r.code,
        label: `${ch.title} › Messages › ${r.code}: ${codeHit ? r.condition : cells[cellHit]}` });
    }
  }
  return res;
}
function drawHelpResults(right) {
  const res = helpSearch(S.help.search.trim().toLowerCase());
  if (!res.length) right.append(weak("Nothing matches."));
  right.append(h("div", { class: "help-res" }, res.map(r => h("span", { class: "sel",
    onclick: () => { S.help.search = ""; helpGo(r.ch, r.slug, r.code, r.para); } }, r.label))));
}
// Title-row dragging: the window follows the pointer, the drop writes
// S.helpWindow.x/y.
function startHelpDrag(e, win) {
  if (e.button !== 0) return;
  // The fixed position's own left/top, measured in the simulated window (a fixed
  // element's offsetLeft is not, in every browser).
  const at = () => [parseFloat(getComputedStyle(win).left), parseFloat(getComputedStyle(win).top)];
  const [x0, y0] = at(), dx = e.clientX - x0, dy = e.clientY - y0;
  const move = ev => {
    win.style.left = Math.max(0, ev.clientX - dx) + "px";
    win.style.top = Math.max(0, ev.clientY - dy) + "px";
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    [S.helpWindow.x, S.helpWindow.y] = at();
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}
function openAbout() {
  // sample wording: the window's title and its link and button labels.
  const link = (t, fn) => h("a", { href: "#", onclick: e => { e.preventDefault(); if (fn) fn(); } }, t);
  const ext = (name, what) => window_(name,
    weak("Opens " + what + " in the browser"),
    // window_ redraws the overlay itself; skipping closeWindow keeps the
    // layer held across the whole About chain.
    [button("OK", () => openAbout())], "about");
  window_("About " + APP_NAME,
    h("div", {}, h("pre", { class: "mono" }, aboutText()),
      row(link("Release page", () => ext("Release page", "the release page")),
        link("Repository", () => ext("Repository", "the repository")),
        link("Help", () => openHelp({ tool: "setting-up" })))),
    [button("Copy", () => {
      lastCopied = aboutText();
      navigator.clipboard?.writeText(lastCopied)?.catch(() => {});
    }), button("Close", closeWindow)], "about");
  render(); // the link carries the open window's name
}

// ---- Settings menu (gui.md "Settings menu") ----
// The settings file is written at the end of the frame, best-effort: a data
// folder that cannot be written keeps the session's values and raises
// data_dir_read_only, cleared when a later write succeeds. Never a prompt
// (ST-SET-03). savesAttempted is what the harness reads.
let savesAttempted = 0;
function saveSettings() {
  savesAttempted++;
  const i = S.conditions.indexOf("data_dir_read_only");
  if (S.dataDirUnwritable) { if (i < 0) S.conditions.push("data_dir_read_only"); }
  else if (i >= 0) S.conditions.splice(i, 1);
}
// No Save or Apply: a change applies as it is made, then the frame ends.
function settingChanged() { saveSettings(); render(); }

// A settings row: the plain label and its widget; the label's tooltip leads
// with the settings key, then the row's tip, so a
// member who edits settings.toml by hand still finds it.
const sRow = (label, key, tip, widget) =>
  h("tr", {}, h("td", {}, h("span", { title: key + ": " + tip }, label)),
    h("td", {}, widget));

// rfd's native picker, "folder" or "file"; closing it returns to the menu.
// sample wording: the fake dialog's text.
const browse = kind => button("Browse", () => window_("Native " + kind + " dialog",
  weak("The native " + kind + " picker (rfd) opens here"),
  [button("OK", () => { closeWindow(); drawSettings(); })]));

// Under the PES folder row, the "A folder per version" toggle (the view's alone,
// never a setting) and, while it is on, one path row per version: a filled row is
// that version's folder as written, an empty one falls back to the main row. Any
// filled row turns the toggle on and locks it there, since a hidden row would
// still be used; once seen on it stays on, so emptying the last row does not take
// the rows away under the member's edit.
function perVersionRows() {
  const folders = pesFolders();
  const filled = Object.keys(folders).length > 0;
  S.perVersionFolders = S.perVersionFolders || filled;
  const toggle = h("label", {
      class: "cb",
      title: filled
        ? "Empty every version's folder to switch this off, because a filled one is still used while it is hidden."
        : "Gives each PES version a folder of its own, for installs whose folders do not follow one pattern." },
    h("input", { type: "checkbox", checked: S.perVersionFolders, disabled: filled,
      onchange: e => { S.perVersionFolders = e.target.checked; drawSettings(); } }),
    " A folder per version");
  const rows = [h("tr", {}, h("td", {}), h("td", {}, toggle))];
  if (!S.perVersionFolders) return rows;
  for (const year of PES_VERSIONS) {
    const key = year.slice(2);
    const edit = h("input", { type: "text", value: folders[key] || "",
      onchange: e => {
        if (e.target.value) folders[key] = e.target.value; else delete folders[key];
        settingChanged(); drawSettings(); } });
    rows.push(sRow("PES " + year + " folder", "pes_folders." + key,
      "PES " + year + "'s own folder. When it is filled, it is used as written instead of the PES folder above, and when it is empty, the PES folder above is used.",
      [edit, browse("folder")]));
  }
  return rows;
}

// The common grid, always open (no header): one row per CommonSettings field a
// member edits, its doc comment the tooltip's source.

  const num = (key, attrs = {}) => h("input", { type: "number", value: c[key],
    ...attrs, onchange: e => { const v = parseFloat(e.target.value);

    onchange: e => { c[key] = e.target.value; settingChanged(); } });

    v => { c.theme = v; saveSettings(); });
  theme.id = "set-theme";
  return [
    sRow("PES version", "pes_version", "The PES version every tool works with, the same setting the sidebar's selector changes.",
      // The blocked reason on a hover-sensing wrapper, as in the sidebar.
      h("span", { title: S.blocker ? pesSelectorTip() : null },
        combo(PES_VERSIONS.map(v => [v, "PES " + v]), c.pes_version, setPesVersion,

    sRow("PES folder", "pes_folder_path", "The folder PES is installed in, where ** stands for the version's two digits (20** becomes 2019 for PES 2019). When the folder you browse to has the selected version's year in its name, the year is stored as 20** so that switching versions switches folders too. Any other folder is stored as you picked it.",
      [text("pes_folder_path"), browse("folder")]),

    sRow("Threads", "thread_count", "The number of worker threads a tool's run uses, where 0 means automatic (the logical cores minus one).",
      num("thread_count", { id: "set-thread-count" })),
    sRow("Memory cap", "memory_cap_percent", "The most memory a tool's run may budget for, as a percentage of physical memory.",
      [num("memory_cap_percent", { step: "any" }), " %"]),

      num("fpc_hide_boots_id", { min: 1, max: 100 })),
    sRow("FPC hide gloves ID", "fpc_hide_gloves_id", "The gloves ID that Hide body and an fpc_on marker write. The game has no gloves with this ID, and 4cc uses 11.",

      h("input", { type: "checkbox", checked: c.check_for_updates,
        onchange: e => { c.check_for_updates = e.target.checked; settingChanged(); } })),

// A tool section's grid: the same label / widget rows over its table.
function toolSettingRow(toolId, f) {
  const [key, label, kind, tip] = f;
  const tbl = S.settings.tools[toolId];
  let widget;
  if (kind === "bool")
    widget = h("input", { type: "checkbox", checked: tbl[key],
      onchange: e => { tbl[key] = e.target.checked; settingChanged(); } });
  else if (kind === "num")
    widget = h("input", { type: "number", value: tbl[key],
      onchange: e => { const v = parseFloat(e.target.value);
        if (!Number.isNaN(v)) { tbl[key] = v; settingChanged(); } } });
  else if (kind === "text")
    widget = h("input", { type: "text", value: tbl[key],
      onchange: e => { tbl[key] = e.target.value; settingChanged(); } });
  else if (kind === "file" || kind === "folder")
    // The box holds the file's spelling verbatim (savefile_path: `auto`).
    widget = [h("input", { type: "text", id: "set-" + key.replaceAll("_", "-"),
      value: tbl[key],
      onchange: e => { tbl[key] = e.target.value; settingChanged(); } }), browse(kind)];
  else
    widget = combo(kind.map(v => [v, v]), tbl[key], v => { tbl[key] = v; saveSettings(); });
  return sRow(label, key, tip, widget);
}

// The gear opens the menu: the common grid, then one collapsing section per
// registered tool in sidebar order, the active tool's open (ST-SET-01); the
// user may then toggle any, so the open set is fixed at open time.
function openSettings() {
  for (const t of TOOLS.filter(t => t.registered)) {
    open.delete("settings/" + t.id); open.delete("closed:settings/" + t.id);
  }
  open.add("settings/" + S.activeTool);
  S.perVersionFolders = false; // the first draw turns it on over a filled row
  drawSettings();
  render(); // the link carries the open window (windowDrawer re-registers)
}
function drawSettings() {
  window_("Settings (WIP)",
    h("div", { class: "settings-body" },
      h("table", { class: "grid" }, commonSettingsRows()),
      // One section per registered tool that has settings (the Export
      // upgrader has none: plans/export_upgrader.md "GUI").
      TOOLS.filter(t => t.registered && TOOL_SETTINGS_SPEC[t.id].length)
        .map(t => collapsing("settings/" + t.id, t.label, () =>
          h("table", { class: "grid" }, TOOL_SETTINGS_SPEC[t.id].map(f => toolSettingRow(t.id, f)))))),
    [button("Close", closeWindow)]);
  windowDrawer = drawSettings; // render() rebuilds the open window
}

// ---- First-run dialog (distribution.md "Data location") ----
// ST-RUN-01: neither settings file exists, so the GUI asks where settings and
// data live before any tool view, a modal with no Cancel (the choice is needed
// to start). The central panel stays empty while it is up.
// sample wording: the title, the two buttons and hints, the footer line.
function drawFirstRun() {
  const choice = (label, hint, loc) => h("div", { class: "choice" },
    button(label, () => chooseDataLocation(loc)), weak(hint));
  window_("Where should " + APP_NAME + " keep its settings and data?",
    h("div", {},
      h("div", { class: "firstrun" },
        choice("Next to the program",
          "A portable data folder beside the program, which moves and is deleted with it", "portable"),
        choice("In my user folder",
          CONFIG_DIR + ", which survives replacing or moving the program folder", "config")),
      weak("You can move the data later by moving the folder."),
      // sample wording: the write error.
      S.firstRunError ? h("div", { class: "err" }, S.firstRunError) : null),
    []);
}
// Choosing writes the choice: the settings file's existence is what makes it
// stick. A location that cannot be written keeps the dialog open with the
// error, so the member picks the other (distribution.md "Data location").
function chooseDataLocation(loc) {
  if (loc === "portable" && S.exeDirUnwritable) {
    S.firstRunError = "Cannot write " + EXE_FOLDER + "\\data\\settings.toml (access is denied). Choose the other location.";
    render();
    return;
  }
  S.firstRunError = null;
  S.settingsFile = loc;
  closeWindow();
  saveSettings();
  render();
}

// ---- Render: one state object, one pass (gui.md "Shell layout") ----
// gui.md "Window title": progress first, name last, a plain hyphen before the
// name. An activity outranks a held notice: the held-notice row of the table is
// the idle one; idle, the title is the active tool's name and the app's.
function windowTitle() {
  const acts = activityIds(true);
  if (acts.length)
    return acts.map(id => activityText(id, S.activities[id])).join(" · ") + " - " + APP_NAME;
  if (S.heldTitleNotice) return S.heldTitleNotice + " - " + APP_NAME;
  const view = VIEWS[S.activeTool], detail = view && view.titleDetail && view.titleDetail();
  return toolLabel(S.activeTool) + (detail ? " " + detail : "") + " - " + APP_NAME;
}
// The title is set only when the string changes: the real shell sends
// ViewportCommand::Title once per change, not once per frame. titleSetCount is
// what the harness counts to check that.
let lastTitle = null, titleSetCount = 0;
function setTitle() {
  const t = windowTitle();
  if (t === lastTitle) return;
  lastTitle = t; titleSetCount++;
  document.title = t;
  const tb = document.getElementById("titlebar");
  tb.innerHTML = "";
  tb.append(h("span", { class: "win-title" }, t), maxButton());
}
function structural() { const view = VIEWS[S.activeTool]; if (view && view.commit) view.commit(); render(); }
// The drawn state in the address: #<tool>/<screen>?<key>=<value>&..., the
// tool id's hyphens as underscores; a stub tool's is the bare #<tool>. The
// shell's own key: pes=<version> while the selector is not the default.
let lastLink = null;
// The shell's own keys beside the view's, written only off their start value:
// the selector, the exe check, the blocker, the conditions, the settings file,
// the data folder, the open Settings or About window, the open help.
function hostLinkKeys() {
  const k = {};
  if (S.pesVersion !== "2019") k.pes = S.pesVersion;
  if (S.exeFound !== "selected") k.exe = S.exeFound;
  if (S.blocker) k.blocker = "1";
  if (S.conditions.length) k.cond = S.conditions.join(",");
  if (S.settingsFile !== "portable") k.settings = S.settingsFile;
  if (S.dataDirUnwritable) k.rodata = "1";
  if (S.overlay !== "off") k.overlay = S.overlay;
  if (windowDrawer === drawSettings) k.win = "settings";
  else if (document.querySelector('#overlay .window[data-dlg="about"]')) k.win = "about";
  if (S.help) {
    k.help = S.help.tool + "/" + S.help.topic;
    if (S.help.anchor) k.anchor = S.help.anchor;
  }
  return k;
}
function updateLink() {
  const view = VIEWS[S.activeTool];
  let frag = "#" + S.activeTool.replaceAll("-", "_");
  const keys = {};
  if (view) {
    frag += "/" + (view.screen ? view.screen() : "main");
    Object.assign(keys, view.linkKeys ? view.linkKeys() : {});
  }
  Object.assign(keys, hostLinkKeys());
  const q = Object.entries(keys)
    .map(([k, v]) => k + "=" + encodeURIComponent(v)).join("&");
  if (q) frag += "?" + q;
  if (frag !== lastLink) { lastLink = frag; history.replaceState(null, "", frag); }
}
function render() {
  closeMenus();
  setTitle();
  renderDraftControls();
  renderToolControls();
  renderSidebar();
  renderCenter();
  renderStatus();
  if (S.settingsFile === "none") drawFirstRun();
  else if (windowDrawer) windowDrawer();
  drawHelp();
  layoutApply();
  remarksApply();
  overlayApply();
  updateLink();
}

function cb(label, checked, set) {
  return h("label", { class: "cb" }, h("input", { type: "checkbox", checked,
    onchange: e => { set(e.target.checked); render(); } }), label);
}

// The draft controls' close request (EU-GUI-07's GIVEN): each registered
// view's closeRequest hook in TOOLS order; the first returning true holds the
// close (it made itself the active tool and drew its prompt). None holding
// it, the window goes at once.

    const v = VIEWS[t.id];
