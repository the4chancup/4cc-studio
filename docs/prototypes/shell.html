<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4cc Studio (shell draft)</title>
<!--
  A draft of the 4cc Studio shell: sidebar, status bar, settings menu, help window
  and window title (docs/plans/core/gui.md), drawn only with what egui can draw
  ("Prototypes before implementation"): its behaviour is faked with sample data and
  nothing is written. Slices 1 to 5 of 7: the skeleton, the sidebar with its
  collapse, stub central panels, the status bar's three slots, the window
  title, the PES selector's states, the About popup, the settings menu and the
  help window.
  Widget mapping: <select> = ComboBox, .sel = SelectableLabel, .menu = menu_button,
  details = CollapsingHeader, table.grid = Grid, .window = Window/Modal,
  title="" = on_hover_text, .sidebar = Panel::left, .bottom = Panel::bottom,
  .center = CentralPanel, .titlebar = ViewportCommand::Title.
-->
<style>
  :root {
    --panel: #1b1b1b; --extreme: #0a0a0a; --faint: #202020; --widget: #3c3c3c;
    --hover: #464646; --active: #373737; --stroke: #3c3c3c; --text: #8c8c8c;
    --strong: #dcdcdc; --sel-bg: #005c80; --sel-fg: #c0deff; --link: #5aaaff;
    --warn: #ff8f00; --error: #ff0000; --changed: #2a3a1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--panel); color: var(--text);
    font: 300 12.5px "Ubuntu", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top, .bottom { background: var(--panel); padding: 3px 8px; display: flex; gap: 8px; align-items: center; }
  .top { border-bottom: 1px solid var(--stroke); }
  .bottom { border-top: 1px solid var(--stroke); min-height: 26px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .rail { width: 150px; border-right: 1px solid var(--stroke); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .center { flex: 1; overflow: auto; padding: 8px 12px 40px; min-width: 0; }
  .data { width: 590px; border-left: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
  .data pre { flex: 1; margin: 0; overflow: auto; background: var(--extreme); padding: 6px; font: 12px "Hack", "Consolas", monospace; color: #b4b4b4; }
  .data pre div { white-space: pre; min-height: 14px; }
  .data pre div.changed { background: var(--changed); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  h2 { font: 400 15px "Ubuntu", "Segoe UI", sans-serif; color: var(--strong); margin: 4px 0 8px; }
  .strong { color: var(--strong); }
  .weak { color: #6e6e6e; }
  .warn { color: var(--warn); }
  .err { color: var(--error); }
  .mono { font-family: "Hack", "Consolas", monospace; font-size: 12px; }
  button, select, input { font: inherit; color: #b4b4b4; }
  button { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 6px; cursor: default; }
  button:hover:not(:disabled) { background: var(--hover); color: #f0f0f0; }
  button:active:not(:disabled) { background: var(--active); }
  button:disabled { color: #5a5a5a; }
  button.frame0 { background: transparent; }
  button.frame0:hover:not(:disabled) { background: var(--hover); }
  select { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 2px; }
  input[type=text], input[type=number] { background: var(--extreme); border: 1px solid var(--stroke); border-radius: 2px; padding: 1px 4px; }
  input[type=number] { width: 52px; background: var(--widget); border: 0; text-align: center; }
  input[type=text]:focus, input[type=number]:focus { outline: 1px solid var(--sel-fg); }
  input[type=color] { width: 22px; height: 16px; border: 0; padding: 0; background: none; }
  label.cb { display: inline-flex; align-items: center; gap: 4px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--sel-bg); margin: 0; }
  .sel { padding: 1px 5px; border-radius: 2px; cursor: default; user-select: none; }
  .sel:hover { background: var(--hover); color: #f0f0f0; }
  .sel.on { background: var(--sel-bg); color: var(--sel-fg); }
  .rail .sel { padding: 3px 6px; display: flex; justify-content: space-between; }
  table.grid { border-collapse: collapse; }
  table.grid td, table.grid th { padding: 2px 4px; text-align: left; vertical-align: middle; }
  table.grid td > .row, table.grid td > span > .row { flex-wrap: nowrap; }
  table.grid th { font-weight: 400; color: var(--strong); }
  details { margin: 2px 0 4px; }
  details > summary { cursor: default; color: var(--strong); list-style: none; }
  details > summary::before { content: "\25B6"; font-size: 9px; display: inline-block; width: 14px; }
  details[open] > summary::before { content: "\25BC"; }
  details > .body { padding-left: 14px; }
  .group { border: 1px solid var(--stroke); border-radius: 2px; padding: 6px; margin: 6px 0; }
  .sep { border-top: 1px solid var(--stroke); margin: 8px 0; }
  .handle { cursor: grab; color: #6e6e6e; padding: 0 4px; user-select: none; }
  .dragover { outline: 1px solid var(--sel-fg); }
  .menu { position: fixed; background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 4px; z-index: 20; box-shadow: 0 4px 16px #000a; display: flex; flex-direction: column; min-width: 160px; }
  .menu button { text-align: left; background: transparent; padding: 2px 8px; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .modal-bg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .window { background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 8px 12px; box-shadow: 0 8px 24px #000c; min-width: 360px; max-width: 640px; }
  .window .title { color: var(--strong); font-size: 14px; margin-bottom: 8px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid #000; vertical-align: middle; }
  .chip { background: var(--widget); border-radius: 2px; padding: 0 4px; }
  /* shell */
  .draft-controls { border: 1px dashed var(--stroke); margin: 4px 4px 0; padding: 3px 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .titlebar { background: var(--extreme); border-bottom: 1px solid var(--stroke); padding: 2px 8px; display: flex; gap: 6px; }
  .sidebar { width: 160px; }
  .sidebar.collapsed { width: 56px; align-items: center; }
  .sidebar.collapsed .tlabel { display: none; }
  .sidebar.collapsed select { width: 44px; }
  .sidebar .tool { justify-content: flex-start; align-items: center; gap: 6px; border-left: 3px solid transparent; }
  .sidebar .tool.on { border-left-color: var(--sel-fg); }
  .sidebar .tool.planned { color: #6e6e6e; }
  .sidebar .tool.planned:hover { background: none; color: #6e6e6e; }
  .icon { display: inline-block; width: 16px; text-align: center; flex: none; }
  .logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--sel-fg); font-size: 15px; border-radius: 2px; user-select: none; }
  .logo:hover { background: var(--hover); }
  .sidebar .tail { margin-top: auto; display: flex; gap: 2px; }
  .sidebar.collapsed .tail { flex-direction: column; align-items: center; }
  .bottom { height: 24px; min-height: 24px; padding-top: 0; padding-bottom: 0; overflow: hidden; }
  .bottom > span { display: flex; align-items: center; flex: 1; gap: 8px; white-space: nowrap; overflow: hidden; min-width: 0; }
  #status-middle { justify-content: center; }
  #status-right { justify-content: flex-end; }
  .cond { display: inline-flex; align-items: center; gap: 3px; }
  .cond, .act, .notice-txt { overflow: hidden; text-overflow: ellipsis; }
  .small { font-size: 11px; }
  table.grid tr.sel:hover { background: var(--hover); }
  .window pre.mono { margin: 4px 0; }
  a { color: var(--link); }
  .settings-body { width: 560px; }
  .settings-body td:first-child { white-space: nowrap; }
  .settings-body input[type=text] { width: 220px; }
  .settings-body input[type=number] { width: 90px; }
  .help-win { position: fixed; z-index: 5; display: flex; flex-direction: column;
    max-width: none; min-width: 420px; min-height: 200px; padding: 0; resize: both; overflow: hidden; }
  .help-win .title-row { display: flex; align-items: center; padding: 6px 12px 0; cursor: grab; user-select: none; }
  .help-win .title-row .title { flex: 1; margin-bottom: 0; }
  .help-win .help-search { margin: 4px 12px 6px; }
  .help-win .help-body { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--stroke); }
  .help-win .help-tree { width: 220px; flex: none; overflow: auto; padding: 6px; border-right: 1px solid var(--stroke); }
  .help-win .help-tree .sel { display: block; }
  .help-win .help-topic { flex: 1; overflow: auto; padding: 4px 12px 30px; }
  .help-win .help-topic h3 { font: 400 14px "Ubuntu", "Segoe UI", sans-serif; color: var(--strong); margin: 10px 0 4px; }
  .help-win .help-topic p { margin: 4px 0 8px; }
  .help-win .help-res .sel { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .help-win .hl { background: var(--changed); }
</style>
</head>
<body>
<div class="draft-controls" id="draft-controls"></div>
<div class="titlebar" id="titlebar"></div>
<div class="main">
  <div class="rail sidebar" id="sidebar"></div>
  <div class="center" id="center"></div>
</div>
<div class="bottom" id="bottom"><span id="status-left"></span><span id="status-middle"></span><span id="status-right"></span></div>
<div id="help-layer"></div>
<div id="overlay"></div>
<script>
"use strict";

// ---- Widgets (each one an egui widget); the helpers of ruleset_editor.html ----
const open = new Set();     // the paths of open collapsing headers
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const row = (...kids) => h("div", { class: "row" }, ...kids);
const weak = text => h("span", { class: "weak" }, text);
const strong = text => h("span", { class: "strong" }, text);
function button(text, onclick, opts = {}) {
  return h("button", { onclick, disabled: opts.disabled, title: opts.title, class: opts.frame0 ? "frame0" : "" }, text);
}
function combo(options, value, set, opts = {}) {
  const s = h("select", { title: opts.title, class: opts.cls || "", disabled: opts.disabled,
    onchange: e => { set(e.target.value === "\u0000" ? null : e.target.value); structural(); } },
    options.map(([v, label]) => h("option", { value: v ?? "\u0000", selected: v === value }, label)));
  return s;
}
function selectable(label, on, toggle, title) {
  return h("span", { class: "sel" + (on ? " on" : ""), title, onclick: () => { toggle(); structural(); } }, label);
}
function collapsing(path, title, body, defaultOpen) {
  const isOpen = open.has(path) || (defaultOpen && !open.has("closed:" + path));
  const d = h("details", { open: isOpen, ontoggle: e => {
    if (e.target.open) { open.add(path); open.delete("closed:" + path); }
    else { open.delete(path); open.add("closed:" + path); }
  } }, h("summary", {}, title), h("div", { class: "body" }, isOpen ? body() : null));
  if (!isOpen) d.addEventListener("toggle", () => { if (d.open) render(); }, { once: true });
  return d;
}
function menu(label, items, opts = {}) {
  return h("button", { class: opts.frame0 ? "frame0" : "", title: opts.title, onclick: e => {
    e.stopPropagation();
    closeMenus();
    const r = e.target.getBoundingClientRect();
    const m = h("div", { class: "menu", style: `left:${r.left}px; top:${r.bottom + 2}px` },
      items.map(([text, fn, disabled, title]) => text === "-" ? h("div", { class: "sep", style: "margin:3px 0" })
        : h("button", { disabled, title, onclick: ev => { ev.stopPropagation(); closeMenus(); fn(); } }, text)));
    document.body.append(m);
    const bottom = m.getBoundingClientRect().bottom;
    if (bottom > window.innerHeight) m.style.top = Math.max(4, r.top - m.offsetHeight - 2) + "px";
  } }, label + " ⏷");
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenus);
// windowDrawer rebuilds the open window on every render(), immediate-mode
// style: a collapsing header's lazy body and a widget's derived state (a
// disabled input) then always show the frame's values. A plain window_ call
// draws a static window; a drawer re-registers itself after calling it.
let windowDrawer = null;
function window_(title, body, buttons) {
  windowDrawer = null;
  const ov = document.getElementById("overlay");
  ov.innerHTML = "";
  ov.append(h("div", { class: "modal-bg" }, h("div", { class: "window" },
    h("div", { class: "title" }, title), body, h("div", { class: "row", style: "justify-content:flex-end; margin-top:10px" }, buttons))));
}
function closeWindow() { windowDrawer = null; document.getElementById("overlay").innerHTML = ""; }

// ---- State and registry ----
const S = { activeTool: "team-compiler", sidebarCollapsed: false, pesVersion: "2019",
  // The selector's live check (gui.md "Sidebar" 2): pes_folder_path (** stands
  // for the version's two digits, studio_core's DEFAULT_PES_FOLDER), what the
  // last exe check found ("selected" / "other" / "none" / "no_folder", with
  // exeFoundVersion for "other"), a version_change_blocker, the background
  // poll's running PES and the once-per-program-life flag.
  pesFolder: "C:\\Program Files (x86)\\Pro Evolution Soccer 20**",
  exeFound: "selected", exeFoundVersion: "2017",
  blocker: null, runningPes: null, autoSwitchUsed: false,
  // Status-bar state (studio_core::status shapes): the active ShellCondition ids,
  // per-tool ToolActivity { done, total, elapsed } (elapsed in s), the current
  // Notice { text, action } and the draft's no-action notice lifetime.
  conditions: [], activities: {}, notice: null, noticeTimeoutS: 5,
  // Window-title state: a Notice published while unfocused holds its text in the
  // title until focus returns (gui.md "Window title", the held-notice row).
  focused: true, heldTitleNotice: null,
  // Help window (gui.md "Help window"): open target (HelpTarget's shape plus the
  // draft's extras), its geometry remembered across closes, and the panes'
  // scroll positions kept across render() rebuilds.
  help: null, helpWindow: { x: 120, y: 80, w: 760, h: 480 }, helpScroll: { tree: 0, topic: 0 } };
// The settings file's in-memory copy (spec/core/gui.md "Settings menu"):
// [common] is CommonSettings at its defaults (studio_core/settings/common.rs)
// and each tool's table, keyed by its id, its settings struct's defaults
// (team_compiler/settings.rs, save_editor/settings.rs; the Export upgrader's
// table is empty). pes_version and pes_folder_path alias the sidebar's values
// through the getters: one value, the selector and the menu edit the same
// thing. last_update_check, skipped_version and last_tool are state the shell
// writes, not settings a member edits: the menu does not show them.
S.settings = {
  common: {
    get pes_version() { return S.pesVersion; },
    set pes_version(v) { S.pesVersion = v; },
    get pes_folder_path() { return S.pesFolder; },
    set pes_folder_path(v) { S.pesFolder = v; },
    exports_folder_path: "exports",
    thread_count: 0,
    memory_cap_percent: 80,
    theme: "Dark",
    check_for_updates: true,
    check_interval_hours: 24,
    last_update_check: null,
    skipped_version: null,
    last_tool: null,
  },
  tools: {
    "team-compiler": {
      cpk_name: "4cc_99_test", output_folder_path: "output", savefile_path: "Auto",
      multicpk_mode: false, teams_cpk_name: "teams", cpk_part_max_size: 3221225472,
      bins_cpk_name: "4cc_08_bins", refs_cpk_name: "4cc_18_referees",
      dds_compression: "Auto", strict_file_type_check: true, pass_through: false,
      teams_list_path: "teams_list.txt",
    },
    "save-editor": { aatf_rules: "" },
    "export-upgrader": {},
  },
};
// Draft switch: the data folder cannot be written. saveSettings() raises
// data_dir_read_only on the failed write, not this switch itself.
S.dataDirUnwritable = false;
// Registry order of plans/core/architecture.md "Tool plugin interface"; icon is one
// Unicode glyph standing in for the egui-phosphor icon the comment names (no web
// font: the file stays self-contained).
const TOOLS = [
  { id: "team-compiler", label: "Team compiler", icon: "⚽", registered: true }, // soccer-ball
  { id: "save-editor", label: "Save editor", icon: "✎", registered: true }, // note-pencil
  { id: "stadium-compiler", label: "Stadium compiler", icon: "⌂", registered: false }, // stadium
  { id: "export-upgrader", label: "Export upgrader", icon: "⇧", registered: true }, // arrow-fat-up
  { id: "music-player", label: "Music player", icon: "♪", registered: false }, // music-note
  { id: "music-export-editor", label: "Music export editor", icon: "♫", registered: false }, // music-notes
  { id: "match-tracker", label: "Match tracker", icon: "◎", registered: false }, // crosshair
  { id: "kit-config-editor", label: "Kit config editor", icon: "▦", registered: false }, // t-shirt
  { id: "refs-arranger", label: "Refs arranger", icon: "⚑", registered: false }, // flag
  { id: "balls-compiler", label: "Balls compiler", icon: "◉", registered: false }, // soccer-ball
  { id: "player-aesthetics-editor", label: "Player aesthetics editor", icon: "☺", registered: false }, // smiley
  { id: "team-creator", label: "Team creator", icon: "✚", registered: false }, // plus-circle
  { id: "ruleset-editor", label: "Ruleset editor", icon: "§", registered: false }, // scroll
  { id: "db-generator", label: "DB generator", icon: "▤", registered: false }, // database
];
const PES_VERSIONS = ["2015", "2016", "2017", "2018", "2019", "2020", "2021"];

// The three ShellCondition variants, keyed by id; the wording is sample text for
// the maintainer to refine (the plan fixes kinds and lifetimes, not strings).
const CONDITION_DEFS = [
  { id: "data_dir_read_only", icon: "⚠", // warning
    text: () => "Data folder is read-only",
    tip: () => "Settings and the teams list cannot be saved; changes last for this session" },
  { id: "update_available", icon: "⬇", // download-simple
    text: () => "Update available: v0.2.0",
    tip: () => "A newer release is out",
    action: { label: "Install", does: "The updater dialog is not part of this draft" } },
  { id: "pes_install_missing", icon: "⚠", // warning
    text: () => "PES " + S.pesVersion + " not found in the PES folder",
    tip: () => "No PES " + S.pesVersion + " exe under " + resolvedPesFolder() },
];
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s) % 60).padStart(2, "0");
const toolLabel = id => TOOLS.find(t => t.id === id).label;
const activityText = (id, a) => `${toolLabel(id)} · ${a.done}/${a.total} · ${mmss(a.elapsed)}`;
// The registered tools reporting an activity, the active tool first when
// withActive (title order); false drops it (the middle slot hides the active
// tool's, its own run strip shows it).
function activityIds(withActive) {
  const others = TOOLS.filter(t => t.registered && t.id !== S.activeTool).map(t => t.id);
  const order = withActive ? [S.activeTool, ...others] : others;
  return order.filter(id => S.activities[id]);
}

// ---- Sidebar items 1 and 2 (gui.md "Sidebar") ----
// The resolved folder: pes_folder_path with ** replaced by the selection's two
// digits (studio_core's CommonSettings::pes_folder). In the real shell the exe
// check is one directory listing of this folder; here its result is the
// S.exeFound sample state, so "re-running the check" is redrawing with the new
// folder name.
const resolvedPesFolder = () => S.pesFolder.replaceAll("**", S.pesVersion.slice(2));
const folderOf = p => p.slice(0, p.lastIndexOf("\\"));
// The "Running game" draft combo's current value.
const runningPesKey = () => !S.runningPes ? "none"
  : S.runningPes.version === "2021" && folderOf(S.runningPes.path) === resolvedPesFolder()
    ? "resolved" : "other";
// The selector's colour: red when the folder holds a different version's exe,
// yellow when it holds no PES exe or does not exist (ST-SIDE-03; the two yellow
// cases differ in the tooltip only). Under a blocker the tooltip is the
// reason instead and the combo is disabled.
const pesSelectorClass = () =>
  S.exeFound === "other" ? "err" : S.exeFound === "none" || S.exeFound === "no_folder" ? "warn" : "";
function pesSelectorTip() {
  if (S.blocker) return S.blocker.tool + ": " + S.blocker.reason;
  const folder = resolvedPesFolder();
  if (S.exeFound === "other")
    return "Found PES" + S.exeFoundVersion + ".exe in " + folder + ": a different version than the selection";
  if (S.exeFound === "none") return "No PES exe in " + folder;
  if (S.exeFound === "no_folder") return folder + " does not exist";
  return folder + "\nThe PES version every tool targets";
}
// The one writer of pes_version (a common setting): a blocked change does not
// take; a manual change consumes the auto-switch and is saved like any
// settings change. The redraw re-runs the exe check's display.
function setPesVersion(v) {
  if (S.blocker) return;
  S.pesVersion = v;
  S.autoSwitchUsed = true;
  saveSettings();
}
// The once-per-life auto-switch to the running game (ST-SIDE-05): a blocker
// defers it without consuming it, a manual change consumes it.
function pollRunningPes() {
  const rp = S.runningPes;
  if (!rp || rp.version === S.pesVersion || S.autoSwitchUsed || S.blocker) return;
  S.pesVersion = rp.version;
  S.autoSwitchUsed = true;
  saveSettings(); // the switch writes the pes_version setting
  const action = folderOf(rp.path) !== resolvedPesFolder()
    ? { label: "Fix PES path", run: fixPesPath } : null;
  publishNotice("Switched to PES " + rp.version, action);
}
// "Fix PES path" rewrites pes_folder_path from the running exe's folder,
// putting ** back for the two digits of the version where a segment holds its
// year (D:\Games\PES2021 -> D:\Games\PES20**, since ** stands for two digits);
// opt-in, never automatic.
function fixPesPath() {
  const rp = S.runningPes;
  if (!rp) return;
  S.pesFolder = folderOf(rp.path).split("\\").map(seg => seg.replaceAll(rp.version, "20**")).join("\\");
  saveSettings(); // pes_folder_path is a common setting
  render();
}

// The logo's popup (ST-SIDE-06): the block a member pastes into a bug report.
// lastCopied is what the harness reads; headless runs may deny the clipboard.
let lastCopied = null;
function aboutText() {
  return ["4cc Studio v0.1.0", "Build: release", "Target: x86_64-pc-windows-msvc",
    "Data location: C:\\Users\\you\\AppData\\Roaming\\4cc-studio",
    "PES version: PES " + S.pesVersion].join("\n");
}
// openHelp opens, or retargets, the floating (non-modal) help window: target is
// HelpTarget's shape { tool, topic, anchor }. A missing topic opens the
// chapter's first; an unknown tool falls back to the active one's chapter.
function openHelp(target) {
  target = target || {};
  closeWindow(); // a modal (About, Settings) gives way to the floating window
  const tool = helpChapter(target.tool) ? target.tool
    : helpChapter(S.activeTool) ? S.activeTool : HELP[0].id;
  const ch = helpChapter(tool);
  S.help = { tool, topic: target.topic || ch.topics[0].slug,
    anchor: target.anchor || null, para: null, search: "", scrollPending: true };
  open.add("help/" + tool); open.delete("closed:help/" + tool);
  render();
}
function closeHelp() { S.help = null; render(); }
function helpChapter(id) { return HELP.find(c => c.id === id); }
// A chapter's topics in tree order: the written ones, then the generated
// Messages topic for chapters that have a catalog (the tools').
function helpTopics(ch) {
  return CATALOG[ch.id]
    ? ch.topics.concat([{ slug: "messages", title: "Messages" }])
    : ch.topics;
}
// Jump to a target inside the open window: the topic, the row or paragraph to
// highlight, and its chapter opened in the tree.
function helpGo(tool, topic, anchor, para) {
  S.help.tool = tool; S.help.topic = topic;
  S.help.anchor = anchor || null; S.help.para = para == null ? null : para;
  S.help.scrollPending = true; S.helpScroll.topic = 0;
  open.add("help/" + tool); open.delete("closed:help/" + tool);
  render();
}
// F1 opens the help on the active tool's chapter, like the ? button.
document.addEventListener("keydown", e => {
  if (e.key === "F1") { e.preventDefault(); openHelp({ tool: S.activeTool }); }
});

// The topic body's Markdown, rendered by this tiny stand-in for
// egui_commonmark: it covers only what the sample bodies use (## headings,
// paragraphs split on blank lines, `code` spans, **strong**, - list items and
// [text](tool-id#topic-slug) links).
function mdInline(text) {
  const kids = [];
  let rest = text;
  while (rest.length) {
    const m = rest.match(/\*\*([^*]+)\*\*|`([^`]+)`|\[([^\]]+)\]\(([^)]+)\)/);
    if (!m) { kids.push(rest); break; }
    if (m.index) kids.push(rest.slice(0, m.index));
    if (m[1] !== undefined) kids.push(strong(m[1]));
    else if (m[2] !== undefined) kids.push(h("code", { class: "mono" }, m[2]));
    else kids.push(helpLink(m[3], m[4]));
    rest = rest.slice(m.index + m[0].length);
  }
  return kids;
}
// An in-doc link, [text](tool-id#topic-slug): opens the help at that topic.
function helpLink(text, target) {
  const [tool, topic] = target.split("#");
  return h("a", { href: "#",
    onclick: e => { e.preventDefault(); openHelp({ tool, topic }); } }, text);
}
// A topic body as block elements; hlPara marks the paragraph index a search
// jump highlights.
function md(body, hlPara) {
  return body.split(/\n\s*\n/).map((b, i) => {
    const cls = i === hlPara ? "hl" : "";
    if (b.startsWith("## ")) return h("h3", { class: cls }, mdInline(b.slice(3)));
    if (b.startsWith("- "))
      return h("div", { class: cls }, b.split("\n").map(l =>
        l.startsWith("- ") ? h("div", {}, "• ", mdInline(l.slice(2))) : h("div", {}, mdInline(l))));
    return h("p", { class: cls }, mdInline(b.replaceAll("\n", " ")));
  });
}

// The help window's own drawer (like windowDrawer for modals): render() calls
// it every frame, so it must keep the search text, the input's focus and the
// panes' scroll positions across its own rebuild.
function drawHelp() {
  const layer = document.getElementById("help-layer");
  if (!S.help) { layer.innerHTML = ""; return; }
  const oldInput = layer.querySelector(".help-search");
  const hadFocus = oldInput && document.activeElement === oldInput;
  const caret = hadFocus ? oldInput.selectionStart : 0;
  const geo = S.helpWindow;
  const closeBtn = button("×", closeHelp, { frame0: true, title: "Close" });
  const win = h("div", { class: "window help-win",
    style: `left:${geo.x}px; top:${geo.y}px; width:${geo.w}px; height:${geo.h}px` },
    h("div", { class: "title-row", onmousedown: e => {
      if (!e.target.closest("button")) startHelpDrag(e, win);
    } }, h("div", { class: "title" }, "Help"), closeBtn),
    h("input", { type: "text", class: "help-search", placeholder: "Search the help",
      value: S.help.search,
      oninput: e => { S.help.search = e.target.value; drawHelpPanes(win); } }),
    h("div", { class: "help-body" }));
  layer.innerHTML = "";
  layer.append(win);
  drawHelpPanes(win);
  if (hadFocus) {
    const s = win.querySelector(".help-search");
    s.focus(); s.setSelectionRange(caret, caret);
  }
  // Geometry lives in S.helpWindow: a real resize (CSS resize: both) and a drag
  // end write it; closing does not touch it, so it survives close and reopen.
  new ResizeObserver(es => { for (const en of es) {
    S.helpWindow.w = en.target.offsetWidth; S.helpWindow.h = en.target.offsetHeight;
  } }).observe(win);
}
// The tree and the topic/results panes, rebuilt on every draw and on each
// keystroke of the search box (the input itself is left alone there, so it
// keeps focus).
function drawHelpPanes(win) {
  const body = win.querySelector(".help-body");
  const oldTree = body.querySelector(".help-tree");
  const oldTopic = body.querySelector(".help-topic");
  if (oldTree) S.helpScroll.tree = oldTree.scrollTop;
  if (oldTopic && !S.help.scrollPending) S.helpScroll.topic = oldTopic.scrollTop;
  body.innerHTML = "";
  const tree = h("div", { class: "help-tree" });
  const right = h("div", { class: "help-topic" });
  body.append(tree, right);
  // A jump (openHelp, a topic or a result click) scrolls itself; only a plain
  // redraw restores the kept scroll positions.
  const jumped = S.help.search.trim() ? (drawHelpResults(right), false) : drawHelpTopic(right);
  for (const ch of HELP) {
    tree.append(collapsing("help/" + ch.id, ch.title, () => helpTopics(ch).map(t =>
      h("span", { class: "sel" + (S.help.tool === ch.id && S.help.topic === t.slug ? " on" : ""),
        onclick: () => helpGo(ch.id, t.slug) }, t.title))));
  }
  tree.scrollTop = S.helpScroll.tree;
  if (!jumped) right.scrollTop = S.helpScroll.topic;
}
function drawHelpTopic(right) {
  const ch = helpChapter(S.help.tool) || HELP[0];
  if (S.help.topic === "messages" && CATALOG[ch.id])
    right.append(h("h2", {}, "Messages"), messagesTable(ch.id));
  else {
    const t = ch.topics.find(t => t.slug === S.help.topic) || ch.topics[0];
    right.append(h("h2", {}, t.title), ...md(t.body, S.help.para));
  }
  if (!S.help.scrollPending) return false;
  S.help.scrollPending = false;
  const hl = right.querySelector(".hl");
  if (hl) hl.scrollIntoView(); else right.scrollTop = 0;
  return true;
}
// The generated Messages topic: one row per catalog entry, the code's cell
// carrying a msg-<code> id for anchors, the severity coloured.
function messagesTable(chId) {
  const sevCls = { Info: "weak", Warning: "warn", Error: "err", Fatal: "err" };
  return h("table", { class: "grid" },
    h("tr", {}, h("th", {}, "ID"), h("th", {}, "Severity"), h("th", {}, "What it means")),
    CATALOG[chId].map(r => h("tr", { class: r.code === S.help.anchor ? "hl" : "" },
      h("td", {}, h("code", { class: "mono", id: "msg-" + r.code }, r.code)),
      h("td", {}, h("span", { class: sevCls[r.severity] }, r.severity)),
      h("td", {}, r.text))));
}
// Case-insensitive substring over every topic paragraph and every catalog row
// (gui.md "Help window": no index, no fuzzy matching). Each hit is a result:
// { ch, slug, label, para } for a paragraph, { ch, slug, label, code } for a row.
function helpSearch(q) {
  const res = [];
  for (const ch of HELP) {
    for (const t of ch.topics)
      t.body.split(/\n\s*\n/).forEach((para, i) => {
        if (para.toLowerCase().includes(q))
          res.push({ ch: ch.id, slug: t.slug, para: i,
            label: `${ch.title} › ${t.title} › ${para.replaceAll("\n", " ")}` });
      });
    for (const r of CATALOG[ch.id] || [])
      if ((r.code + " " + r.text).toLowerCase().includes(q))
        res.push({ ch: ch.id, slug: "messages", code: r.code,
          label: `${ch.title} › Messages › ${r.code}: ${r.text}` });
  }
  return res;
}
function drawHelpResults(right) {
  const res = helpSearch(S.help.search.trim().toLowerCase());
  if (!res.length) right.append(weak("Nothing matches."));
  right.append(h("div", { class: "help-res" }, res.map(r => h("span", { class: "sel",
    onclick: () => { S.help.search = ""; helpGo(r.ch, r.slug, r.code, r.para); } }, r.label))));
}
// Title-row dragging: the window follows the pointer, the drop writes
// S.helpWindow.x/y.
function startHelpDrag(e, win) {
  if (e.button !== 0) return;
  const dx = e.clientX - win.offsetLeft, dy = e.clientY - win.offsetTop;
  const move = ev => {
    win.style.left = Math.max(0, ev.clientX - dx) + "px";
    win.style.top = Math.max(0, ev.clientY - dy) + "px";
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    S.helpWindow.x = win.offsetLeft; S.helpWindow.y = win.offsetTop;
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
  e.preventDefault();
}
function openAbout() {
  const link = (t, fn) => h("a", { href: "#", onclick: e => { e.preventDefault(); if (fn) fn(); } }, t);
  window_("About 4cc Studio",
    h("div", {}, h("pre", { class: "mono" }, aboutText()),
      row(link("Release page"), link("Repository"), link("Help", () => openHelp({ tool: "setting-up" })))),
    [button("Copy", () => {
      lastCopied = aboutText();
      navigator.clipboard?.writeText(lastCopied)?.catch(() => {});
    }), button("Close", closeWindow)]);
}

// ---- Help window (gui.md "Help window") ----
// The help chapters (studio_core::help shapes): the four core chapters first,
// then one per registered tool in sidebar order. Sample bodies stand for the
// include_str! topics and the CHANGELOG embed; the Messages topic is appended
// by the renderer, never written here.
const HELP = [
  { id: "setting-up", title: "Setting up", topics: [
    { slug: "install", title: "Installing", body: [
      "4cc Studio ships as a zip: unpack it anywhere and run `4cc-studio.exe`.",
      "There is no installer, and the program writes nothing outside its data folder.",
      "",
      "The folder you unpack it into is the program's home: move it, copy it or",
      "delete it as one piece. Each tool of the suite is reached from the sidebar."
    ].join("\n") },
  ] },
  { id: "first-run", title: "First run and data location", topics: [
    { slug: "data-location", title: "Choosing the data location", body: [
      "The first run asks where your settings and data live. `Next to the program`",
      "puts them in a `data/` folder beside `4cc-studio.exe`: fully portable, so the",
      "folder carries the program and everything it keeps, and deleting it removes both.",
      "",
      "`In the user config directory` puts them in `%APPDATA%\\4cc-studio` on Windows,",
      "`~/.config/4cc-studio` on Linux: the data survives deleting or replacing the",
      "program folder."
    ].join("\n") },
  ] },
  { id: "updates", title: "Updates", topics: [
    { slug: "checking", title: "Checking for updates", body: [
      "The shell looks for a new release every `check_interval_hours` hours (24 by",
      "default); `check_for_updates` turns the check off. A newer version shows as",
      "`Update available` in the status bar with an `Install` action.",
      "",
      "Installing an update replaces the program and keeps the previous exe under",
      "`old/`. If a new version gives you trouble, the settings menu's roll-back",
      "swaps it back."
    ].join("\n") },
  ] },
  { id: "whats-new", title: "What's new", topics: [
    { slug: "changelog", title: "Changelog", body: [
      "## [Unreleased]",
      "- **Studio**: the help window, searched from one box.",
      "",
      "## [0.1.0] - 2026-10-04",
      "- **Team compiler**: first release.",
      "- **Save editor**: first release.",
      "- **Export upgrader**: first release."
    ].join("\n") },
  ] },
  { id: "team-compiler", title: "Team compiler", topics: [
    { slug: "command-line", title: "Running from a terminal", body: [
      "The Team compiler also runs without its window, from a terminal opened in the folder that holds",
      "`4cc-studio`:",
      "",
      "`check` reads your exports and reports what it finds, without writing anything. `compile` reads",
      "them, reports the same findings, and builds the CPK named by the `cpk_name` setting in the output",
      "folder (`output/` beside `4cc-studio` unless you changed the `output_folder_path` setting), as",
      "`<cpk_name>.cpk`. The CPK is written in full before it replaces the previous one, so",
      "`<cpk_name>.cpk` is never half-written. A run that finds nothing to compile, and has no file in",
      "the `overrides` folder (below), writes nothing and leaves the previous CPK as it was. If a file",
      "of an export changes while `compile` runs (someone saves over it, or replaces the archive), the",
      "run stops with the line `source_changed_during_run` naming the file, writes nothing, leaves the",
      "previous CPK in place, and ends with exit code 3: run it again. In this",
      "version `compile` builds exports for PES 2018 to 2021 that hold",
      "only the models of the players in the roster, kept in each player's own folder: face models,",
      "boots (a model whose name ends in `boots`, such as `kit_boots.fmdl`) and gloves (`glove_l`,",
      "`glove_r`, or `handL`, `handR`), with their textures, their portraits (a `portrait` image in",
      "the player's folder, or `player_NN` in the `Portraits` folder; a player with both gets one",
      "portrait when the two files are identical, while two that differ are the line",
      "`portrait_conflict` and the whole export is skipped, since the compiler cannot tell which one",
      "is meant), and kits. A texture (a player's, a shared folder's, a Common one, a kit's or a",
      "portrait) can be a `.dds`, `.ftex`, `.png`, `.jpg`, `.bmp`, `.webp`, `.tga` or `.tif` file:",
      "each is converted to",
      "what the chosen PES version reads, BC7 for PES 2019 to 2021 and BC3 for PES 2018 (BC1 when the",
      "image has no transparency at all; a `.dds` or `.ftex` already in a format the version reads is",
      "kept as it is), and an image without the smaller copies of itself the game needs (its mip",
      "levels) gets them generated. A portrait is the exception: the game reads it as a `.dds` on",
      "every version, so a `.dds` portrait is kept as it is (one under a DX10 header gets the header",
      "the game reads for its format, its pixels unchanged, reported as `portrait_header_rewritten`,",
      "except an uncompressed one no other header can describe, which is converted), and a portrait in",
      "any other format becomes a BC3 `.dds` of the same size with its mip levels. For PES 2015 to",
      "2018, which cannot read BC4, BC5 or BC7, a `.dds` portrait in one of those formats, under either",
      "header, is converted like any other image. A texture whose name ends in `_nrm`",
      "(`skin_nrm.png`) is a normal map and is encoded as one. A texture named with `kit1` to `kit9`",
      "(`pants_kit1.dds`, `pants_kit2.dds`) is the one the game shows when that kit is picked before",
      "a match, through a model that names `pants_kitN` instead: the game puts the picked kit's number",
      "in place of the `N`. A texture named `kitF` (`pants_kitF.dds`) is the set's fallback, the file",
      "a kit number with no variant of its own gets; it is never used under its own name, so a model",
      "naming `pants_kitF` finds nothing. When the team has a kit number (a `p1` to `p9` folder in `Kits`; the",
      "goalkeeper's `g1` goes with the number picked) with no texture of its own, it gets the set's",
      "fallback (`kitF`, else the lowest variant): for PES 2018 to 2021 the fallback is written once",
      "as `pants_kitN`, for PES 2015 to 2017 it is copied under the missing number's name, so the",
      "game never shows a missing texture; the warning `kit_variant_missing`",
      "names the texture, the kit and the copied file, and fires only when the set has no `kitF`.",
      "Per-kit models (`pants_kit1.fmdl` beside",
      "`pants_kit2.fmdl`, or `.model` files, or a mix of the two) need a `face.xml` to name them. On",
      "PES 2018 to 2021, and on PES 2015 to 2017 in a shared boots or gloves folder and in a folder",
      "holding `ingame_face`, the set's fallback is used (a model in the other game's format",
      "converted, a `.model` with its `.mtl`), and the warning `kit_variant_model_left_out` says so.",
      "On PES 2015 to 2017 a face's set is listed once in the",
      "`face.xml`, as `pants_kitN`, every variant is packed and the game loads the one for the kit",
      "picked; each variant's `.mtl` goes by the same rule (`pants_kit1.mtl` and `pants_kit2.mtl`, or",
      "one `pants.mtl` for all), and the warning `kit_variant_mtl_differs` names a variant whose `.mtl`",
      "would not be found that way. A kit number the team has with no model of the set gets the",
      "fallback's model copied for it, as a texture does (its `.mtl` too when that is the variant's own,",
      "`pants_kit1.mtl`), so the game never shows the player without that part; the `kitF` model and",
      "its `.mtl` are never packed under their own names, and the warning",
      "`kit_variant_missing` names the set, the kit and the copied model only when there is no",
      "`kitF`; the same holds for a set a player's own `face.xml` names. Six lines name a texture that cannot be",
      "used, each with the file: `texture_too_small` (a side under 4 pixels), `texture_not_div4` (for",
      "PES 2015 to 2017, a width or height that is not a multiple of 4: 1000 is one, 1002 is not),",
      "`texture_not_pow2` (a portrait whose width or height is not a power of two, or, for PES 2018",
      "to 2021, a texture with mip levels when neither its width nor its height is: 256, 512, 1024,",
      "...; a `.png` or other image always gets mip levels, a `.dds` or `.ftex` with a single level",
      "passes at any size), `kit_texture_too_big` (for PES 2015 to 2017, a kit's main `kit` texture,",
      "its own or the one from `all`, wider or taller than 2048 pixels or with a side that is not a",
      "power of two), `texture_type_mismatch` (a file renamed to another",
      "format instead of resaved, a PNG called `skin.dds`) and `texture_codec_unsupported` (a `.dds`",
      "or `.ftex` in a format the compiler does not read, BC6H for one, or a 16-bit or interleaved",
      "`.tga`: resave it). Both commands report them from the start of each file alone, so `check`",
      "finds them too, except a codec only converting the texture finds unreadable (BC6H): `compile`",
      "reports that one. What is left out depends on where the texture is: a player's or shared",
      "folder's texture leaves out the whole folder, a kit's texture the whole kit (a texture in `all`",
      "leaves out every kit using it), a `Common` texture only that file (the rest of `Common` is still",
      "built, and a player linking that file is left out with the line `link_target_dropped`), a",
      "portrait only that portrait. A `Common` texture that `compile` fails to convert, past those",
      "checks (`texture_codec_unsupported`, or `folder_pack_failed` for a file cut short), leaves out",
      "every texture of its folder (`Common/` itself, or the subfolder it is in). With `pass_through`",
      "on, a texture with `texture_too_small`, `texture_not_pow2` or `kit_texture_too_big`, a portrait",
      "included, is kept and converted as it is; a renamed one is still left out, and so is one with `texture_not_div4`, which those games cannot load at all. The",
      "team's logo",
      "is one image at the export's root named `logo` (`logo.png`), in any of the image formats",
      "above and of any size: `compile` makes the game's three logo sizes (512, 256 and 128 pixels",
      "square) from it. An image named `logo_small` beside it is used for the smallest size instead,",
      "when you want a different picture there. An image that is not square is fitted inside a",
      "transparent square, unless its name ends in `_crop` (`logo_crop.png`: the middle square is",
      "kept and the sides are cut off) or `_stretch` (the whole image is stretched to a square); the",
      "note `logo_fit_applied` says which was done. The warning `logo_upscaled` names an image",
      "smaller than the size it is made into, which is then enlarged and less sharp. A `logo` image at",
      "the export's root that is not a readable image is the line `logo_file_invalid`, from both",
      "commands, and the logo is left out even with `pass_through` on (a bad `logo_small` image",
      "leaves out all three sizes). A texture that",
      "cannot be read for any other reason is reported as",
      "`folder_pack_failed`, naming the file, and its folder is left out. For PES 2015 to 2017 a",
      "kit's `kit_mask` texture is built, a kit without one gets the compiler's built-in mask, and a",
      "`kit_srm` texture gets the line `kit_texture_not_used`: these versions do not read it, so it",
      "is not built, and the rest of the kit is. For PES 2018 to 2021 it is the other way round: the",
      "`kit_srm` is built, a kit without one gets none, and a `kit_mask` gets the line",
      "`kit_texture_not_used`. Kit configs go into the CPK as loose files, one per kit in the team's",
      "folder, and for PES 2015 to 2017 there is no `UniformParameter.bin`. The boots and",
      "gloves get the ID reserved for the player's roster",
      "slot, the same number for both. A face model whose vertices are weighted to the hand bones",
      "(`skh_`) has its hands cut off at the wrist into the player's gloves at compile time, which the",
      "note `model_hand_split` names; a model named as boots or gloves is never cut. A shared `Boots`",
      "or `Gloves` folder that players point at with a link file (an empty `Crocs.boots` in the",
      "player's folder names `Boots/Crocs`) is built once, with its own textures, under one of the 17 IDs the team keeps for shared folders, given out in",
      "the folders' name order (`Apple` before `Zebra`), and a player linking it gets no boots or gloves",
      "of their own. A player folder holding both a link file and a boots (or gloves) model of its own",
      "combines the two: the shared folder's models are merged into the player's own boots (or gloves)",
      "under the player's ID, its textures travel with them, and the line `link_combined` says so; the",
      "shared folder is still built on its own for any player linking it plainly. A link to a shared",
      "`Faces` folder (`Longhair.face` names `Faces/Longhair`) always combines: the shared folder's",
      "face models become part of the player's face, beside any face models of the player's own, and",
      "its `face_diff.bin` and `fcl_hair_sim.fclo` are used only when the player's folder has none of",
      "its own. A player can also load a model kept in the export's `Common` folder through an empty",
      "link file named after it plus `.common` (`legs.fmdl.common` directly in the player's folder",
      "names `Common/legs.fmdl`): the game cannot read a model",
      "from there, so the Common model is built into the player's own face, boots or gloves as if it",
      "were a model of the player's folder, under the name its own name gives it",
      "(`legs.fmdl.common` is face content, reported as `fmdl_fcl_hair_fallback` like a local",
      "`legs.fmdl`), and merged with the player's models of that name. A skeleton file named after it",
      "in `Common` (`Common/legs.skl`) comes with it. A `.model` in `Common` works the same way",
      "(`legs.model.common`): it is converted for each player linking it, with the `.mtl` a link",
      "finds (a `.mtl` named like it beside the link, else one in `Common`, else one beside the link),",
      "and a `.fmdl` of the same name in `Common` is used instead when there is one. A converted",
      "model's `.mtl` path into the team's PES 2015 to 2017 Common folder",
      "(`model/character/uniform/common/XXX/skin.dds`) names the team's Common folder instead when",
      "`Common` holds that texture, and is left as written otherwise. The textures in `Common`",
      "(image files directly in it) are built once for the whole team, whether a player uses them or not, and a",
      "Common model's textures of those names are read from there, so twenty players sharing one",
      "Common model share one copy of its textures. A player's own models can use a texture in",
      "`Common` the same way: an empty file named after it plus `.common` (`hair.dds.common` directly",
      "in the player's folder, for `Common/hair.dds`) makes",
      "the player's models use the team's one copy of `hair`, instead of a copy of the player's own.",
      "The player's folder must not also hold a texture of that name (`texture_stem_conflict`). The same terminal runs [the Save editor's commands](save-editor#command-line)."
    ].join("\n") },
  ] },
  { id: "save-editor", title: "Save editor", topics: [
    { slug: "command-line", title: "Running from a terminal", body: [
      "The Save editor's batch commands run from a terminal opened in the folder that holds",
      "`4cc-studio`. Every command names the save it reads (the `EDIT00000000` file of your PES",
      "install's save folder, or a copy of it); none picks one for you.",
      "",
      "A command that writes a save reads the one `--base` names and writes the one `--out` names,",
      "which may be the same file; a file already at `--out` (or `--bins-out` for the CPK",
      "`strip-and-seed` writes) is first copied to `<file>.bak` (one",
      "level: the next write replaces that copy). No command creates a save from nothing, and",
      "each of them refuses while the PES of the save's version is running: the game writes its own",
      "save back when it closes, over the one the command wrote. A PES of another version running",
      "does not stop it."
    ].join("\n") },
  ] },
  { id: "export-upgrader", title: "Export upgrader", topics: [
    { slug: "command-line", title: "Running from a terminal", body: [
      "The Export upgrader migrates an export in the old (AET) layout to the Studio",
      "format the Team compiler reads. Its commands run from a terminal opened in the",
      "folder that holds `4cc-studio`.",
      "",
      "`upgrade` takes one old export: a folder, a `.zip` or a `.7z`. A team export",
      "takes `--savefile`, naming the save (`EDIT00000000`) whose records say which",
      "player wears which boots and gloves, or `--loose` to infer the wearers from the",
      "IDs alone; a referee export (a name whose first word is `refs`) takes neither."
    ].join("\n") },
  ] },
];

// ---- Settings menu (gui.md "Settings menu") ----
// The settings file is written at the end of the frame, best-effort: a data
// folder that cannot be written keeps the session's values and raises
// data_dir_read_only, cleared when a later write succeeds. Never a prompt
// (ST-SET-03). savesAttempted is what the harness reads.
let savesAttempted = 0;
function saveSettings() {
  savesAttempted++;
  const i = S.conditions.indexOf("data_dir_read_only");
  if (S.dataDirUnwritable) { if (i < 0) S.conditions.push("data_dir_read_only"); }
  else if (i >= 0) S.conditions.splice(i, 1);
}
// No Save or Apply: a change applies as it is made, then the frame ends.
function settingChanged() { saveSettings(); render(); }

// Each tool's rows, in its settings struct's order: the settings key, the kind
// its type draws ("Other UI components": a bool a checkbox, a string or path a
// text edit, a number a number input, an enum a combo of its variants), the
// field's doc comment (the label's tooltip) and a weak hint. The Export
// upgrader has no settings; its section says so.
const TOOL_SETTINGS_SPEC = {
  "team-compiler": [
    ["cpk_name", "text", "The single output CPK's name, without .cpk.", "without .cpk"],
    ["output_folder_path", "text", "Where compiled CPKs go; a relative path resolves beside the executable.", "compiled CPKs go here"],
    ["savefile_path", ["Auto", "Path"], "The local savefile the compile's aesthetics patch is applied to.", "the savefile the patch is applied to"],
    ["multicpk_mode", "bool", "Cup DLC mode: team content split into size-capped parts plus a bins CPK.", "cup DLC mode"],
    ["teams_cpk_name", "text", "The stem of the teams part slots in multi-CPK mode.", "teams part slots' stem"],
    ["cpk_part_max_size", "num", "The most bytes a teams part may hold, its table of contents included; a single CPK past it is only warned about.", "bytes per teams part at most"],
    ["bins_cpk_name", "text", "The CPK, without .cpk, that holds the bins and the overrides in multi-CPK mode.", "multi-CPK bins CPK name"],
    ["refs_cpk_name", "text", "The CPK, without .cpk, that holds the referees of a normal compile whose exports include a refs export.", "referees CPK name"],
    ["dds_compression", ["Auto", "On", "Off"], "Whether every DDS a PES 15-17 run emits is WESYS-zlibbed.", "auto follows cup DLC mode"],
    ["strict_file_type_check", "bool", "Disallowed file types are errors when on, info notes when off.", "disallowed types are errors"],
    ["pass_through", "bool", "Keep folders with errors instead of discarding them.", "keep folders with errors"],
    ["teams_list_path", "text", "The working teams list; a relative path resolves in the data directory.", "the working teams list"],
  ],
  "save-editor": [
    ["aatf_rules", "text", "The AATF rules file check-aatf and the AATF panel run; empty: the official ruleset, built in.", "empty: the built-in ruleset"],
  ],
  "export-upgrader": [],
};

// A settings row: the settings key, its widget and a weak hint; the field's
// doc comment is the label's tooltip.
const sRow = (key, tip, widget, hint) =>
  h("tr", {}, h("td", {}, h("span", { title: tip }, key)),
    h("td", {}, widget), h("td", {}, weak(hint)));

// The common grid, always open (no header): one row per CommonSettings field a
// member edits, its doc comment the tooltip's source.
function commonSettingsRows() {
  const c = S.settings.common;
  const num = (key, attrs = {}) => h("input", { type: "number", value: c[key],
    ...attrs, onchange: e => { const v = parseFloat(e.target.value);
      if (!Number.isNaN(v)) { c[key] = v; settingChanged(); } } });
  const text = key => h("input", { type: "text", value: c[key],
    onchange: e => { c[key] = e.target.value; settingChanged(); } });
  // rfd's native folder picker; closing it returns to the menu.
  const browse = () => button("Browse", () => window_("Native folder dialog",
    weak("The native folder picker (rfd) opens here"),
    [button("OK", () => { closeWindow(); drawSettings(); })]));
  const theme = combo([["Dark", "Dark"], ["Light", "Light"]], c.theme,
    v => { c.theme = v; saveSettings(); });
  theme.id = "set-theme";
  return [
    sRow("pes_version", "The PES version the suite targets; the sidebar selector.",
      combo(PES_VERSIONS.map(v => [v, "PES " + v]), c.pes_version, setPesVersion,
        { disabled: !!S.blocker, title: pesSelectorTip() }), "the sidebar selector edits the same value"),
    sRow("pes_folder_path", "The PES installation folder, with ** standing for the two-digit version (20**).",
      [text("pes_folder_path"), browse()], "** stands for the two-digit version"),
    sRow("exports_folder_path", "Where exports are picked up. A relative path resolves beside the executable in both data-location modes, so it sits next to quick_compile.bat.",
      [text("exports_folder_path"), browse()], "a relative path resolves beside the executable"),
    sRow("thread_count", "Worker threads for pipelines; 0 means automatic (logical cores minus one).",
      num("thread_count", { id: "set-thread-count" }), "0 = automatic (logical cores minus one)"),
    sRow("memory_cap_percent", "Memory budget cap for pipelines, as a percentage of physical memory.",
      [num("memory_cap_percent", { step: "any" }), " %"], "of physical memory"),
    sRow("theme", "GUI color theme.", theme, "dark or light"),
    sRow("check_for_updates", "Whether the shell looks for new releases.",
      h("input", { type: "checkbox", checked: c.check_for_updates,
        onchange: e => { c.check_for_updates = e.target.checked; settingChanged(); } }),
      "the shell looks for new releases"),
    sRow("check_interval_hours", "Hours between release checks.",
      num("check_interval_hours", { disabled: !c.check_for_updates }),
      "disabled while the check is off"),
  ];
}

// A tool section's grid: the same label / widget / hint rows over its table.
function toolSettingRow(toolId, f) {
  const [key, kind, tip, hint] = f;
  const tbl = S.settings.tools[toolId];
  let widget;
  if (kind === "bool")
    widget = h("input", { type: "checkbox", checked: tbl[key],
      onchange: e => { tbl[key] = e.target.checked; settingChanged(); } });
  else if (kind === "num")
    widget = h("input", { type: "number", value: tbl[key],
      onchange: e => { const v = parseFloat(e.target.value);
        if (!Number.isNaN(v)) { tbl[key] = v; settingChanged(); } } });
  else if (kind === "text")
    widget = h("input", { type: "text", value: tbl[key],
      onchange: e => { tbl[key] = e.target.value; settingChanged(); } });
  else
    widget = combo(kind.map(v => [v, v]), tbl[key], v => { tbl[key] = v; saveSettings(); });
  return sRow(key, tip, widget, hint);
}

// The gear opens the menu: the common grid, then one collapsing section per
// registered tool in sidebar order, the active tool's open (ST-SET-01); the
// user may then toggle any, so the open set is fixed at open time.
function openSettings() {
  for (const t of TOOLS.filter(t => t.registered)) {
    open.delete("settings/" + t.id); open.delete("closed:settings/" + t.id);
  }
  open.add("settings/" + S.activeTool);
  drawSettings();
}
function drawSettings() {
  window_("Settings",
    h("div", { class: "settings-body" },
      h("table", { class: "grid" }, commonSettingsRows()),
      TOOLS.filter(t => t.registered).map(t => collapsing("settings/" + t.id, t.label, () =>
        TOOL_SETTINGS_SPEC[t.id].length
          ? h("table", { class: "grid" }, TOOL_SETTINGS_SPEC[t.id].map(f => toolSettingRow(t.id, f)))
          : weak("No settings")))),
    [button("Close", closeWindow)]);
  windowDrawer = drawSettings; // render() rebuilds the open window
}

// ---- Render: one state object, one pass (gui.md "Shell layout") ----
// gui.md "Window title": progress first, name last, a plain hyphen before the
// name. An activity outranks a held notice: the held-notice row of the table is
// the idle one.
function windowTitle() {
  const acts = activityIds(true);
  if (acts.length)
    return acts.map(id => activityText(id, S.activities[id])).join(" · ") + " - 4cc Studio";
  if (S.heldTitleNotice) return S.heldTitleNotice + " - 4cc Studio";
  return "4cc Studio";
}
// The title is set only when the string changes: the real shell sends
// ViewportCommand::Title once per change, not once per frame. titleSetCount is
// what the harness counts to check that.
let lastTitle = null, titleSetCount = 0;
function setTitle() {
  const t = windowTitle();
  if (t === lastTitle) return;
  lastTitle = t; titleSetCount++;
  document.title = t;
  const tb = document.getElementById("titlebar");
  tb.innerHTML = "";
  tb.append(weak("Window title:"), t);
}
function structural() { render(); }
function render() {
  closeMenus();
  setTitle();
  renderDraftControls();
  renderSidebar();
  renderCenter();
  renderStatus();
  if (windowDrawer) windowDrawer();
  drawHelp();
}

function cb(label, checked, set) {
  return h("label", { class: "cb" }, h("input", { type: "checkbox", checked,
    onchange: e => { set(e.target.checked); render(); } }), label);
}
// The strip visibly outside Studio: every control writes S and redraws.
function renderDraftControls() {
  const dc = document.getElementById("draft-controls");
  dc.innerHTML = "";
  const condCb = (id, label) => cb(label, S.conditions.includes(id), on => {
    const i = S.conditions.indexOf(id);
    if (on && i < 0) S.conditions.push(id); else if (!on && i >= 0) S.conditions.splice(i, 1);
  });
  dc.append(weak("Draft controls, not part of Studio"),
    cb("Sidebar collapsed", S.sidebarCollapsed, v => S.sidebarCollapsed = v),
    cb("Data folder unwritable", S.dataDirUnwritable, v => S.dataDirUnwritable = v),
    condCb("update_available", "Update available"),
    condCb("pes_install_missing", "PES install missing"),
    cb("Window focused", S.focused, v => {
      S.focused = v;
      if (v) S.heldTitleNotice = null;
    }),
    h("label", { class: "cb" }, "Exe in the PES folder",
      combo([["selected", "the selected version's exe"], ["other", "another version's exe (PES 2017)"],
        ["none", "no exe"], ["no_folder", "folder missing"]],
        S.exeFound, v => { S.exeFound = v; if (v === "other") S.exeFoundVersion = "2017"; })),
    cb("Match tracker blocks version changes", !!S.blocker, on =>
      S.blocker = on ? { tool: "Match tracker", reason: "The match tracker holds live memory addresses" } : null),
    h("span", { class: "group", style: "display:flex; gap:6px; align-items:center; margin:0; padding:1px 6px" },
      weak("Running game"),
      combo([["none", "none"], ["resolved", "PES 2021 from the resolved folder"],
        ["other", "PES 2021 from D:\\Games\\PES2021"]], runningPesKey(), v => {
        if (v === "none") S.runningPes = null;
        else S.runningPes = { version: "2021",
          path: (v === "resolved" ? resolvedPesFolder() : "D:\\Games\\PES2021") + "\\PES2021.exe" };
      }),
      button("Poll now", () => pollRunningPes())),
    cb("Save editor busy", !!S.activities["save-editor"], v => {
      if (v) S.activities["save-editor"] = { done: 3, total: 10, elapsed: 45 };
      else delete S.activities["save-editor"];
    }),
    button("Notice without action", () => publishNotice("Teams list is read-only", null)),
    button("Notice with action", () => publishNotice("Switched to PES 2021",
      { label: "Fix PES path", run: () => window_("Fix PES path",
        weak("Rewrites the PES folder setting from the running game's install folder"), [button("OK", closeWindow)]) })),
    button("Open help at portrait_conflict", () =>
      openHelp({ tool: "team-compiler", topic: "messages", anchor: "portrait_conflict" })),
    h("label", { class: "cb" }, "Notice timeout, s",
      h("input", { type: "number", id: "notice-timeout", value: S.noticeTimeoutS, min: 0, step: "any",
        onchange: e => { const v = parseFloat(e.target.value); if (v >= 0) S.noticeTimeoutS = v; } })));
}

// Sidebar, top to bottom as gui.md "Sidebar" 1-5.
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  sb.classList.toggle("collapsed", S.sidebarCollapsed);
  sb.append(h("div", { class: "logo", title: "About 4cc Studio", onclick: openAbout }, "4cc"));
  const pesSel = combo(
    PES_VERSIONS.map(v => [v, S.sidebarCollapsed ? v.slice(2) : "PES " + v]),
    S.pesVersion, setPesVersion,
    { title: pesSelectorTip(), cls: pesSelectorClass(), disabled: !!S.blocker });
  pesSel.id = "pes-version";
  sb.append(pesSel);
  for (const t of TOOLS.filter(t => t.registered).concat(TOOLS.filter(t => !t.registered))) {
    if (t.registered)
      sb.append(h("span", { class: "sel tool" + (S.activeTool === t.id ? " on" : ""), "data-id": t.id,
        title: t.label, onclick: () => { S.activeTool = t.id; render(); } },
        h("span", { class: "icon" }, t.icon), h("span", { class: "tlabel" }, t.label)));
    else
      sb.append(h("span", { class: "sel tool planned", "data-id": t.id, disabled: true,
        title: t.label + " is not in this build" },
        h("span", { class: "icon" }, t.icon), h("span", { class: "tlabel" }, t.label)));
  }
  const collapse = button(S.sidebarCollapsed ? "»" : "«",
    () => { S.sidebarCollapsed = !S.sidebarCollapsed; render(); },
    { frame0: true, title: S.sidebarCollapsed ? "Expand the sidebar" : "Collapse the sidebar" });
  collapse.id = "collapse-btn";
  sb.append(collapse);
  const gear = button("⚙", openSettings, { frame0: true, title: "Settings" });
  gear.id = "settings-btn";
  sb.append(h("div", { class: "tail" },
    button("?", () => openHelp({ tool: S.activeTool }), { frame0: true, title: "Help (F1)" }), gear));
}

// The central panel is the active tool's: each registered tool gets a stub until
// its own draft exists (docs/prototypes/<tool>.html).
function renderCenter() {
  const center = document.getElementById("center");
  center.innerHTML = "";
  const t = TOOLS.find(t => t.id === S.activeTool);
  center.append(h("h2", {}, t.label),
    weak("This view is drawn in its own draft, " + t.id.replaceAll("-", "_") + ".html."));
  if (t.id === "team-compiler") {
    center.append(h("table", { class: "grid" },
      [["/3/", "701"], ["/a/", "702"], ["/co/", "714"]].map(([name, id]) =>
        h("tr", { class: "sel" }, h("td", { class: "mono" }, name), h("td", { class: "mono" }, id)))),
      // The common settings reach every tool at its next frame (ST-SET-02).
      weak("Threads: " + S.settings.common.thread_count));
    const a = S.activities["team-compiler"];
    const compileBtn = button("Compile", startCompile, { disabled: !!a, title: "A fake run of 48 teams" });
    compileBtn.id = "compile-btn";
    center.append(row(compileBtn,
      a ? h("span", { class: "mono", id: "compile-progress" }, `${a.done}/${a.total} · ${mmss(a.elapsed)}`) : null),
      weak("Log panel: slice 6"));
  }
}

// Status bar (gui.md "Status bar"): left the version (always visible, the one
// always-visible item) then one entry per ShellCondition; middle the other
// tools' ToolActivitys; right the latest Notice. The row is a fixed 24px: long
// texts are cut and carry the full text as their tooltip.
function renderStatus() {
  const left = document.getElementById("status-left");
  left.innerHTML = "";
  left.append(h("span", { class: "weak small" }, "v0.1.0"));
  for (const c of CONDITION_DEFS) if (S.conditions.includes(c.id))
    left.append(h("span", { class: "cond", title: c.tip() },
      h("span", { class: "icon" }, c.icon), h("span", {}, c.text()),
      c.action && button(c.action.label, () =>
        window_(c.action.label, weak(c.action.does), [button("OK", closeWindow)]))));
  const mid = document.getElementById("status-middle");
  mid.innerHTML = "";
  activityIds(false).forEach((id, i) => {
    const txt = activityText(id, S.activities[id]);
    if (i) mid.append(h("span", { class: "weak" }, " · "));
    mid.append(h("span", { class: "act", title: txt }, txt));
  });
  const right = document.getElementById("status-right");
  right.innerHTML = "";
  const n = S.notice;
  if (n) {
    right.append(h("span", { class: "notice-txt", title: n.text }, n.text));
    if (n.action) {
      const actBtn = button(n.action.label, () => {
        const act = n.action; dismissNotice(); act.run();
      });
      actBtn.id = "notice-action";
      right.append(actBtn);
    }
    const x = button("×", dismissNotice, { frame0: true, title: "Dismiss" });
    x.id = "notice-dismiss";
    right.append(x);
  }
}

// The right slot's item kind. A new notice replaces the current one (older
// notices are not kept); one without an action leaves by itself after the
// draft's timeout, one with an action stays until clicked or dismissed. A
// notice published while the window is unfocused holds its text in the title.
let noticeTimer = null;
function publishNotice(text, action) {
  const n = { text, action };
  S.notice = n;
  clearTimeout(noticeTimer); noticeTimer = null;
  if (!action) noticeTimer = setTimeout(() => {
    if (S.notice === n) { S.notice = null; render(); }
  }, S.noticeTimeoutS * 1000);
  if (!S.focused) S.heldTitleNotice = text;
  render();
}
function dismissNotice() { S.notice = null; clearTimeout(noticeTimer); noticeTimer = null; render(); }

// The Team compiler stub's fake run: 48 teams, one every 250 ms, elapsed counted
// from the start; its activity is what the middle slot and the title read while
// another tool is active. No cancel button: the tool's own draft owns that.
let compileTimer = null;
function startCompile() {
  const start = Date.now();
  S.activities["team-compiler"] = { done: 0, total: 48, elapsed: 0 };
  render();
  compileTimer = setInterval(() => {
    const a = S.activities["team-compiler"];
    if (!a) { clearInterval(compileTimer); compileTimer = null; return; }
    a.done++;
    a.elapsed = Math.floor((Date.now() - start) / 1000);
    if (a.done >= a.total) {
      clearInterval(compileTimer); compileTimer = null;
      delete S.activities["team-compiler"];
      publishNotice("Compiled 48 teams", { label: "Open output",
        run: () => window_("Open output", weak("Opens the output folder in the file browser"), [button("OK", closeWindow)]) });
      return;
    }
    render();
  }, 250);
}

render();
</script>
