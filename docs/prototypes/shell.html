<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4cc Studio (shell draft)</title>
<!--
  A draft of the 4cc Studio shell: sidebar, status bar, settings menu, help window
  and window title (docs/plans/core/gui.md), drawn only with what egui can draw
  ("Prototypes before implementation"): its behaviour is faked with sample data and
  nothing is written. Slices 1 to 3 of 7: the skeleton, the sidebar with its
  collapse, stub central panels, the status bar's three slots, the window
  title, the PES selector's states and the About popup.
  Widget mapping: <select> = ComboBox, .sel = SelectableLabel, .menu = menu_button,
  details = CollapsingHeader, table.grid = Grid, .window = Window/Modal,
  title="" = on_hover_text, .sidebar = Panel::left, .bottom = Panel::bottom,
  .center = CentralPanel, .titlebar = ViewportCommand::Title.
-->
<style>
  :root {
    --panel: #1b1b1b; --extreme: #0a0a0a; --faint: #202020; --widget: #3c3c3c;
    --hover: #464646; --active: #373737; --stroke: #3c3c3c; --text: #8c8c8c;
    --strong: #dcdcdc; --sel-bg: #005c80; --sel-fg: #c0deff; --link: #5aaaff;
    --warn: #ff8f00; --error: #ff0000; --changed: #2a3a1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--panel); color: var(--text);
    font: 300 12.5px "Ubuntu", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top, .bottom { background: var(--panel); padding: 3px 8px; display: flex; gap: 8px; align-items: center; }
  .top { border-bottom: 1px solid var(--stroke); }
  .bottom { border-top: 1px solid var(--stroke); min-height: 26px; }
  .main { flex: 1; display: flex; min-height: 0; }
  .rail { width: 150px; border-right: 1px solid var(--stroke); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .center { flex: 1; overflow: auto; padding: 8px 12px 40px; min-width: 0; }
  .data { width: 590px; border-left: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
  .data pre { flex: 1; margin: 0; overflow: auto; background: var(--extreme); padding: 6px; font: 12px "Hack", "Consolas", monospace; color: #b4b4b4; }
  .data pre div { white-space: pre; min-height: 14px; }
  .data pre div.changed { background: var(--changed); }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  h2 { font: 400 15px "Ubuntu", "Segoe UI", sans-serif; color: var(--strong); margin: 4px 0 8px; }
  .strong { color: var(--strong); }
  .weak { color: #6e6e6e; }
  .warn { color: var(--warn); }
  .err { color: var(--error); }
  .mono { font-family: "Hack", "Consolas", monospace; font-size: 12px; }
  button, select, input { font: inherit; color: #b4b4b4; }
  button { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 6px; cursor: default; }
  button:hover:not(:disabled) { background: var(--hover); color: #f0f0f0; }
  button:active:not(:disabled) { background: var(--active); }
  button:disabled { color: #5a5a5a; }
  button.frame0 { background: transparent; }
  button.frame0:hover:not(:disabled) { background: var(--hover); }
  select { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 2px; }
  input[type=text], input[type=number] { background: var(--extreme); border: 1px solid var(--stroke); border-radius: 2px; padding: 1px 4px; }
  input[type=number] { width: 52px; background: var(--widget); border: 0; text-align: center; }
  input[type=text]:focus, input[type=number]:focus { outline: 1px solid var(--sel-fg); }
  input[type=color] { width: 22px; height: 16px; border: 0; padding: 0; background: none; }
  label.cb { display: inline-flex; align-items: center; gap: 4px; }
  input[type=checkbox], input[type=radio] { accent-color: var(--sel-bg); margin: 0; }
  .sel { padding: 1px 5px; border-radius: 2px; cursor: default; user-select: none; }
  .sel:hover { background: var(--hover); color: #f0f0f0; }
  .sel.on { background: var(--sel-bg); color: var(--sel-fg); }
  .rail .sel { padding: 3px 6px; display: flex; justify-content: space-between; }
  table.grid { border-collapse: collapse; }
  table.grid td, table.grid th { padding: 2px 4px; text-align: left; vertical-align: middle; }
  table.grid td > .row, table.grid td > span > .row { flex-wrap: nowrap; }
  table.grid th { font-weight: 400; color: var(--strong); }
  details { margin: 2px 0 4px; }
  details > summary { cursor: default; color: var(--strong); list-style: none; }
  details > summary::before { content: "\25B6"; font-size: 9px; display: inline-block; width: 14px; }
  details[open] > summary::before { content: "\25BC"; }
  details > .body { padding-left: 14px; }
  .group { border: 1px solid var(--stroke); border-radius: 2px; padding: 6px; margin: 6px 0; }
  .sep { border-top: 1px solid var(--stroke); margin: 8px 0; }
  .handle { cursor: grab; color: #6e6e6e; padding: 0 4px; user-select: none; }
  .dragover { outline: 1px solid var(--sel-fg); }
  .menu { position: fixed; background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 4px; z-index: 20; box-shadow: 0 4px 16px #000a; display: flex; flex-direction: column; min-width: 160px; }
  .menu button { text-align: left; background: transparent; padding: 2px 8px; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .modal-bg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .window { background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 8px 12px; box-shadow: 0 8px 24px #000c; min-width: 360px; max-width: 640px; }
  .window .title { color: var(--strong); font-size: 14px; margin-bottom: 8px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid #000; vertical-align: middle; }
  .chip { background: var(--widget); border-radius: 2px; padding: 0 4px; }
  /* shell */
  .draft-controls { border: 1px dashed var(--stroke); margin: 4px 4px 0; padding: 3px 8px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .titlebar { background: var(--extreme); border-bottom: 1px solid var(--stroke); padding: 2px 8px; display: flex; gap: 6px; }
  .sidebar { width: 160px; }
  .sidebar.collapsed { width: 56px; align-items: center; }
  .sidebar.collapsed .tlabel { display: none; }
  .sidebar.collapsed select { width: 44px; }
  .sidebar .tool { justify-content: flex-start; align-items: center; gap: 6px; border-left: 3px solid transparent; }
  .sidebar .tool.on { border-left-color: var(--sel-fg); }
  .sidebar .tool.planned { color: #6e6e6e; }
  .sidebar .tool.planned:hover { background: none; color: #6e6e6e; }
  .icon { display: inline-block; width: 16px; text-align: center; flex: none; }
  .logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--sel-fg); font-size: 15px; border-radius: 2px; user-select: none; }
  .logo:hover { background: var(--hover); }
  .sidebar .tail { margin-top: auto; display: flex; gap: 2px; }
  .sidebar.collapsed .tail { flex-direction: column; align-items: center; }
  .bottom { height: 24px; min-height: 24px; padding-top: 0; padding-bottom: 0; overflow: hidden; }
  .bottom > span { display: flex; align-items: center; flex: 1; gap: 8px; white-space: nowrap; overflow: hidden; min-width: 0; }
  #status-middle { justify-content: center; }
  #status-right { justify-content: flex-end; }
  .cond { display: inline-flex; align-items: center; gap: 3px; }
  .cond, .act, .notice-txt { overflow: hidden; text-overflow: ellipsis; }
  .small { font-size: 11px; }
  table.grid tr.sel:hover { background: var(--hover); }
  .window pre.mono { margin: 4px 0; }
  a { color: var(--link); }
</style>
</head>
<body>
<div class="draft-controls" id="draft-controls"></div>
<div class="titlebar" id="titlebar"></div>
<div class="main">
  <div class="rail sidebar" id="sidebar"></div>
  <div class="center" id="center"></div>
</div>
<div class="bottom" id="bottom"><span id="status-left"></span><span id="status-middle"></span><span id="status-right"></span></div>
<div id="overlay"></div>
<script>
"use strict";

// ---- Widgets (each one an egui widget); the helpers of ruleset_editor.html ----
const open = new Set();     // the paths of open collapsing headers
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const row = (...kids) => h("div", { class: "row" }, ...kids);
const weak = text => h("span", { class: "weak" }, text);
const strong = text => h("span", { class: "strong" }, text);
function button(text, onclick, opts = {}) {
  return h("button", { onclick, disabled: opts.disabled, title: opts.title, class: opts.frame0 ? "frame0" : "" }, text);
}
function combo(options, value, set, opts = {}) {
  const s = h("select", { title: opts.title, class: opts.cls || "", disabled: opts.disabled,
    onchange: e => { set(e.target.value === "\u0000" ? null : e.target.value); structural(); } },
    options.map(([v, label]) => h("option", { value: v ?? "\u0000", selected: v === value }, label)));
  return s;
}
function selectable(label, on, toggle, title) {
  return h("span", { class: "sel" + (on ? " on" : ""), title, onclick: () => { toggle(); structural(); } }, label);
}
function collapsing(path, title, body, defaultOpen) {
  const isOpen = open.has(path) || (defaultOpen && !open.has("closed:" + path));
  const d = h("details", { open: isOpen, ontoggle: e => {
    if (e.target.open) { open.add(path); open.delete("closed:" + path); }
    else { open.delete(path); open.add("closed:" + path); }
  } }, h("summary", {}, title), h("div", { class: "body" }, isOpen ? body() : null));
  if (!isOpen) d.addEventListener("toggle", () => { if (d.open) render(); }, { once: true });
  return d;
}
function menu(label, items, opts = {}) {
  return h("button", { class: opts.frame0 ? "frame0" : "", title: opts.title, onclick: e => {
    e.stopPropagation();
    closeMenus();
    const r = e.target.getBoundingClientRect();
    const m = h("div", { class: "menu", style: `left:${r.left}px; top:${r.bottom + 2}px` },
      items.map(([text, fn, disabled, title]) => text === "-" ? h("div", { class: "sep", style: "margin:3px 0" })
        : h("button", { disabled, title, onclick: ev => { ev.stopPropagation(); closeMenus(); fn(); } }, text)));
    document.body.append(m);
    const bottom = m.getBoundingClientRect().bottom;
    if (bottom > window.innerHeight) m.style.top = Math.max(4, r.top - m.offsetHeight - 2) + "px";
  } }, label + " ⏷");
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenus);
function window_(title, body, buttons) {
  const ov = document.getElementById("overlay");
  ov.innerHTML = "";
  ov.append(h("div", { class: "modal-bg" }, h("div", { class: "window" },
    h("div", { class: "title" }, title), body, h("div", { class: "row", style: "justify-content:flex-end; margin-top:10px" }, buttons))));
}
function closeWindow() { document.getElementById("overlay").innerHTML = ""; }

// ---- State and registry ----
const S = { activeTool: "team-compiler", sidebarCollapsed: false, pesVersion: "2019",
  // The selector's live check (gui.md "Sidebar" 2): pes_folder_path (** stands
  // for the version's two digits, studio_core's DEFAULT_PES_FOLDER), what the
  // last exe check found ("selected" / "other" / "none" / "no_folder", with
  // exeFoundVersion for "other"), a version_change_blocker, the background
  // poll's running PES and the once-per-program-life flag.
  pesFolder: "C:\\Program Files (x86)\\Pro Evolution Soccer 20**",
  exeFound: "selected", exeFoundVersion: "2017",
  blocker: null, runningPes: null, autoSwitchUsed: false,
  // Status-bar state (studio_core::status shapes): the active ShellCondition ids,
  // per-tool ToolActivity { done, total, elapsed } (elapsed in s), the current
  // Notice { text, action } and the draft's no-action notice lifetime.
  conditions: [], activities: {}, notice: null, noticeTimeoutS: 5,
  // Window-title state: a Notice published while unfocused holds its text in the
  // title until focus returns (gui.md "Window title", the held-notice row).
  focused: true, heldTitleNotice: null };
// Registry order of plans/core/architecture.md "Tool plugin interface"; icon is one
// Unicode glyph standing in for the egui-phosphor icon the comment names (no web
// font: the file stays self-contained).
const TOOLS = [
  { id: "team-compiler", label: "Team compiler", icon: "⚽", registered: true }, // soccer-ball
  { id: "save-editor", label: "Save editor", icon: "✎", registered: true }, // note-pencil
  { id: "stadium-compiler", label: "Stadium compiler", icon: "⌂", registered: false }, // stadium
  { id: "export-upgrader", label: "Export upgrader", icon: "⇧", registered: true }, // arrow-fat-up
  { id: "music-player", label: "Music player", icon: "♪", registered: false }, // music-note
  { id: "music-export-editor", label: "Music export editor", icon: "♫", registered: false }, // music-notes
  { id: "match-tracker", label: "Match tracker", icon: "◎", registered: false }, // crosshair
  { id: "kit-config-editor", label: "Kit config editor", icon: "▦", registered: false }, // t-shirt
  { id: "refs-arranger", label: "Refs arranger", icon: "⚑", registered: false }, // flag
  { id: "balls-compiler", label: "Balls compiler", icon: "◉", registered: false }, // soccer-ball
  { id: "player-aesthetics-editor", label: "Player aesthetics editor", icon: "☺", registered: false }, // smiley
  { id: "team-creator", label: "Team creator", icon: "✚", registered: false }, // plus-circle
  { id: "ruleset-editor", label: "Ruleset editor", icon: "§", registered: false }, // scroll
  { id: "db-generator", label: "DB generator", icon: "▤", registered: false }, // database
];
const PES_VERSIONS = ["2015", "2016", "2017", "2018", "2019", "2020", "2021"];

// The three ShellCondition variants, keyed by id; the wording is sample text for
// the maintainer to refine (the plan fixes kinds and lifetimes, not strings).
const CONDITION_DEFS = [
  { id: "data_dir_read_only", icon: "⚠", // warning
    text: () => "Data folder is read-only",
    tip: () => "Settings and the teams list cannot be saved; changes last for this session" },
  { id: "update_available", icon: "⬇", // download-simple
    text: () => "Update available: v0.2.0",
    tip: () => "A newer release is out",
    action: { label: "Install", does: "The updater dialog is not part of this draft" } },
  { id: "pes_install_missing", icon: "⚠", // warning
    text: () => "PES " + S.pesVersion + " not found in the PES folder",
    tip: () => "No PES " + S.pesVersion + " exe under " + resolvedPesFolder() },
];
const mmss = s => String(Math.floor(s / 60)).padStart(2, "0") + ":" + String(Math.floor(s) % 60).padStart(2, "0");
const toolLabel = id => TOOLS.find(t => t.id === id).label;
const activityText = (id, a) => `${toolLabel(id)} · ${a.done}/${a.total} · ${mmss(a.elapsed)}`;
// The registered tools reporting an activity, the active tool first when
// withActive (title order); false drops it (the middle slot hides the active
// tool's, its own run strip shows it).
function activityIds(withActive) {
  const others = TOOLS.filter(t => t.registered && t.id !== S.activeTool).map(t => t.id);
  const order = withActive ? [S.activeTool, ...others] : others;
  return order.filter(id => S.activities[id]);
}

// ---- Sidebar items 1 and 2 (gui.md "Sidebar") ----
// The resolved folder: pes_folder_path with ** replaced by the selection's two
// digits (studio_core's CommonSettings::pes_folder). In the real shell the exe
// check is one directory listing of this folder; here its result is the
// S.exeFound sample state, so "re-running the check" is redrawing with the new
// folder name.
const resolvedPesFolder = () => S.pesFolder.replaceAll("**", S.pesVersion.slice(2));
const folderOf = p => p.slice(0, p.lastIndexOf("\\"));
// The "Running game" draft combo's current value.
const runningPesKey = () => !S.runningPes ? "none"
  : S.runningPes.version === "2021" && folderOf(S.runningPes.path) === resolvedPesFolder()
    ? "resolved" : "other";
// The selector's colour: red when the folder holds a different version's exe,
// yellow when it holds no PES exe or does not exist (ST-SIDE-03; the two yellow
// cases differ in the tooltip only). Under a blocker the tooltip is the
// reason instead and the combo is disabled.
const pesSelectorClass = () =>
  S.exeFound === "other" ? "err" : S.exeFound === "none" || S.exeFound === "no_folder" ? "warn" : "";
function pesSelectorTip() {
  if (S.blocker) return S.blocker.tool + ": " + S.blocker.reason;
  const folder = resolvedPesFolder();
  if (S.exeFound === "other")
    return "Found PES" + S.exeFoundVersion + ".exe in " + folder + ": a different version than the selection";
  if (S.exeFound === "none") return "No PES exe in " + folder;
  if (S.exeFound === "no_folder") return folder + " does not exist";
  return folder + "\nThe PES version every tool targets";
}
// The once-per-life auto-switch to the running game (ST-SIDE-05): a blocker
// defers it without consuming it, a manual change consumes it.
function pollRunningPes() {
  const rp = S.runningPes;
  if (!rp || rp.version === S.pesVersion || S.autoSwitchUsed || S.blocker) return;
  S.pesVersion = rp.version;
  S.autoSwitchUsed = true;
  const action = folderOf(rp.path) !== resolvedPesFolder()
    ? { label: "Fix PES path", run: fixPesPath } : null;
  publishNotice("Switched to PES " + rp.version, action);
}
// "Fix PES path" rewrites pes_folder_path from the running exe's folder,
// putting ** back for the two digits of the version where a segment holds its
// year (D:\Games\PES2021 -> D:\Games\PES20**, since ** stands for two digits);
// opt-in, never automatic.
function fixPesPath() {
  const rp = S.runningPes;
  if (!rp) return;
  S.pesFolder = folderOf(rp.path).split("\\").map(seg => seg.replaceAll(rp.version, "20**")).join("\\");
  render();
}

// The logo's popup (ST-SIDE-06): the block a member pastes into a bug report.
// lastCopied is what the harness reads; headless runs may deny the clipboard.
let lastCopied = null;
function aboutText() {
  return ["4cc Studio v0.1.0", "Build: release", "Target: x86_64-pc-windows-msvc",
    "Data location: C:\\Users\\you\\AppData\\Roaming\\4cc-studio",
    "PES version: PES " + S.pesVersion].join("\n");
}
function openHelp() {
  window_("Help", weak("Help window: drawn in slice 5"), [button("OK", closeWindow)]);
}
function openAbout() {
  const link = (t, fn) => h("a", { href: "#", onclick: e => { e.preventDefault(); if (fn) fn(); } }, t);
  window_("About 4cc Studio",
    h("div", {}, h("pre", { class: "mono" }, aboutText()),
      row(link("Release page"), link("Repository"), link("Help", openHelp))),
    [button("Copy", () => {
      lastCopied = aboutText();
      navigator.clipboard?.writeText(lastCopied)?.catch(() => {});
    }), button("Close", closeWindow)]);
}

// ---- Render: one state object, one pass (gui.md "Shell layout") ----
// gui.md "Window title": progress first, name last, a plain hyphen before the
// name. An activity outranks a held notice: the held-notice row of the table is
// the idle one.
function windowTitle() {
  const acts = activityIds(true);
  if (acts.length)
    return acts.map(id => activityText(id, S.activities[id])).join(" · ") + " - 4cc Studio";
  if (S.heldTitleNotice) return S.heldTitleNotice + " - 4cc Studio";
  return "4cc Studio";
}
// The title is set only when the string changes: the real shell sends
// ViewportCommand::Title once per change, not once per frame. titleSetCount is
// what the harness counts to check that.
let lastTitle = null, titleSetCount = 0;
function setTitle() {
  const t = windowTitle();
  if (t === lastTitle) return;
  lastTitle = t; titleSetCount++;
  document.title = t;
  const tb = document.getElementById("titlebar");
  tb.innerHTML = "";
  tb.append(weak("Window title:"), t);
}
function structural() { render(); }
function render() {
  closeMenus();
  setTitle();
  renderDraftControls();
  renderSidebar();
  renderCenter();
  renderStatus();
}

function cb(label, checked, set) {
  return h("label", { class: "cb" }, h("input", { type: "checkbox", checked,
    onchange: e => { set(e.target.checked); render(); } }), label);
}
// The strip visibly outside Studio: every control writes S and redraws.
function renderDraftControls() {
  const dc = document.getElementById("draft-controls");
  dc.innerHTML = "";
  const condCb = (id, label) => cb(label, S.conditions.includes(id), on => {
    const i = S.conditions.indexOf(id);
    if (on && i < 0) S.conditions.push(id); else if (!on && i >= 0) S.conditions.splice(i, 1);
  });
  dc.append(weak("Draft controls, not part of Studio"),
    cb("Sidebar collapsed", S.sidebarCollapsed, v => S.sidebarCollapsed = v),
    condCb("data_dir_read_only", "Data folder read-only"),
    condCb("update_available", "Update available"),
    condCb("pes_install_missing", "PES install missing"),
    cb("Window focused", S.focused, v => {
      S.focused = v;
      if (v) S.heldTitleNotice = null;
    }),
    h("label", { class: "cb" }, "Exe in the PES folder",
      combo([["selected", "the selected version's exe"], ["other", "another version's exe (PES 2017)"],
        ["none", "no exe"], ["no_folder", "folder missing"]],
        S.exeFound, v => { S.exeFound = v; if (v === "other") S.exeFoundVersion = "2017"; })),
    cb("Match tracker blocks version changes", !!S.blocker, on =>
      S.blocker = on ? { tool: "Match tracker", reason: "The match tracker holds live memory addresses" } : null),
    h("span", { class: "group", style: "display:flex; gap:6px; align-items:center; margin:0; padding:1px 6px" },
      weak("Running game"),
      combo([["none", "none"], ["resolved", "PES 2021 from the resolved folder"],
        ["other", "PES 2021 from D:\\Games\\PES2021"]], runningPesKey(), v => {
        if (v === "none") S.runningPes = null;
        else S.runningPes = { version: "2021",
          path: (v === "resolved" ? resolvedPesFolder() : "D:\\Games\\PES2021") + "\\PES2021.exe" };
      }),
      button("Poll now", () => pollRunningPes())),
    cb("Save editor busy", !!S.activities["save-editor"], v => {
      if (v) S.activities["save-editor"] = { done: 3, total: 10, elapsed: 45 };
      else delete S.activities["save-editor"];
    }),
    button("Notice without action", () => publishNotice("Teams list is read-only", null)),
    button("Notice with action", () => publishNotice("Switched to PES 2021",
      { label: "Fix PES path", run: () => window_("Fix PES path",
        weak("Rewrites the PES folder setting from the running game's install folder"), [button("OK", closeWindow)]) })),
    h("label", { class: "cb" }, "Notice timeout, s",
      h("input", { type: "number", id: "notice-timeout", value: S.noticeTimeoutS, min: 0, step: "any",
        onchange: e => { const v = parseFloat(e.target.value); if (v >= 0) S.noticeTimeoutS = v; } })));
}

// Sidebar, top to bottom as gui.md "Sidebar" 1-5.
function renderSidebar() {
  const sb = document.getElementById("sidebar");
  sb.innerHTML = "";
  sb.classList.toggle("collapsed", S.sidebarCollapsed);
  sb.append(h("div", { class: "logo", title: "About 4cc Studio", onclick: openAbout }, "4cc"));
  const pesSel = combo(
    PES_VERSIONS.map(v => [v, S.sidebarCollapsed ? v.slice(2) : "PES " + v]),
    S.pesVersion, v => {
      if (S.blocker) return; // a blocked change does not take
      S.pesVersion = v; // the redraw re-runs the exe check's display
      S.autoSwitchUsed = true; // a manual change consumes the auto-switch
    }, { title: pesSelectorTip(), cls: pesSelectorClass(), disabled: !!S.blocker });
  pesSel.id = "pes-version";
  sb.append(pesSel);
  for (const t of TOOLS.filter(t => t.registered).concat(TOOLS.filter(t => !t.registered))) {
    if (t.registered)
      sb.append(h("span", { class: "sel tool" + (S.activeTool === t.id ? " on" : ""), "data-id": t.id,
        title: t.label, onclick: () => { S.activeTool = t.id; render(); } },
        h("span", { class: "icon" }, t.icon), h("span", { class: "tlabel" }, t.label)));
    else
      sb.append(h("span", { class: "sel tool planned", "data-id": t.id, disabled: true,
        title: t.label + " is not in this build" },
        h("span", { class: "icon" }, t.icon), h("span", { class: "tlabel" }, t.label)));
  }
  const collapse = button(S.sidebarCollapsed ? "»" : "«",
    () => { S.sidebarCollapsed = !S.sidebarCollapsed; render(); },
    { frame0: true, title: S.sidebarCollapsed ? "Expand the sidebar" : "Collapse the sidebar" });
  collapse.id = "collapse-btn";
  sb.append(collapse);
  sb.append(h("div", { class: "tail" },
    button("?", openHelp, { frame0: true, title: "Help (F1)" }),
    button("⚙", () => window_("Settings", weak("Settings menu: drawn in slice 4"), [button("OK", closeWindow)]), { frame0: true, title: "Settings" })));
}

// The central panel is the active tool's: each registered tool gets a stub until
// its own draft exists (docs/prototypes/<tool>.html).
function renderCenter() {
  const center = document.getElementById("center");
  center.innerHTML = "";
  const t = TOOLS.find(t => t.id === S.activeTool);
  center.append(h("h2", {}, t.label),
    weak("This view is drawn in its own draft, " + t.id.replaceAll("-", "_") + ".html."));
  if (t.id === "team-compiler") {
    center.append(h("table", { class: "grid" },
      [["/3/", "701"], ["/a/", "702"], ["/co/", "714"]].map(([name, id]) =>
        h("tr", { class: "sel" }, h("td", { class: "mono" }, name), h("td", { class: "mono" }, id)))));
    const a = S.activities["team-compiler"];
    const compileBtn = button("Compile", startCompile, { disabled: !!a, title: "A fake run of 48 teams" });
    compileBtn.id = "compile-btn";
    center.append(row(compileBtn,
      a ? h("span", { class: "mono", id: "compile-progress" }, `${a.done}/${a.total} · ${mmss(a.elapsed)}`) : null),
      weak("Log panel: slice 6"));
  }
}

// Status bar (gui.md "Status bar"): left the version (always visible, the one
// always-visible item) then one entry per ShellCondition; middle the other
// tools' ToolActivitys; right the latest Notice. The row is a fixed 24px: long
// texts are cut and carry the full text as their tooltip.
function renderStatus() {
  const left = document.getElementById("status-left");
  left.innerHTML = "";
  left.append(h("span", { class: "weak small" }, "v0.1.0"));
  for (const c of CONDITION_DEFS) if (S.conditions.includes(c.id))
    left.append(h("span", { class: "cond", title: c.tip() },
      h("span", { class: "icon" }, c.icon), h("span", {}, c.text()),
      c.action && button(c.action.label, () =>
        window_(c.action.label, weak(c.action.does), [button("OK", closeWindow)]))));
  const mid = document.getElementById("status-middle");
  mid.innerHTML = "";
  activityIds(false).forEach((id, i) => {
    const txt = activityText(id, S.activities[id]);
    if (i) mid.append(h("span", { class: "weak" }, " · "));
    mid.append(h("span", { class: "act", title: txt }, txt));
  });
  const right = document.getElementById("status-right");
  right.innerHTML = "";
  const n = S.notice;
  if (n) {
    right.append(h("span", { class: "notice-txt", title: n.text }, n.text));
    if (n.action) {
      const actBtn = button(n.action.label, () => {
        const act = n.action; dismissNotice(); act.run();
      });
      actBtn.id = "notice-action";
      right.append(actBtn);
    }
    const x = button("×", dismissNotice, { frame0: true, title: "Dismiss" });
    x.id = "notice-dismiss";
    right.append(x);
  }
}

// The right slot's item kind. A new notice replaces the current one (older
// notices are not kept); one without an action leaves by itself after the
// draft's timeout, one with an action stays until clicked or dismissed. A
// notice published while the window is unfocused holds its text in the title.
let noticeTimer = null;
function publishNotice(text, action) {
  const n = { text, action };
  S.notice = n;
  clearTimeout(noticeTimer); noticeTimer = null;
  if (!action) noticeTimer = setTimeout(() => {
    if (S.notice === n) { S.notice = null; render(); }
  }, S.noticeTimeoutS * 1000);
  if (!S.focused) S.heldTitleNotice = text;
  render();
}
function dismissNotice() { S.notice = null; clearTimeout(noticeTimer); noticeTimer = null; render(); }

// The Team compiler stub's fake run: 48 teams, one every 250 ms, elapsed counted
// from the start; its activity is what the middle slot and the title read while
// another tool is active. No cancel button: the tool's own draft owns that.
let compileTimer = null;
function startCompile() {
  const start = Date.now();
  S.activities["team-compiler"] = { done: 0, total: 48, elapsed: 0 };
  render();
  compileTimer = setInterval(() => {
    const a = S.activities["team-compiler"];
    if (!a) { clearInterval(compileTimer); compileTimer = null; return; }
    a.done++;
    a.elapsed = Math.floor((Date.now() - start) / 1000);
    if (a.done >= a.total) {
      clearInterval(compileTimer); compileTimer = null;
      delete S.activities["team-compiler"];
      publishNotice("Compiled 48 teams", { label: "Open output",
        run: () => window_("Open output", weak("Opens the output folder in the file browser"), [button("OK", closeWindow)]) });
      return;
    }
    render();
  }, 250);
}

render();
</script>
