<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4cc Studio: Save editor (draft)</title>
<!--
  A draft of the Save editor's GUI (docs/plans/save_editor.md "Editing UI"),
  slices 1-3 of the build order (open/save, the player list, the info strip and
  quick actions, the Abilities & Skills, Appearance, Team and Tactics tabs),
  drawn only with what egui can draw (docs/plans/core/gui.md "Prototypes before
  implementation"). Its behaviour is faked with sample data transcribed from
  real saves; nothing is written, nothing reads the real libs. The sidebar is
  static (the shell is shell.html's draft); its PES selector's value is one of
  the draft controls' GIVENs.
  Widget mapping: <select> = ComboBox, <input type=text> = TextEdit,
  <input type=number> = DragValue, <input type=checkbox> = CheckBox,
  <input type=range> = Slider, .sel = SelectableLabel, .menu = menu_button,
  details = CollapsingHeader, table.grid = Grid, .window in .modal-bg =
  egui's Modal, .tabrow .sel = the tab bar (selectable labels), a .swatch row =
  a palette-index choice (framed widgets, never a colour picker), title="" =
  on_hover_text (on_disabled_hover_text on the span around a disabled
  control), row drag = Sense::drag, .sidebar = Panel::left, .bottom =
  Panel::bottom, .center = CentralPanel.
  The Tactics tab's pitch: the <canvas> is the egui Painter (the frame and
  every marker are drawn there; marker hit tests are ui.interact on each
  marker's rect, drag Sense::drag); .tpopover = egui::popup (area below the
  marker); the .lrow lists = the starting-eleven and bench lists (Sense::drag
  rows, a drop on a pitch marker swaps); a role chip (.rolechip) = a button
  that arms an assignment mode; .badge = a small framed label
  (remaining-count badges of the card pickers, red over the limit).
-->
<style>
  :root {
    --panel: #1b1b1b; --extreme: #0a0a0a; --faint: #202020; --widget: #3c3c3c;
    --hover: #464646; --active: #373737; --stroke: #3c3c3c; --text: #8c8c8c;
    --strong: #dcdcdc; --sel-bg: #005c80; --sel-fg: #c0deff; --link: #5aaaff;
    --warn: #ff8f00; --error: #ff0000; --changed: #2a3a1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--panel); color: var(--text);
    font: 300 12.5px "Ubuntu", "Segoe UI", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .top, .bottom { background: var(--panel); padding: 3px 8px; display: flex; gap: 8px; align-items: center; }
  .top { border-bottom: 1px solid var(--stroke); }
  .bottom { border-top: 1px solid var(--stroke); min-height: 26px; height: 24px; padding-top: 0; padding-bottom: 0; overflow: hidden; }
  .bottom > span { display: flex; align-items: center; flex: 1; gap: 8px; white-space: nowrap; overflow: hidden; min-width: 0; }
  .main { flex: 1; display: flex; min-height: 0; }
  .rail { width: 150px; border-right: 1px solid var(--stroke); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .center { flex: 1; overflow: auto; padding: 8px 12px 40px; min-width: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  h2 { font: 400 15px "Ubuntu", "Segoe UI", sans-serif; color: var(--strong); margin: 4px 0 8px; }
  .strong { color: var(--strong); }
  .weak { color: #6e6e6e; }
  .warn { color: var(--warn); }
  .err { color: var(--error); }
  .mono { font-family: "Hack", "Consolas", monospace; font-size: 12px; }
  button, select, input { font: inherit; color: #b4b4b4; }
  button { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 6px; cursor: default; }
  button:hover:not(:disabled) { background: var(--hover); color: #f0f0f0; }
  button:active:not(:disabled) { background: var(--active); }
  button:disabled { color: #5a5a5a; }
  button.frame0 { background: transparent; }
  button.frame0:hover:not(:disabled) { background: var(--hover); }
  select { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 2px; }
  input[type=text], input[type=number] { background: var(--extreme); border: 1px solid var(--stroke); border-radius: 2px; padding: 1px 4px; }
  input[type=number] { width: 52px; background: var(--widget); border: 0; text-align: center; }
  input[type=text]:focus, input[type=number]:focus { outline: 1px solid var(--sel-fg); }
  label.cb { display: inline-flex; align-items: center; gap: 4px; }
  input:disabled, select:disabled { color: #5a5a5a; opacity: .55; }
  .cb:has(input:disabled) { color: #5a5a5a; }
  .gate { display: inline-block; opacity: .6; }
  input[type=checkbox], input[type=radio] { accent-color: var(--sel-bg); margin: 0; }
  input[type=range] { width: 110px; accent-color: var(--sel-bg); }
  .sel { padding: 1px 5px; border-radius: 2px; cursor: default; user-select: none; }
  .sel:hover { background: var(--hover); color: #f0f0f0; }
  .sel.on { background: var(--sel-bg); color: var(--sel-fg); }
  .rail .sel { padding: 3px 6px; display: flex; justify-content: space-between; }
  table.grid { border-collapse: collapse; }
  table.grid td, table.grid th { padding: 2px 4px; text-align: left; vertical-align: middle; }
  table.grid td > .row, table.grid td > span > .row { flex-wrap: nowrap; }
  table.grid th { font-weight: 400; color: var(--strong); }
  details { margin: 2px 0 4px; }
  details > summary { cursor: default; color: var(--strong); list-style: none; }
  details > summary::before { content: "\25B6"; font-size: 9px; display: inline-block; width: 14px; }
  details[open] > summary::before { content: "\25BC"; }
  details > .body { padding-left: 14px; }
  .group { border: 1px solid var(--stroke); border-radius: 2px; padding: 6px; margin: 6px 0; }
  .sep { border-top: 1px solid var(--stroke); margin: 8px 0; }
  .handle { cursor: grab; color: #6e6e6e; padding: 0 4px; user-select: none; }
  .dragover { outline: 1px solid var(--sel-fg); }
  .menu { position: fixed; background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 4px; z-index: 20; box-shadow: 0 4px 16px #000a; display: flex; flex-direction: column; min-width: 160px; }
  .menu button { text-align: left; background: transparent; padding: 2px 8px; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .modal-bg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .window { background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 8px 12px; box-shadow: 0 8px 24px #000c; min-width: 360px; max-width: 640px; }
  .window .title { color: var(--strong); font-size: 14px; margin-bottom: 8px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid #000; vertical-align: middle; }
  .chip { background: var(--widget); border-radius: 2px; padding: 0 4px; }
  a { color: var(--link); }
  .small { font-size: 11px; }
  /* draft controls (visibly outside Studio) */
  .draft-controls { border: 1px dashed var(--stroke); margin: 4px 4px 0; padding: 3px 8px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    position: relative; z-index: 15; }
  .draft-controls > details { flex-basis: 100%; }
  .draft-controls .dcgroup { margin-left: 6px; }
  .titlebar { background: var(--extreme); border-bottom: 1px solid var(--stroke); padding: 2px 8px; display: flex; gap: 6px; }
  /* save editor view */
  .sidebar .tool { justify-content: flex-start; align-items: center; gap: 6px; border-left: 3px solid transparent; }
  .sidebar .tool.on { border-left-color: var(--sel-fg); }
  .sidebar .tool.planned { color: #6e6e6e; }
  .sidebar .tool.planned:hover { background: none; color: #6e6e6e; }
  .icon { display: inline-block; width: 16px; text-align: center; flex: none; }
  .logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--sel-fg); font-size: 15px; border-radius: 2px; user-select: none; }
  .sidebar .sep { align-self: stretch; margin: 4px 0; }
  .sidebar .tail { display: flex; gap: 2px; margin-top: auto; }
  .toolbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
  .master { display: flex; gap: 12px; align-items: flex-start; }
  .plist { width: 240px; flex: none; display: flex; flex-direction: column; gap: 4px; }
  .plist .rows { background: var(--extreme); border: 1px solid var(--stroke); min-height: 200px; max-height: 460px; overflow: auto; }
  .plist .rows .prow { display: flex; gap: 5px; align-items: center; padding: 1px 4px; white-space: nowrap; }
  .plist .rows .prow:hover { background: var(--hover); }
  .plist .rows .prow.on { background: var(--sel-bg); }
  .plist .num { color: #6e6e6e; width: 20px; text-align: right; flex: none; }
  .plist .pos { width: 28px; flex: none; color: #b4b4b4; }
  .plist .tshort { color: #6e6e6e; flex: none; }
  .plist .dot { color: var(--warn); margin-left: auto; }
  .detail { flex: 1; min-width: 0; }
  .info-grid td { padding: 1px 6px 1px 0; }
  .info-grid input[type=text] { width: 190px; }
  .info-grid input.shirt { width: 110px; }
  .info-grid input[type=number] { width: 46px; }
  .tabrow { display: flex; gap: 2px; border-bottom: 1px solid var(--stroke); margin: 8px 0 6px; }
  .tabrow .sel { border-radius: 2px 2px 0 0; padding: 2px 10px; }
  .stats-grid td { padding: 1px 8px 1px 0; }
  .stats-grid input[type=number] { width: 40px; }
  .posgrid td { padding: 1px 10px 1px 0; }
  .rate { display: inline-flex; gap: 1px; }
  .rate .sel { padding: 0 5px; }
  .rate .sel.on { background: var(--sel-bg); }
  .rate.off .sel { color: #5a5a5a; }
  .rate.off .sel:hover { background: none; color: #5a5a5a; }
  .skillgrid td { padding: 0 12px 0 0; }
  .palette { display: inline-flex; gap: 2px; align-items: center; }
  .palette .swatch.on { outline: 1px solid var(--sel-fg); }
  .palette.off .swatch { opacity: .45; }
  .palette.off .swatch:hover { outline: none; }
  .palette .swatch:hover { outline: 1px solid var(--hover); }
  .palette.off { pointer-events: none; }
  .vbanner { border: 1px solid var(--warn); border-radius: 2px; padding: 3px 8px; margin: 4px 0; }
  /* tactics tab */
  .tacbar { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .taccols { display: flex; gap: 14px; align-items: flex-start; }
  .pitch { background: #173517; border: 1px solid var(--stroke); display: block;
    touch-action: none; }
  .lcol { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
  .llist { background: var(--extreme); border: 1px solid var(--stroke);
    max-height: 300px; overflow: auto; }
  .lrow { display: flex; gap: 5px; align-items: center; padding: 1px 4px;
    white-space: nowrap; }
  .lrow:hover { background: var(--hover); }
  .lrow .fpos { width: 30px; flex: none; color: #b4b4b4; }
  .lrow.empty { color: #4e4e4e; }
  .tpopover { position: absolute; background: var(--panel);

    z-index: 30; box-shadow: 0 4px 16px #000a; }
  .rolechip { border-radius: 2px; padding: 1px 6px; cursor: default; }
  .rolechip:hover { background: var(--hover); color: #f0f0f0; }
  .rolechip.armed { background: var(--sel-bg); color: var(--sel-fg); }
  .badge { display: inline-block; background: var(--widget); border-radius: 2px;
    padding: 0 4px; margin-right: 2px; }
  .badge.over { color: var(--error); }
  .assignnote { border: 1px solid var(--sel-fg); border-radius: 2px;
    padding: 3px 8px; margin: 4px 0; }
</style>
</head>

"use strict";

// ---- Widgets (each one an egui widget); the helpers of shell.html ----
const open = new Set();
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const row = (...kids) => h("div", { class: "row" }, ...kids);
const weak = text => h("span", { class: "weak" }, text);
const strong = text => h("span", { class: "strong" }, text);
function button(text, onclick, opts = {}) {
  return h("button", { onclick, disabled: opts.disabled, title: opts.title, class: opts.frame0 ? "frame0" : "" }, text);
}
function combo(options, value, set, opts = {}) {
  const s = h("select", { title: opts.title, class: opts.cls || "", disabled: opts.disabled,
    onchange: e => { set(e.target.value === "\u0000" ? null : e.target.value); structural(); } },
    options.map(([v, label]) => h("option", { value: v ?? "\u0000", selected: v === value }, label)));
  return s;
}
function selectable(label, on, toggle, title) {
  return h("span", { class: "sel" + (on ? " on" : ""), title, onclick: () => { toggle(); structural(); } }, label);
}
function collapsing(path, title, body, defaultOpen) {
  const isOpen = open.has(path) || (defaultOpen && !open.has("closed:" + path));
  const d = h("details", { open: isOpen, ontoggle: e => {
    if (e.target.open) { open.add(path); open.delete("closed:" + path); }
    else { open.delete(path); open.add("closed:" + path); }
  } }, h("summary", {}, title), h("div", { class: "body" }, isOpen ? body() : null));
  if (!isOpen) d.addEventListener("toggle", () => { if (d.open) render(); }, { once: true });
  return d;
}
function menu(label, items, opts = {}) {
  return h("button", { class: opts.frame0 ? "frame0" : "", title: opts.title, onclick: e => {
    e.stopPropagation();
    closeMenus();
    const r = e.target.getBoundingClientRect();
    const m = h("div", { class: "menu", style: `left:${r.left}px; top:${r.bottom + 2}px` },
      items.map(([text, fn, disabled, title]) => text === "-" ? h("div", { class: "sep", style: "margin:3px 0" })
        : h("button", { disabled, title, onclick: ev => { ev.stopPropagation(); closeMenus(); fn(); } }, text)));
    document.body.append(m);
    const bottom = m.getBoundingClientRect().bottom;
    if (bottom > window.innerHeight) m.style.top = Math.max(4, r.top - m.offsetHeight - 2) + "px";
  } }, label + " ⏷");
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenus);
let windowDrawer = null;
function window_(title, body, buttons) {
  windowDrawer = null;
  const ov = document.getElementById("overlay");
  ov.innerHTML = "";
  ov.append(h("div", { class: "modal-bg" }, h("div", { class: "window" },
    h("div", { class: "title" }, title), body, h("div", { class: "row", style: "justify-content:flex-end; margin-top:10px" }, buttons))));
}
function closeWindow() { windowDrawer = null; document.getElementById("overlay").innerHTML = ""; }
function cb(label, checked, set) {
  return h("label", { class: "cb" }, h("input", { type: "checkbox", checked,
    onchange: e => { set(e.target.checked); render(); } }), label);
}
function structural() { render(); }

// ---- The card pickers' remaining-count badges (team_widgets "cards") ----
// The draft's fake of aatf::card_limits (spec/aatf_rules.md "The card
// economy"). Read for each number: the tier's `cards` for the limit, its
// `a_positions` for the A allowance, its `free` groups and the `card_groups`
// they name for covered cards, and the ruleset's free-card specials whose
// `when` is absent or mentions only tiers (tested as the queried tier),
// captain or positions (VTL11's pass skills). Not faked: `choice` effects,
// `cards`/`a_positions`/`free` effects and `when`s on brackets, systems or
// heights (the manlet bonus, the medals' choice), so a badge can read low,
// never high; nor the B-counts-as-A flag for rulesets that lack it.
function cardLimits(p, t, tier) {
  const rs = RULESETS[D.ruleset];
  const freeCards = new Set();
  for (const s of rs.free_specials || []) {
    if (s.tiers && !s.tiers.includes(tier.id)) continue;
    if (s.captain && t.captain !== p.slot - 1) continue;
    if (s.positions && !s.positions.includes(p.positions.registered)) continue;
    freeCards.add(s.card);
  }
  const left = {};
  for (const [g, n] of Object.entries(tier.free || {})) left[g] = n;
  const groupsOf = card =>
    Object.entries(rs.card_groups || {})
      .filter(([, members]) => members.includes(card)).map(([g]) => g)
      .concat(COM_STYLES.includes(card) ? ["com"] : []);
  let paid = 0;
  for (const card of p.skills.concat(p.com_styles)) {
    if (freeCards.has(card)) continue;
    const cover = groupsOf(card).find(g => left[g] > 0);
    if (cover) left[cover] -= 1;
    else paid += 1;
  }
  let a = 0, b = 0;
  for (const r of Object.values(p.positions.playable)) {
    if (r === "A") a += 1; else if (r === "B") b += 1;
  }
  const counted = a + (rs.b_uses_a ? b : 0);
  const limit = tier.cards - Math.max(0, counted - (tier.a_positions || 0));
  return { paid, limit, left: limit - paid };
}
// One badge per tier of the active ruleset: the cards the player can still
// afford under it, the error colour when overdrawn. sample wording: the
// tooltip.
function cardBadges(p, t) {
  return h("span", { class: "row", id: "card-badges",
      title: "Cards left under each tier of the active ruleset (paid cards vs its limit)" },
    weak("Cards left"),
    RULESETS[D.ruleset].tiers.map(tier => {
      const c = cardLimits(p, t, tier);
      return h("span", { class: "badge" + (c.left < 0 ? " over" : ""),
        title: tier.label + ": " + c.paid + " paid of " + c.limit },
        tier.label + " " + c.left);
    }));
}

const CODE_RE = /\x11c([0-9a-fA-F]{8})|\x11d/g;

  const e = S.undo.pop(); if (!e) return;
  const cur = snapshot(); restore(e.before);
  S.redo.push({ label: e.label, before: e.before, after: cur });
  render();
}

  const e = S.redo.pop(); if (!e) return;

  S.undo.push({ label: e.label, before: cur, after: e.after });

// ---- Quick actions (SE-GUI-09) ----
// The fake of aatf::apply_tier: the rating stats go to the tier's rate, its
// stats map overrides them, and form / injury resistance / weak foot take the
// tier's game numbers (stored one lower). name_color rewrites the name's
// leading code; a tier that sets none removes a leading code this ruleset's
// tiers use and keeps any other. One undoable edit.
function applyTier(p, tier) {
  edit("Make " + tier.label, () => {
    for (const s of RATING_STATS)
      if (p.stats[s] !== undefined) p.stats[s] = tier.rate;
    for (const [k, v] of Object.entries(tier.stats || {}))
      if (p.stats[k] !== undefined) p.stats[k] = v;
    p.stats.form = tier.form - 1;
    p.stats.injury_resistance = tier.injury_resistance - 1;
    p.stats.weak_foot_usage = tier.weak_foot.usage - 1;
    p.stats.weak_foot_accuracy = tier.weak_foot.accuracy - 1;
    const lead = p.name.match(/^\x11c[0-9a-fA-F]{8}/);
    const colors = new Set(RULESETS[D.ruleset].tiers.map(t => t.name_color).filter(Boolean));
    if (tier.name_color)
      p.name = "\x11c" + tier.name_color + (lead ? p.name.slice(lead[0].length) : p.name);
    else if (lead && colors.has(lead[0].slice(2)))
      p.name = p.name.slice(lead[0].length);
  });
}
function setAllStats(p, n) {
  edit("Set stats " + n, () => {
    for (const s of ABILITY_STATS) if (p.stats[s] !== undefined) p.stats[s] = n;

}

function set(p, get, put, v, label) {
  if (get(p) === v) return;
  edit(label || "edit", () => put(p, v));
}
// Drag to reorder (SE-GUI-08): moving a list row reorders the team's roster;
// the ids follow the player, the roster's stored order changes.
function movePlayer(team, fromSlot, toSlot) {
  if (fromSlot === toSlot) return;
  edit("Reorder", () => {
    const arr = team.players;
    const i = arr.findIndex(p => p.slot === fromSlot);
    const j = arr.findIndex(p => p.slot === toSlot);
    const [m] = arr.splice(i, 1);
    arr.splice(j, 0, m);
  });
  S.sel = { team: team.id, slot: fromSlot };
}

// ---- Full Player Customization (spec/libs/fpc.md; SE-GUI-11) ----
// The hide/unhide presets' fields (fpc::preset): the nonexistent ids are the
// suite-common setting's 4cc convention (55/11). SkinColor::Preset resets a
// skin of 7 to 1 and leaves any other (ops/fpc.rs::apply).
const FPC_HIDE = { sleeves: "long", untucked: false, socks: "short", boots_id: 55, gloves_id: 11 };
const FPC_UNHIDE = { sleeves: "short", untucked: true, socks: "standard", boots_id: 0, gloves_id: 0 };
// The save-side classifier (ops/fpc.rs::is_fpc_player): the convention's
// nonexistent boots id, or a custom skin.
const isFpc = p => p.boots_id === 55 || p.appearance.skin_color === 7;
function applyPreset(p, pre) {
  const st = p.appearance.strip;
  st.sleeves = pre.sleeves; st.untucked = pre.untucked; st.socks = pre.socks;
  p.boots_id = pre.boots_id; p.gloves_id = pre.gloves_id;
  if (p.appearance.skin_color === 7) p.appearance.skin_color = 1;
}
function fpcToggle(p) {
  edit("Toggle FPC", () => applyPreset(p, isFpc(p) ? FPC_UNHIDE : FPC_HIDE));
}
// The interference rules' findings for `p` (fpc::check's fixed order).
// sample wording: the findings' texts.
function fpcFindings(p) {
  const st = p.appearance.strip, fpc = isFpc(p), out = [];
  if (st.inners !== "off" && fpc) out.push(["err", "Inners break hiding"]);
  if (st.undershorts !== "off" && fpc) out.push(["err", "Undershorts break hiding"]);
  if ((st.wrist_taping !== "off" || st.ankle_taping) && fpc)
    out.push(["", "Taping shows pieces"]);
  if (st.gloves && p.gloves_id === 0)
    out.push(["warn", "Player gloves with ID 0 wear winter gloves in winter"]);
  if (p.appearance.skin_color === 7 && !fpc)
    out.push(["warn", "Custom skin on a non-FPC player hides the body but not the jersey"]);
  return out;
}

// Output rosters to TSV (SE-GUI-27): the roster_data_output format, per team
// its name alone, then number, name (raw, colour codes kept), short position,
// the Finishing stat, (C) on the roster's captain slot, height, playing style
// and every skill and COM style, a blank line after each team. The label
// spellings are the original's tables. S.lastTsv is the harness's text.
const TSV_SKILLS = ["Scissors Feint", "Flip Flap", "Marseille Turn", "Sombrero",
  "Cut Behind & Turn", "Scotch Move", "Heading", "Long Range Drive", "Knuckle Shot",
  "Acro Finishing", "Heel Trick", "First Time Shot", "One Touch Pass", "Weighted Pass",
  "Pinpoint Crossing", "Outside Curler", "Rabona", "Low Lofted Pass",
  "Low Punt Trajectory", "Long Throw", "GK Long Throw", "Malicia", "Man Marking",
  "Track Back", "Acro Clear", "Captaincy", "Super Sub", "Fighting Spirit",
  "Double Touch", "Crossover Turn", "Step on Skill", "Chip Shot", "Dipping Shots",
  "Rising Shots", "No Look Pass", "GK High Punt Trajectory", "Penalty Specialist",
  "GK Penalty Specialist", "Interception", "Long Range Shooting", "Through Passing"];
const TSV_COM = ["Trickster", "Mazing Runner", "Speeding Bullet", "Incisive Run",
  "Long Ball Expert", "Early Cross", "Long Ranger"];
const TSV_STYLE = { none: "None", goal_poacher: "Goal Poacher",
  dummy_runner: "Dummy Runner", fox_in_the_box: "Fox in the Box",
  target_man: "Target Man", creative_playmaker: "Creative Playmaker",
  prolific_winger: "Prolific Winger", roaming_flank: "Roaming Flank",
  crossing_specialist: "Crossing Specialist", classic_no_10: "Classic No. 10",
  hole_player: "Hole Player", box_to_box: "Box to Box",
  the_destroyer: "The Destroyer", orchestrator: "Orchestrator",
  anchor_man: "Anchor Man", offensive_fullback: "Offensive Fullback",
  fullback_finisher: "Fullback Finisher",
  defensive_fullback: "Defensive Fullback", build_up: "Build Up",
  extra_frontman: "Extra Frontman", offensive_goalkeeper: "Offensive Goalkeeper",
  defensive_goalkeeper: "Defensive Goalkeeper" };
function rosterTsv() {
  const lines = [];
  for (const t of curSave().teams) {
    lines.push(t.name);
    for (const p of t.players) {
      const skills = p.skills.slice()
        .sort((a, b) => SKILLS.indexOf(a) - SKILLS.indexOf(b))
        .map(s => TSV_SKILLS[SKILLS.indexOf(s)]);
      const coms = p.com_styles.slice()
        .sort((a, b) => COM_STYLES.indexOf(a) - COM_STYLES.indexOf(b))
        .map(s => TSV_COM[COM_STYLES.indexOf(s)]);
      lines.push([p.number, p.name, p.positions.registered, p.stats.finishing,
        p.slot - 1 === t.captain ? "(C)" : "", p.height,
        TSV_STYLE[p.positions.playing_style] || p.positions.playing_style,
        ...skills, ...coms].join("\t"));
    }
    lines.push("");
  }
  return lines.join("\n");
}

// Fix database behind a confirmation dialog; Cancel changes nothing
// (SE-GUI-27). The original's resets, field by field: a base copy with no
// flag loses its copy id, a flag with no real target loses the flag, the four
// visual flags clear on every player, the team's strip flag clears, the kit
// slots return to their defaults (Kit 1, Kit 2, GK bound to team id x64; the
// rest to the nonexistent id 0xFFFFC0). The PES 17 repair writes the
// container's Unknown section, which the model does not carry.
function fixDatabase() {
  edit("Fix database", () => {
    for (const t of curSave().teams) {
      for (const p of t.players) {
        const ef = p.edit_flags;
        if (!ef.base_copy && p.base_copy_id !== p.id && p.base_copy_id !== 0)
          p.base_copy_id = 0;
        else if (ef.base_copy && (p.base_copy_id === p.id || p.base_copy_id === 0))
          ef.base_copy = false;
        for (const k of ["face", "hair", "physique", "strip"]) ef[k] = false;
      }
      if (t.edit_flags) t.edit_flags.strip = false;
      if (t.kit_slots) {
        t.kit_slots[0] = { number: 0, binding: t.id * 64 };
        t.kit_slots[1] = { number: 1, binding: t.id * 64 };
        t.kit_slots[2] = { number: 128, binding: t.id * 64 };
        for (let i = 3; i < 10; i++)
          t.kit_slots[i] = { number: 0, binding: 16777152 };
      }
    }
  });
}

// ---- Master: team selector, the cross-team filter, the player list ----
// SE-GUI-01/02/08. The filter matches on the colour-code-free display name,
// the shirt name or the id, across all teams whatever the selector shows.
function matches(p, q) {
  q = q.trim().toLowerCase();

// Version-gated controls render disabled with a "PES NN+" tooltip naming the
// first version that has them, in the same place (a disabled widget shows no

  widget.querySelectorAll("input, select, button, .sel").forEach(w => {

  return h("span", { class: "gate", title: "PES " + minV + "+" }, widget);

    h("div", { class: "row" }, "Iris ",

  // The per-player FPC toggle (also Ctrl+I) and the interference findings of
  // fpc::check, fixed order. Disabled with the rest of the tab under the lock.
  const findings = fpcFindings(p);
  const fpcGroup = h("div", { class: "group", title: en ? null : ownershipTip() },
    strong("Full Player Customization"),
    h("div", { class: "row" },
      h("label", { class: "cb" },

  return h("div", {}, ...lines, body);

// ---- Team (SE-GUI-10) ----
// The save stores 6 bits per channel: a picked channel c is stored c*63/255
// rounded, a stored v is shown v*255/63 rounded (the view/ bullet's rule), so

const chanToSave = c => Math.round(c * 63 / 255);
const chanToShow = v => Math.round(v * 255 / 63);
const shownHex = rgb => "#" + rgb.map(v => chanToShow(v).toString(16).padStart(2, "0")).join("");

  const num = (label, key, minV) => h("td", {}, gated(h("span", {}, label + " ",

          h("td", {}, "Bound team id ", h("input", { type: "number", style: "width:96px", value: ks.binding,
            onchange: e => { const v = parseInt(e.target.value, 10);

      h("tr", {}, num("Manager ID", "manager_id", 19), num("Stadium ID", "stadium_id", 19))),
    h("div", { class: "sep" }),

    kits ? kits
      : h("span", { class: "gate", title: "PES 17 only" },

// ---- Tactics (SE-GUI-12, 25) ----
// The tab of "Tactics editor" in save_editor.md: the pitch is the editor
// (drag a marker to move it, click for the slot's detail popover), the XI
// and the bench are drag lists, roles are assigned by clicking pitch players,
// and the two small menus carry the preset/formation copies and swaps.
// Man marking rides in the data but is not drawn, as in the original (its
// codec comment calls those bytes useless for a save).
const tacPreset = t => t.tactics.presets[S.tac.preset];
const tacFormation = t => tacPreset(t).formations[S.tac.formation];
const rosterPlayer = (t, idx) => t.players.find(p => p.slot === idx + 1) || null;
const playerName = p => p ? displayName(p.name) : "(empty)";
function copyPreset(t, a, b) {
  edit("Copy preset " + (a + 1) + " to " + (b + 1), () => {
    t.tactics.presets[b] = clone(t.tactics.presets[a]); });
}
function swapPreset(t, a, b) {
  edit("Swap presets " + (a + 1) + " and " + (b + 1), () => {
    const p = t.tactics.presets, tmp = p[a]; p[a] = p[b]; p[b] = tmp; });
}
function copyFormation(t, a, b) {
  edit("Copy formation " + FORMATIONS[a] + " to " + FORMATIONS[b], () => {
    tacPreset(t).formations[b] = clone(tacPreset(t).formations[a]); });
}
function swapFormation(t, a, b) {
  edit("Swap formations " + FORMATIONS[a] + " and " + FORMATIONS[b], () => {
    const f = tacPreset(t).formations, tmp = f[a]; f[a] = f[b]; f[b] = tmp; });
}
// The lineup swap (SE-GUI-12): the two roster indices exchange, and every
// set-piece taker, join-attack slot and instruction target naming the
// outgoing player repoints to the incoming one (the role stays on the pitch).
// The captain is not repointed, matching the original.
function swapLineup(t, fieldIdx, benchIdx) {
  edit("Swap lineup", () => {
    const tac = t.tactics;
    const out = tac.starting_eleven[fieldIdx], inn = tac.bench_order[benchIdx];
    tac.starting_eleven[fieldIdx] = inn;
    tac.bench_order[benchIdx] = out;
    for (const k of ["free_kick_long", "free_kick_short", "free_kick_second",
        "corner_left", "corner_right", "penalty"])
      if (tac.set_pieces[k] === out) tac.set_pieces[k] = inn;
    for (const i of [0, 1, 2])
      if (tac.players_to_join_attack[i] === out) tac.players_to_join_attack[i] = inn;
    for (const p of tac.presets) if (p.instructions)
      for (const side of ["attack", "defence"])
        for (const ins of p.instructions[side])
          if (ins.player === out) ins.player = inn;
  });
}
// A drag between XI rows swaps the two slots' assigned players; a drag
// between bench rows moves the entry (the roster's bench order).
function swapStarters(t, i, j) {
  if (i === j) return;
  edit("Reorder lineup", () => {
    const s = t.tactics.starting_eleven, tmp = s[i]; s[i] = s[j]; s[j] = tmp; });
}
function moveBench(t, i, j) {
  if (i === j) return;
  edit("Reorder bench", () => {
    const b = t.tactics.bench_order, [m] = b.splice(i, 1); b.splice(j, 0, m); });
}
// Make GK: the picked player's roster index takes the GK formation slot, the
// keeper takes his (the formation slots keep their positions and coords; the
// game forces the GK's spot itself).
function makeGk(t, i) {
  edit("Make GK", () => {
    const f = tacFormation(t).players;
    const gk = f.findIndex(s => s.position === "GK");
    if (gk < 0 || gk === i) return;
    const s = t.tactics.starting_eleven, tmp = s[gk]; s[gk] = s[i]; s[i] = tmp;
  });
}
// A pitch click during an armed assignment mode writes the mode's field;
// the role modes (a taker, the captain) exit on assignment, the join-attack
// mode toggles members until Done.
function assignClick(t, fieldIdx) {
  const a = S.assign, tac = t.tactics;
  const roster = tac.starting_eleven[fieldIdx];
  if (!a) return false;
  if (a.kind === "join") {
    const at = tac.players_to_join_attack.indexOf(roster);
    const free = tac.players_to_join_attack.indexOf(255);
    if (at >= 0 || free >= 0) edit("Players to join attack", () => {
      if (at >= 0) tac.players_to_join_attack[at] = 255;
      else tac.players_to_join_attack[free] = roster;
    });
    render();
    return true;
  }
  const cur = a.kind === "captain" ? t.captain : tac.set_pieces[a.key];
  if (cur !== roster) edit("Assign " + a.label, () => {
    if (a.kind === "captain") t.captain = roster;
    else tac.set_pieces[a.key] = roster;
  });
  S.assign = null;
  render();
  return true;
}

// ---- The pitch (the egui Painter) ----
// One canvas painted per frame: the touchlines and the eleven markers. A
// marker is a chip with the slot's position label over the starter's name.
// The drag state lives in S.pitchDrag; marker hit tests are ui.interact rects.
function markerRect(t, i) {
  const s = tacFormation(t).players[i];
  return { x: pitchX(s.x) - 21, y: pitchY(s.y) - 16, w: 42, h: 26 };
}
function hitMarker(t, px, py) {
  for (let i = 10; i >= 0; i--) {
    const r = markerRect(t, i);
    if (px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h) return i;
  }
  return -1;
}
function drawPitch(t) {
  const cv = document.getElementById("pitch");
  if (!cv) return;
  const g = cv.getContext("2d"), d = S.pitchDrag;
  const L = PITCH.ox, T = PITCH.oy, W = PITCH.xu * PITCH.px, H = PITCH.yu * PITCH.py;
  g.fillStyle = "#173517"; g.fillRect(0, 0, cv.width, cv.height);
  g.strokeStyle = "#4a7a4a"; g.lineWidth = 1;
  g.strokeRect(L, T, W, H);                       // touchlines
  g.beginPath(); g.moveTo(L, T + H / 2); g.lineTo(L + W, T + H / 2); g.stroke();
  g.beginPath(); g.arc(L + W / 2, T + H / 2, 30, 0, 7); g.stroke();
  for (const top of [true, false]) {              // the two boxes
    const by = top ? T : T + H - 52;
    g.strokeRect(L + (W - 160) / 2, by, 160, 52);
    g.strokeRect(L + (W - 76) / 2, top ? T : T + H - 18, 76, 18);
  }
  const f = tacFormation(t).players, tac = t.tactics;
  const joined = tac.players_to_join_attack;
  g.textAlign = "center";
  for (let i = 0; i < 11; i++) {
    const s = f[i], p = rosterPlayer(t, tac.starting_eleven[i]);
    let cx = pitchX(s.x), cy = pitchY(s.y);
    const dragged = d && d.i === i && d.moved;
    if (dragged) { cx = d.px; cy = d.py; }
    const x = Math.min(PITCH.w - 44, Math.max(2, cx - 21));
    const y = Math.min(PITCH.h - 30, Math.max(2, cy - 16));
    g.fillStyle = S.assign && S.assign.kind === "join" && joined.includes(tac.starting_eleven[i])
      ? "#005c80" : s.position === "GK" ? "#5a4a1e" : "#3c3c3c";
    g.strokeStyle = S.assign ? "#c0deff" : "#6e6e6e";
    if (S.slotPop && S.slotPop.i === i) g.strokeStyle = "#ff8f00";
    g.beginPath(); g.roundRect(x, y, 42, 26, 3); g.fill(); g.stroke();
    g.fillStyle = "#dcdcdc"; g.font = "10px sans-serif";
    g.fillText(s.position, x + 21, y + 11);
    g.fillStyle = "#8c8c8c"; g.font = "9px sans-serif";
    g.fillText(p ? displayName(p.name).slice(0, 8) : "(empty)", x + 21, y + 22);
  }
}
function pitchCanvas(t) {
  const cv = h("canvas", { class: "pitch", id: "pitch",
    width: PITCH.w, height: PITCH.h });
  cv.addEventListener("pointerdown", e => {
    const r = cv.getBoundingClientRect();
    const px = e.clientX - r.left, py = e.clientY - r.top;
    const i = hitMarker(t, px, py);
    if (i < 0) return;
    e.preventDefault();
    S.pitchDrag = { i, px, py, x0: px, y0: py, moved: false };
  });
  // A bench row dropped on the pitch: onto a marker swaps the two roster
  // spots; an XI row swaps the two starters; onto grass does nothing.
  cv.addEventListener("dragover", e => e.preventDefault());
  cv.addEventListener("drop", e => {
    e.preventDefault();
    const m = e.dataTransfer.getData("text/plain").match(/^(bench|xi):(\d+)$/);
    if (!m) return;
    const r = cv.getBoundingClientRect();
    const i = hitMarker(t, e.clientX - r.left, e.clientY - r.top);
    if (i < 0) return;
    if (m[1] === "bench") swapLineup(t, i, Number(m[2]));
    else swapStarters(t, Number(m[2]), i);
    render();
  });
  return cv;
}
// The drag continues off-canvas, so move/up are document-level: a release
// over the pitch moves (snapped to the stored unit grid, one undoable edit),
// a release over a bench row swaps, a click opens the slot popover or serves
// the armed assignment mode.
document.addEventListener("pointermove", e => {
  const d = S.pitchDrag; if (!d) return;
  const cv = document.getElementById("pitch"); if (!cv) return;
  const r = cv.getBoundingClientRect();
  d.px = e.clientX - r.left; d.py = e.clientY - r.top;
  if (Math.abs(d.px - d.x0) + Math.abs(d.py - d.y0) > 4) d.moved = true;
  drawPitch(teamOf(curPlayer()));
});
document.addEventListener("pointerup", e => {
  const d = S.pitchDrag; if (!d) return;
  S.pitchDrag = null;
  const t = teamOf(curPlayer());
  if (!d.moved) {
    if (!assignClick(t, d.i)) { S.slotPop = { i: d.i }; render(); }
    return;
  }
  const el = document.elementFromPoint(e.clientX, e.clientY);
  const lrow = el && el.closest(".lrow");
  if (lrow && lrow.dataset.bidx !== undefined) {
    swapLineup(t, d.i, Number(lrow.dataset.bidx)); render(); return;
  }
  if (lrow && lrow.dataset.xidx !== undefined) {
    swapStarters(t, d.i, Number(lrow.dataset.xidx)); render(); return;
  }
  const cv = document.getElementById("pitch"), r = cv.getBoundingClientRect();
  const [x, y] = snapXY(e.clientX - r.left, e.clientY - r.top);
  edit("Move on pitch", () => {
    const s = tacFormation(t).players[d.i]; s.x = x; s.y = y; });
  render();
});

// The starting eleven and the bench, reorderable drag lists (SE-GUI-12):
// an XI row's data is xi:<slot index>, a bench row's bench:<index>. Drops:
// xi on xi swaps the slots' players, xi on bench swaps them back, bench on
// xi or on a pitch marker swaps in, bench on bench reorders.
function listRowDrag(row, data) {
  row.draggable = true;
  row.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", data);
    e.dataTransfer.effectAllowed = "move";
  });
}
function rowDrop(row, apply) {
  row.addEventListener("dragover", e => { e.preventDefault(); row.classList.add("dragover"); });
  row.addEventListener("dragleave", () => row.classList.remove("dragover"));
  row.addEventListener("drop", e => {
    e.preventDefault(); row.classList.remove("dragover");
    const m = e.dataTransfer.getData("text/plain").match(/^(xi|bench):(\d+)$/);
    if (m) { apply(m[1], Number(m[2])); render(); }
  });
}
function lineupList(t) {
  const tac = t.tactics, f = tacFormation(t).players;
  const box = h("div", { class: "llist", id: "xi-list" });
  for (let i = 0; i < 11; i++) {
    const p = rosterPlayer(t, tac.starting_eleven[i]);
    const r = h("div", { class: "lrow", "data-xidx": i },
      h("span", { class: "handle" }, "≡"),
      h("span", { class: "fpos" }, f[i].position),
      h("span", {}, ...(p ? nameSpans(p.name) : ["(empty)"])));
    listRowDrag(r, "xi:" + i);
    rowDrop(r, (kind, j) => kind === "bench" ? swapLineup(t, i, j) : swapStarters(t, j, i));
    box.append(r);
  }
  return box;
}
function benchList(t) {
  const tac = t.tactics;
  const box = h("div", { class: "llist", id: "bench-list" });
  tac.bench_order.forEach((idx, i) => {
    const p = rosterPlayer(t, idx);
    const r = h("div", { class: "lrow" + (p ? "" : " empty"), "data-bidx": i },
      h("span", { class: "handle" }, "≡"),
      h("span", { class: "fpos" }, p ? p.positions.registered : "--"),
      h("span", {}, ...(p ? nameSpans(p.name) : ["(empty)"])));
    listRowDrag(r, "bench:" + i);
    rowDrop(r, (kind, j) => kind === "xi" ? swapLineup(t, j, i) : moveBench(t, j, i));
    box.append(r);
  });
  return box;
}

// The slot detail popover (the original's Player Controls group): position
// dropdown (the twelve outfield positions; GK only by "Make GK", which swaps

function slotPopover(t) {

// sample wording: the tab's labels, the menus' entries, the assignment

  const joinChip = h("button", { class: "rolechip" + (S.assign && S.assign.kind === "join" ? " armed" : ""),
      id: "role-join", title: "Click, then up to three pitch players",
      onclick: () => { S.assign = S.assign && S.assign.kind === "join" ? null
        : { kind: "join", label: "the attack" }; S.slotPop = null; render(); } },
    "Join attack: " + tac.players_to_join_attack.map(idx => playerName(rosterPlayer(t, idx)).split(" ")[0]).join(", "));
  const slider = (key, label, max) => h("td", {}, label + " ",
    h("input", { type: "range", min: 1, max, value: pre.sliders[key],
      onchange: e => { const v = parseInt(e.target.value, 10);
        edit(label, () => { pre.sliders[key] = v; }); render(); } }),
    " ", h("span", { class: "mono weak" }, String(pre.sliders[key])));
  const toggle = (key, label, off, on) => h("td", {}, label + " ",
    h("span", { class: "rate" }, [off, on].map(v =>
      h("span", { class: "sel" + (pre.style[key] === v ? " on" : ""),
        onclick: () => { if (pre.style[key] !== v) { edit(label, () => { pre.style[key] = v; }); render(); } },
        title: v }, titleCase(v)))));
  const ins = instructionsFor(version());
  const instrRow = (label, entries, i) => {
    const e = entries[i];
    const targetable = takesTarget(e.instruction);
    const pick = combo([["255", "Unassigned"]].concat(
        tac.starting_eleven.map((idx, si) => [String(idx), (si + 1) + " " + playerName(rosterPlayer(t, idx))])),
      e.player === 255 ? "255" : String(e.player), v => {
        edit(label + " target", () => { e.player = Number(v); }); render(); });
    if (!targetable) pick.disabled = true;
    return h("tr", {}, h("td", {}, label),
      h("td", {}, combo(ins.map(x => [x, INSTRUCTION_LABEL[x] || titleCase(x)]),
        e.instruction, v => { edit(label, () => {
          e.instruction = v; if (!takesTarget(v)) e.player = 255; }); render(); })),
      h("td", {}, pick));
  };
  const instrTable = version() >= 17
    ? h("table", { class: "grid", id: "instr-table" },
        h("tr", {}, h("th", {}, ""), h("th", {}, "Instruction"), h("th", {}, "Target")),
        instrRow("Attack 1", pre.instructions.attack, 0),
        instrRow("Attack 2", pre.instructions.attack, 1),
        instrRow("Defence 1", pre.instructions.defence, 0),
        instrRow("Defence 2", pre.instructions.defence, 1))
    : null;
  const auto = tac.auto;
  const autoCb = (key, label, minV) => {
    const w = h("label", { class: "cb" },
      h("input", { type: "checkbox", checked: !!auto[key],
        onchange: e => { edit(label, () => { auto[key] = e.target.checked; }); render(); } }),
      " " + label);
    return minV ? h("span", { class: "row" }, gated(w, minV)) : w;
  };
  const fluid = gated(h("label", { class: "cb" },
    h("input", { type: "checkbox", checked: !!pre.style.fluid, id: "fluid",
      onchange: e => { edit("Fluid formation", () => { pre.style.fluid = e.target.checked; }); render(); } }),
    " Fluid formation"), 16);
  const pitchWrap = h("div", { style: "position:relative" }, pitchCanvas(t), slotPopover(t));
  const frame = h("div", {},
    h("div", { class: "tacbar" }, presetSel, presetMenu, formationMenu),
    note,
    h("div", { class: "taccols" },
      h("div", {}, formationSel, pitchWrap),
      h("div", { class: "lcol" },
        strong("Starting eleven"), lineupList(t),
        strong("Bench"), benchList(t))),
    h("div", { class: "group" }, strong("Formation settings"),
      h("div", { class: "row" }, fluid),
      h("table", { class: "grid" },
        h("tr", {}, SLIDERS.map(([k, l, m]) => slider(k, l, m))),
        h("tr", {}, STYLE_TOGGLES.slice(0, 4).map(([k, l, o, n]) => toggle(k, l, o, n))),
        h("tr", {}, STYLE_TOGGLES.slice(4).map(([k, l, o, n]) => toggle(k, l, o, n))))),
    h("div", { class: "group" }, strong("Advanced instructions"),
      gated(instrTable || weak("(none on this version)"), 17)),
    h("div", { class: "group" }, strong("Player assignments"),
      h("div", { class: "row" }, SET_PIECES.map(([k, l]) => roleChip(k, l)), joinChip)),
    h("div", { class: "group" }, strong("Automatic settings"),
      h("div", { class: "row" },
        h("span", {}, "Substitution ",
          h("input", { type: "number", min: 0, max: 255, value: auto.substitution ?? 0,
            title: "The stored setting byte",
            onchange: e => { const v = parseInt(e.target.value, 10);
              if (!Number.isNaN(v)) { edit("Auto substitution", () => { auto.substitution = v; }); render(); } } })),
        autoCb("offside_trap", "Offside trap"),
        autoCb("preset_change", "Preset change"),
        autoCb("attack_defence_levels", "Attack/defence levels", 17))));
  // The canvas paints after insertion (its element must be in the DOM);
  // the team is looked up then, an undo in between would paint stale data.
  setTimeout(() => drawPitch(teamOf(curPlayer())), 0);
  return frame;
}

openSave(D.sample); // the draft control's open save
render();
</script>
</body>
</html>
