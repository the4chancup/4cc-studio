<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>4cc Studio: Save editor (draft)</title>
<!--
  A draft of the Save editor's GUI (docs/plans/save_editor.md "Editing UI"),
  slices 1-4 of the build order (open/save, the player list, the info strip and
  quick actions, the Abilities & Skills, Appearance, Team and Tactics tabs,
  the Comparator / transplant / AATF / aesthetics-patch panels),
  drawn only with what egui can draw (docs/plans/core/gui.md "Prototypes before
  implementation"). Its behaviour is faked with sample data transcribed from
  real saves and real CLI runs; nothing is written, nothing reads the real
  libs. The sidebar is
  static (the shell is shell.html's draft); its PES selector's value is one of
  the draft controls' GIVENs.
  The four panels live as floating windows (.panel = egui::Window over the
  central panel, non-modal, so a member fixes players while the results stay
  open), opened from the toolbar's Panels menu; the AATF panel is also one
  click from a player through the quick-actions row, since a member fixes one
  player at a time. The tabs stay 1:1 with 4ccEditor's, so the panels could
  not be tabs; the plan's view/panels/ are windows, not modal dialogs.
  Widget mapping: <select> = ComboBox, <input type=text> = TextEdit,
  <input type=number> = DragValue, <input type=checkbox> = CheckBox,
  <input type=range> = Slider, .sel = SelectableLabel, .menu = menu_button,
  details = CollapsingHeader, table.grid = Grid, .window in .modal-bg =
  egui's Modal, .tabrow .sel = the tab bar (selectable labels), a .swatch row =
  a palette-index choice (framed widgets, never a colour picker), title="" =
  on_hover_text (on_disabled_hover_text on the span around a disabled
  control), row drag = Sense::drag, .sidebar = Panel::left, .bottom =
  Panel::bottom, .center = CentralPanel.
  The Tactics tab's pitch: the <canvas> is the egui Painter (the frame and
  every marker are drawn there; marker hit tests are ui.interact on each
  marker's rect, drag Sense::drag); .tpopover = egui::popup (area below the
  marker); the .lrow lists = the starting-eleven and bench lists (Sense::drag
  rows, a drop on a pitch marker swaps); a role chip (.rolechip) = a button
  that arms an assignment mode; .badge = a small framed label
  (remaining-count badges of the card pickers, red over the limit).
  The panels: .panel = egui::Window (non-modal, closed by its button or a
  panel switch); .drow = a diff/violation row (a selectable label); the
  comparator's scope toggles and team filter = selectable labels and a
  ComboBox; the transplant's two panes = two scroll areas of selectable
  rows; the AATF team multi-select = a scroll area of CheckBoxes; Export,
  Apply, Validate rules and Save a copy = buttons; radio labels = RadioButton.
-->
<style>
  :root {
    --panel: #1b1b1b; --extreme: #0a0a0a; --faint: #202020; --widget: #3c3c3c;
    --hover: #464646; --active: #373737; --stroke: #3c3c3c; --text: #8c8c8c;

    --warn: #ff8f00; --error: #ff0000; --changed: #2a3a1e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {

  }
  .top, .bottom { background: var(--panel); padding: 3px 8px; display: flex; gap: 8px; align-items: center; }

  .bottom { border-top: 1px solid var(--stroke); min-height: 26px; height: 24px; padding-top: 0; padding-bottom: 0; overflow: hidden; }

  .main { flex: 1; display: flex; min-height: 0; }
  .rail { width: 150px; border-right: 1px solid var(--stroke); padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .center { flex: 1; overflow: auto; padding: 8px 12px 40px; min-width: 0; }
  .row { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin: 3px 0; }
  .col { display: flex; flex-direction: column; gap: 3px; }
  h2 { font: 400 15px "Ubuntu", "Segoe UI", sans-serif; color: var(--strong); margin: 4px 0 8px; }
  .strong { color: var(--strong); }
  .weak { color: #6e6e6e; }
  .warn { color: var(--warn); }
  .err { color: var(--error); }
  .mono { font-family: "Hack", "Consolas", monospace; font-size: 12px; }
  button, select, input { font: inherit; color: #b4b4b4; }
  button { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 6px; cursor: default; }
  button:hover:not(:disabled) { background: var(--hover); color: #f0f0f0; }
  button:active:not(:disabled) { background: var(--active); }
  button:disabled { color: #5a5a5a; }
  button.frame0 { background: transparent; }
  button.frame0:hover:not(:disabled) { background: var(--hover); }
  select { background: var(--widget); border: 0; border-radius: 2px; padding: 1px 2px; }
  input[type=text], input[type=number] { background: var(--extreme); border: 1px solid var(--stroke); border-radius: 2px; padding: 1px 4px; }
  input[type=number] { width: 52px; background: var(--widget); border: 0; text-align: center; }

  label.cb { display: inline-flex; align-items: center; gap: 4px; }

  .gate { display: inline-block; opacity: .6; }
  input[type=checkbox], input[type=radio] { accent-color: var(--sel-bg); margin: 0; }
  input[type=range] { width: 110px; accent-color: var(--sel-bg); }
  .sel { padding: 1px 5px; border-radius: 2px; cursor: default; user-select: none; }
  .sel:hover { background: var(--hover); color: #f0f0f0; }
  .sel.on { background: var(--sel-bg); color: var(--sel-fg); }
  .rail .sel { padding: 3px 6px; display: flex; justify-content: space-between; }
  table.grid { border-collapse: collapse; }
  table.grid td, table.grid th { padding: 2px 4px; text-align: left; vertical-align: middle; }
  table.grid td > .row, table.grid td > span > .row { flex-wrap: nowrap; }
  table.grid th { font-weight: 400; color: var(--strong); }
  details { margin: 2px 0 4px; }

  details > summary::before { content: "\25B6"; font-size: 9px; display: inline-block; width: 14px; }

  .dragover { outline: 1px solid var(--sel-fg); }
  .menu { position: fixed; background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 4px; z-index: 20; box-shadow: 0 4px 16px #000a; display: flex; flex-direction: column; min-width: 160px; }
  .menu button { text-align: left; background: transparent; padding: 2px 8px; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .modal-bg { position: fixed; inset: 0; background: #0008; display: flex; align-items: center; justify-content: center; z-index: 10; }
  .window { background: var(--panel); border: 1px solid var(--stroke); border-radius: 6px; padding: 8px 12px; box-shadow: 0 8px 24px #000c; min-width: 360px; max-width: 640px; }
  .window .title { color: var(--strong); font-size: 14px; margin-bottom: 8px; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 2px; border: 1px solid #000; vertical-align: middle; }
  .chip { background: var(--widget); border-radius: 2px; padding: 0 4px; }
  a { color: var(--link); }
  .small { font-size: 11px; }
  /* draft controls (visibly outside Studio) */
  .draft-controls { border: 1px dashed var(--stroke); margin: 4px 4px 0; padding: 3px 8px;
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    position: relative; z-index: 15; }
  .draft-controls > details { flex-basis: 100%; }
  .draft-controls .dcgroup { margin-left: 6px; }
  .titlebar { background: var(--extreme); border-bottom: 1px solid var(--stroke); padding: 2px 8px; display: flex; gap: 6px; }
  /* save editor view */
  .sidebar .tool { justify-content: flex-start; align-items: center; gap: 6px; border-left: 3px solid transparent; }
  .sidebar .tool.on { border-left-color: var(--sel-fg); }
  .sidebar .tool.planned { color: #6e6e6e; }
  .sidebar .tool.planned:hover { background: none; color: #6e6e6e; }
  .icon { display: inline-block; width: 16px; text-align: center; flex: none; }
  .logo { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; color: var(--sel-fg); font-size: 15px; border-radius: 2px; user-select: none; }
  .sidebar .sep { align-self: stretch; margin: 4px 0; }
  .sidebar .tail { display: flex; gap: 2px; margin-top: auto; }

  .master { display: flex; gap: 12px; align-items: flex-start; }
  .plist { width: 240px; flex: none; display: flex; flex-direction: column; gap: 4px; }
  .plist .rows { background: var(--extreme); border: 1px solid var(--stroke); min-height: 200px; max-height: 460px; overflow: auto; }
  .plist .rows .prow { display: flex; gap: 5px; align-items: center; padding: 1px 4px; white-space: nowrap; }
  .plist .rows .prow:hover { background: var(--hover); }
  .plist .rows .prow.on { background: var(--sel-bg); }
  .plist .num { color: #6e6e6e; width: 20px; text-align: right; flex: none; }
  .plist .pos { width: 28px; flex: none; color: #b4b4b4; }
  .plist .tshort { color: #6e6e6e; flex: none; }
  .plist .dot { color: var(--warn); margin-left: auto; }
  .detail { flex: 1; min-width: 0; }
  .info-grid td { padding: 1px 6px 1px 0; }
  .info-grid input[type=text] { width: 190px; }
  .info-grid input.shirt { width: 110px; }
  .info-grid input[type=number] { width: 46px; }
  .tabrow { display: flex; gap: 2px; border-bottom: 1px solid var(--stroke); margin: 8px 0 6px; }
  .tabrow .sel { border-radius: 2px 2px 0 0; padding: 2px 10px; }
  .stats-grid td { padding: 1px 8px 1px 0; }
  .stats-grid input[type=number] { width: 40px; }
  .posgrid td { padding: 1px 10px 1px 0; }
  .rate { display: inline-flex; gap: 1px; }
  .rate .sel { padding: 0 5px; }
  .rate .sel.on { background: var(--sel-bg); }
  .rate.off .sel { color: #5a5a5a; }
  .rate.off .sel:hover { background: none; color: #5a5a5a; }
  .skillgrid td { padding: 0 12px 0 0; }
  .palette { display: inline-flex; gap: 2px; align-items: center; }
  .palette .swatch.on { outline: 1px solid var(--sel-fg); }
  .palette.off .swatch { opacity: .45; }
  .palette.off .swatch:hover { outline: none; }
  .palette .swatch:hover { outline: 1px solid var(--hover); }
  .palette.off { pointer-events: none; }
  .vbanner { border: 1px solid var(--warn); border-radius: 2px; padding: 3px 8px; margin: 4px 0; }
  /* tactics tab */
  .tacbar { display: flex; gap: 8px; align-items: center; margin: 4px 0; }
  .taccols { display: flex; gap: 14px; align-items: flex-start; }
  .pitch { background: #173517; border: 1px solid var(--stroke); display: block;
    touch-action: none; }
  .lcol { display: flex; flex-direction: column; gap: 6px; min-width: 210px; }
  .llist { background: var(--extreme); border: 1px solid var(--stroke);

  .lrow { display: flex; gap: 5px; align-items: center; padding: 1px 4px;

</head>

<div class="draft-controls" id="draft-controls"></div>
<div class="titlebar" id="titlebar"></div>
<div class="main">
  <div class="rail sidebar" id="sidebar"></div>
  <div class="center" id="center"></div>

<div class="bottom" id="bottom"><span id="status-left"></span><span id="status-middle"></span><span id="status-right"></span></div>

<script>
"use strict";

// ---- Widgets (each one an egui widget); the helpers of shell.html ----
const open = new Set();
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (k === "style") e.style.cssText = v;
    else if (v !== false && v !== null && v !== undefined) e.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat()) if (kid !== null && kid !== undefined && kid !== false)
    e.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  return e;
}
const row = (...kids) => h("div", { class: "row" }, ...kids);
const weak = text => h("span", { class: "weak" }, text);
const strong = text => h("span", { class: "strong" }, text);
function button(text, onclick, opts = {}) {
  return h("button", { onclick, disabled: opts.disabled, title: opts.title, class: opts.frame0 ? "frame0" : "" }, text);
}
function combo(options, value, set, opts = {}) {
  const s = h("select", { title: opts.title, class: opts.cls || "", disabled: opts.disabled,
    onchange: e => { set(e.target.value === "\u0000" ? null : e.target.value); structural(); } },
    options.map(([v, label]) => h("option", { value: v ?? "\u0000", selected: v === value }, label)));
  return s;
}
function selectable(label, on, toggle, title) {
  return h("span", { class: "sel" + (on ? " on" : ""), title, onclick: () => { toggle(); structural(); } }, label);
}
function collapsing(path, title, body, defaultOpen) {
  const isOpen = open.has(path) || (defaultOpen && !open.has("closed:" + path));
  const d = h("details", { open: isOpen, ontoggle: e => {
    if (e.target.open) { open.add(path); open.delete("closed:" + path); }
    else { open.delete(path); open.add("closed:" + path); }
  } }, h("summary", {}, title), h("div", { class: "body" }, isOpen ? body() : null));
  if (!isOpen) d.addEventListener("toggle", () => { if (d.open) render(); }, { once: true });
  return d;
}
function menu(label, items, opts = {}) {
  return h("button", { class: opts.frame0 ? "frame0" : "", title: opts.title, onclick: e => {
    e.stopPropagation();
    closeMenus();
    const r = e.target.getBoundingClientRect();
    const m = h("div", { class: "menu", style: `left:${r.left}px; top:${r.bottom + 2}px` },
      items.map(([text, fn, disabled, title]) => text === "-" ? h("div", { class: "sep", style: "margin:3px 0" })
        : h("button", { disabled, title, onclick: ev => { ev.stopPropagation(); closeMenus(); fn(); } }, text)));
    document.body.append(m);
    const bottom = m.getBoundingClientRect().bottom;
    if (bottom > window.innerHeight) m.style.top = Math.max(4, r.top - m.offsetHeight - 2) + "px";
  } }, label + " ⏷");
}
function closeMenus() { document.querySelectorAll(".menu").forEach(m => m.remove()); }
document.addEventListener("click", closeMenus);
let windowDrawer = null;
function window_(title, body, buttons) {
  windowDrawer = null;
  const ov = document.getElementById("overlay");
  ov.innerHTML = "";
  ov.append(h("div", { class: "modal-bg" }, h("div", { class: "window" },
    h("div", { class: "title" }, title), body, h("div", { class: "row", style: "justify-content:flex-end; margin-top:10px" }, buttons))));
}
function closeWindow() { windowDrawer = null; document.getElementById("overlay").innerHTML = ""; }
function cb(label, checked, set) {
  return h("label", { class: "cb" }, h("input", { type: "checkbox", checked,
    onchange: e => { set(e.target.checked); render(); } }), label);
}
function structural() { render(); }

//__SAMPLE_DATA_BEGIN__
// Real values from the maintainer's saves (the exports under
// .tmp/8_5/pes17_all, pes21_all; extract.py regenerates this block).
const SAVES = {

// ---- The card pickers' remaining-count badges (team_widgets "cards") ----
// The draft's fake of aatf::card_limits (spec/aatf_rules.md "The card
// economy"). Read for each number: the tier's `cards` for the limit, its
// `a_positions` for the A allowance, its `free` groups and the `card_groups`
// they name for covered cards, and the ruleset's free-card specials whose
// `when` is absent or mentions only tiers (tested as the queried tier),
// captain or positions (VTL11's pass skills). Not faked: `choice` effects,
// `cards`/`a_positions`/`free` effects and `when`s on brackets, systems or
// heights (the manlet bonus, the medals' choice), so a badge can read low,
// never high; nor the B-counts-as-A flag for rulesets that lack it.
function cardLimits(p, t, tier) {
  const rs = RULESETS[D.ruleset];
  const freeCards = new Set();
  for (const s of rs.free_specials || []) {
    if (s.tiers && !s.tiers.includes(tier.id)) continue;
    if (s.captain && t.captain !== p.slot - 1) continue;
    if (s.positions && !s.positions.includes(p.positions.registered)) continue;
    freeCards.add(s.card);
  }
  const left = {};
  for (const [g, n] of Object.entries(tier.free || {})) left[g] = n;
  const groupsOf = card =>
    Object.entries(rs.card_groups || {})
      .filter(([, members]) => members.includes(card)).map(([g]) => g)
      .concat(COM_STYLES.includes(card) ? ["com"] : []);
  let paid = 0;
  for (const card of p.skills.concat(p.com_styles)) {
    if (freeCards.has(card)) continue;
    const cover = groupsOf(card).find(g => left[g] > 0);
    if (cover) left[cover] -= 1;
    else paid += 1;
  }
  let a = 0, b = 0;
  for (const r of Object.values(p.positions.playable)) {
    if (r === "A") a += 1; else if (r === "B") b += 1;
  }
  const counted = a + (rs.b_uses_a ? b : 0);
  const limit = tier.cards - Math.max(0, counted - (tier.a_positions || 0));
  return { paid, limit, left: limit - paid };
}
// One badge per tier of the active ruleset: the cards the player can still
// afford under it, the error colour when overdrawn. sample wording: the
// tooltip.
function cardBadges(p, t) {
  return h("span", { class: "row", id: "card-badges",
      title: "Cards left under each tier of the active ruleset (paid cards vs its limit)" },
    weak("Cards left"),
    RULESETS[D.ruleset].tiers.map(tier => {
      const c = cardLimits(p, t, tier);
      return h("span", { class: "badge" + (c.left < 0 ? " over" : ""),
        title: tier.label + ": " + c.paid + " paid of " + c.limit },
        tier.label + " " + c.left);
    }));
}

  status: null,
  // Tactics tab view state: the drawn preset and formation, the open slot
  // popover (a formation index), the armed assignment mode and a live drag.
  tac: { preset: 0, formation: 0 }, slotPop: null, assign: null, pitchDrag: null };
const clone = x => JSON.parse(JSON.stringify(x));
function curSave() { return S.save; }
function curTeam() {
  const s = curSave();
  return s.teams.find(t => String(t.id) === String(S.teamSel)) || s.teams[0];
}
function findPlayer(teamId, slot) {
  const t = curSave().teams.find(t => t.id === teamId);
  return t && t.players.find(p => p.slot === slot);
}
function curPlayer() {
  if (!S.sel) return curTeam().players[0];
  return findPlayer(S.sel.team, S.sel.slot) || curTeam().players[0];
}
const version = () => curSave().version;
const isFox = () => version() >= 19;

// ---- Name colour codes (spec/pes_savefile/model.md "Name colour codes") ----
// \x11c + 8 hex digits (RRGGBBAA) colours the text after it; \x11d resets.
// The name field keeps the raw string; the list and headings render the codes.
const CODE_RE = /\x11c([0-9a-fA-F]{8})|\x11d/g;
function displayName(raw) { return raw.replace(CODE_RE, ""); }
function nameSpans(raw) {
  const kids = []; let color = null, i = 0, m;
  CODE_RE.lastIndex = 0;
  while ((m = CODE_RE.exec(raw))) {
    if (m.index > i) kids.push(color ? h("span", { style: "color:" + color }, raw.slice(i, m.index)) : raw.slice(i, m.index));
    color = m[1] ? "#" + m[1].slice(0, 6) : null;
    i = m.index + m[0].length;
  }
  if (i < raw.length) kids.push(color ? h("span", { style: "color:" + color }, raw.slice(i)) : raw.slice(i));
  return kids;
}
// The text edit shows the raw name with the codes spelled out ("\x11c" reads
// as four characters here; the real field holds the control bytes).
const escName = raw => raw.replaceAll("\x11", "\\x11");
const unescName = t => t.replaceAll("\\x11", "\x11");

// ---- Session operations ----
// openSave loads a sample save; the stripped-id variant is the draft control's
// GIVEN (a Fox save with some appearance ids set, the rest at -1 is SE-GUI-20).
function openSave(key, path) {
  const data = clone(SAVES[key]);
  const ver = data.version;
  if (ver >= 19) {
    for (const t of data.teams) for (const p of t.players) {
      // The real save has every id set; "stripped" and "mixed" fake the cup
      // save's states. In "mixed", three players keep set ids.
      p.appearance_id = D.appearanceIds === "all_set" ? p.id
        : D.appearanceIds === "stripped" ? -1
        : [70101, 70105, 70109].includes(p.id) ? p.id : -1;
    }
  }
  S.save = data;
  S.saveKey = key;
  S.path = path || SAMPLE_PATH[key];
  S.baseline = JSON.stringify(data.teams);
  S.basePlayers = {};
  for (const t of data.teams) for (const p of t.players)
    S.basePlayers[t.id + ":" + p.slot] = JSON.stringify(p);
  // The PES 17 sample opens on /f/ (its colour-coded team), PES 21 on ALL.
  S.teamSel = key === "pes17" ? "718" : "all"; S.filter = ""; S.sel = null;
  S.undo = []; S.redo = []; S.editAnyway = false;
  S.assign = null; S.slotPop = null; S.pitchDrag = null;
  S.panel = null;
  S.cmp = { second: null, refused: null, scope: "all", team: "all" };
  S.trn = { donor: null, refused: null, sel: "718,70201:70201", armed: null, preview: null, applied: false };
  S.aatf = { mode: "current", teams: {}, sugg: false, validate: null, savedCopy: null };
  S.pat = { loaded: false, refused: null, applied: false };
  S.status = null;
  pushRecent(S.path);
  const restored = restoredIds();
  if (restored.length) drawStripAgain(restored);
}
function pushRecent(path) {
  const i = S.recents.indexOf(path);
  if (i >= 0) S.recents.splice(i, 1);
  S.recents.unshift(path);
}
// A player's stripped state: Fox only, from the appearance id.
const isStripped = p => isFox() && p.appearance_id === -1;
// SE-GUI-20: the players whose id is set while others are stripped. A save
// where nobody is stripped is an ordinary unstripped save (no list).
function restoredIds() {
  const all = curSave().teams.flatMap(t => t.players);
  if (!all.some(isStripped)) return [];
  return all.filter(p => p.appearance_id > 0);
}
// Opening another save with unsaved changes prompts first (SE-GUI-05); the
// window-close half of the prompt is the shell's (shell.html).
function requestOpen(key, path) {
  if (dirty()) { drawUnsavedPrompt(() => openSave(key, path)); return; }
  openSave(key, path); render();
}
// Edits: one undo entry is a list of (object-path, before, after) patches plus
// the touched player keys. Reorder pushes a team's slot order, not a field.
function edit(label, fn) {
  const before = snapshot();
  fn();
  S.undo.push({ label, before, after: snapshot() });
  S.redo = [];
}
function snapshot() { return JSON.stringify(S.save.teams); }
function restore(snap) { S.save.teams = JSON.parse(snap); }
// Undo/redo re-render like the real view's frame: the snapshot restore swaps
// the whole teams array, so a widget drawn before it would write into a dead
// object.
function doUndo() {
  const e = S.undo.pop(); if (!e) return;
  const cur = snapshot(); restore(e.before);
  S.redo.push({ label: e.label, before: e.before, after: cur });
  render();
}
function doRedo() {
  const e = S.redo.pop(); if (!e) return;
  const cur = snapshot(); restore(e.after);
  S.undo.push({ label: e.label, before: cur, after: e.after });
  render();
}
// Unsaved changes = the model differs from the opened/last-saved bytes (the
// dot's test too: a player is dirty while his entry differs).
const dirty = () => JSON.stringify(S.save.teams) !== S.baseline;
function dirtyPlayer(p) {
  return S.basePlayers[teamOf(p).id + ":" + p.slot] !== JSON.stringify(p);
}
function teamOf(p) { return curSave().teams.find(t => t.players.includes(p)); }

// ---- Save and Save as (SE-GUI-03, 21, 26) ----
// Refused while the save's own game runs (the CLI's rule: the game writes its
// save back on exit over ours); another version's game does not block it.
// sample wording: the refusal's text and the status lines.
function saveFile() {
  if (D.gameRunning)
    return window_("Save refused", h("div", {},
      h("p", {}, "PES20" + version() + ".exe is running. The game writes its save back when it closes, over this one."),
      h("p", {}, weak("Close the game, then save again."))),
      [button("OK", closeWindow)]);
  writeSave(S.path);
}
function writeSave(path) {
  S.path = path;
  S.baseline = JSON.stringify(S.save.teams);
  S.basePlayers = {};
  for (const t of S.save.teams) for (const p of t.players)
    S.basePlayers[t.id + ":" + p.slot] = JSON.stringify(p);
  S.status = "Saved " + path.split("\\").pop() + " (the replaced file is kept once as " + path.split("\\").pop() + ".bak)";
  pushRecent(path);
}
function saveAs() {
  const input = h("input", { type: "text", style: "width:420px", value: S.path });
  window_("Save as", h("div", {},
    h("p", {}, weak("The native file picker (rfd) opens here; the draft edits the path inline.")),
    input),
    [button("Save", () => { closeWindow(); writeSave(input.value); render(); }),
     button("Cancel", closeWindow)]);
}

// ---- Quick actions (SE-GUI-09) ----
// The fake of aatf::apply_tier: the rating stats go to the tier's rate, its
// stats map overrides them, and form / injury resistance / weak foot take the
// tier's game numbers (stored one lower). name_color rewrites the name's
// leading code; a tier that sets none removes a leading code this ruleset's
// tiers use and keeps any other. One undoable edit.
function applyTier(p, tier) {
  edit("Make " + tier.label, () => {
    for (const s of RATING_STATS)
      if (p.stats[s] !== undefined) p.stats[s] = tier.rate;
    for (const [k, v] of Object.entries(tier.stats || {}))
      if (p.stats[k] !== undefined) p.stats[k] = v;
    p.stats.form = tier.form - 1;
    p.stats.injury_resistance = tier.injury_resistance - 1;
    p.stats.weak_foot_usage = tier.weak_foot.usage - 1;
    p.stats.weak_foot_accuracy = tier.weak_foot.accuracy - 1;
    const lead = p.name.match(/^\x11c[0-9a-fA-F]{8}/);
    const colors = new Set(RULESETS[D.ruleset].tiers.map(t => t.name_color).filter(Boolean));
    if (tier.name_color)
      p.name = "\x11c" + tier.name_color + (lead ? p.name.slice(lead[0].length) : p.name);
    else if (lead && colors.has(lead[0].slice(2)))
      p.name = p.name.slice(lead[0].length);
  });
}
function setAllStats(p, n) {
  edit("Set stats " + n, () => {
    for (const s of ABILITY_STATS) if (p.stats[s] !== undefined) p.stats[s] = n;
  });
}
// A small field write helper: every control's change is one undoable edit.
function set(p, get, put, v, label) {
  if (get(p) === v) return;
  edit(label || "edit", () => put(p, v));
}
// Drag to reorder (SE-GUI-08): moving a list row reorders the team's roster;
// the ids follow the player, the roster's stored order changes.
function movePlayer(team, fromSlot, toSlot) {
  if (fromSlot === toSlot) return;
  edit("Reorder", () => {
    const arr = team.players;
    const i = arr.findIndex(p => p.slot === fromSlot);
    const j = arr.findIndex(p => p.slot === toSlot);
    const [m] = arr.splice(i, 1);
    arr.splice(j, 0, m);
  });
  S.sel = { team: team.id, slot: fromSlot };
}

// The kept shortcuts (Ctrl+S, Ctrl+F, Ctrl+I); the draft binds them on the
// document. Ctrl+F/Ctrl+I are aesthetics writes: no-ops under the lock.

// ---- Full Player Customization (spec/libs/fpc.md; SE-GUI-11) ----
// The hide/unhide presets' fields (fpc::preset): the nonexistent ids are the
// suite-common setting's 4cc convention (55/11). SkinColor::Preset resets a
// skin of 7 to 1 and leaves any other (ops/fpc.rs::apply).
const FPC_HIDE = { sleeves: "long", untucked: false, socks: "short", boots_id: 55, gloves_id: 11 };
const FPC_UNHIDE = { sleeves: "short", untucked: true, socks: "standard", boots_id: 0, gloves_id: 0 };
// The save-side classifier (ops/fpc.rs::is_fpc_player): the convention's
// nonexistent boots id, or a custom skin.
const isFpc = p => p.boots_id === 55 || p.appearance.skin_color === 7;
function applyPreset(p, pre) {
  const st = p.appearance.strip;
  st.sleeves = pre.sleeves; st.untucked = pre.untucked; st.socks = pre.socks;
  p.boots_id = pre.boots_id; p.gloves_id = pre.gloves_id;
  if (p.appearance.skin_color === 7) p.appearance.skin_color = 1;
}
function fpcToggle(p) {
  edit("Toggle FPC", () => applyPreset(p, isFpc(p) ? FPC_UNHIDE : FPC_HIDE));
}
// The interference rules' findings for `p` (fpc::check's fixed order).
// sample wording: the findings' texts.
function fpcFindings(p) {
  const st = p.appearance.strip, fpc = isFpc(p), out = [];
  if (st.inners !== "off" && fpc) out.push(["err", "Inners break hiding"]);
  if (st.undershorts !== "off" && fpc) out.push(["err", "Undershorts break hiding"]);
  if ((st.wrist_taping !== "off" || st.ankle_taping) && fpc)
    out.push(["", "Taping shows pieces"]);
  if (st.gloves && p.gloves_id === 0)
    out.push(["warn", "Player gloves with ID 0 wear winter gloves in winter"]);
  if (p.appearance.skin_color === 7 && !fpc)
    out.push(["warn", "Custom skin on a non-FPC player hides the body but not the jersey"]);
  return out;
}

function dlgCopySwap(p, mode) {
  const opts = [];
  for (const t of curSave().teams) for (const q of t.players)
    opts.push([t.id + ":" + q.slot, t.name + " " + String(q.slot).padStart(2, "0")
      + " " + displayName(q.name)]);
  const pick = combo(opts, null, () => {});

    h("p", {}, (mode === "copy" ? "Copy the stats of " : "Swap the stats of ")
      + displayName(p.name) + " " + (mode === "copy" ? "onto this player" : "with:")),
    pick),
    [button("OK", () => {
      const [tid, slot] = pick.value.split(":").map(Number);
      const other = findPlayer(tid, slot);
      if (!other) return;
      edit(mode === "copy" ? "Copy stats" : "Swap stats", () => {
        if (mode === "copy") p.stats = clone(other.stats);

// its name alone, then number, name (raw, colour codes kept), short position,
// the Finishing stat, (C) on the roster's captain slot, height, playing style
// and every skill and COM style, a blank line after each team. The label
// spellings are the original's tables. S.lastTsv is the harness's text.
const TSV_SKILLS = ["Scissors Feint", "Flip Flap", "Marseille Turn", "Sombrero",
  "Cut Behind & Turn", "Scotch Move", "Heading", "Long Range Drive", "Knuckle Shot",
  "Acro Finishing", "Heel Trick", "First Time Shot", "One Touch Pass", "Weighted Pass",
  "Pinpoint Crossing", "Outside Curler", "Rabona", "Low Lofted Pass",
  "Low Punt Trajectory", "Long Throw", "GK Long Throw", "Malicia", "Man Marking",
  "Track Back", "Acro Clear", "Captaincy", "Super Sub", "Fighting Spirit",
  "Double Touch", "Crossover Turn", "Step on Skill", "Chip Shot", "Dipping Shots",
  "Rising Shots", "No Look Pass", "GK High Punt Trajectory", "Penalty Specialist",
  "GK Penalty Specialist", "Interception", "Long Range Shooting", "Through Passing"];
const TSV_COM = ["Trickster", "Mazing Runner", "Speeding Bullet", "Incisive Run",
  "Long Ball Expert", "Early Cross", "Long Ranger"];
const TSV_STYLE = { none: "None", goal_poacher: "Goal Poacher",
  dummy_runner: "Dummy Runner", fox_in_the_box: "Fox in the Box",
  target_man: "Target Man", creative_playmaker: "Creative Playmaker",
  prolific_winger: "Prolific Winger", roaming_flank: "Roaming Flank",
  crossing_specialist: "Crossing Specialist", classic_no_10: "Classic No. 10",
  hole_player: "Hole Player", box_to_box: "Box to Box",
  the_destroyer: "The Destroyer", orchestrator: "Orchestrator",
  anchor_man: "Anchor Man", offensive_fullback: "Offensive Fullback",
  fullback_finisher: "Fullback Finisher",
  defensive_fullback: "Defensive Fullback", build_up: "Build Up",
  extra_frontman: "Extra Frontman", offensive_goalkeeper: "Offensive Goalkeeper",
  defensive_goalkeeper: "Defensive Goalkeeper" };
function rosterTsv() {
  const lines = [];
  for (const t of curSave().teams) {
    lines.push(t.name);
    for (const p of t.players) {
      const skills = p.skills.slice()
        .sort((a, b) => SKILLS.indexOf(a) - SKILLS.indexOf(b))
        .map(s => TSV_SKILLS[SKILLS.indexOf(s)]);
      const coms = p.com_styles.slice()
        .sort((a, b) => COM_STYLES.indexOf(a) - COM_STYLES.indexOf(b))
        .map(s => TSV_COM[COM_STYLES.indexOf(s)]);
      lines.push([p.number, p.name, p.positions.registered, p.stats.finishing,
        p.slot - 1 === t.captain ? "(C)" : "", p.height,
        TSV_STYLE[p.positions.playing_style] || p.positions.playing_style,
        ...skills, ...coms].join("\t"));
    }
    lines.push("");
  }
  return lines.join("\n");
}

// Fix database behind a confirmation dialog; Cancel changes nothing
// (SE-GUI-27). The original's resets, field by field: a base copy with no
// flag loses its copy id, a flag with no real target loses the flag, the four
// visual flags clear on every player, the team's strip flag clears, the kit
// slots return to their defaults (Kit 1, Kit 2, GK bound to team id x64; the
// rest to the nonexistent id 0xFFFFC0). The PES 17 repair writes the
// container's Unknown section, which the model does not carry.
function fixDatabase() {
  edit("Fix database", () => {
    for (const t of curSave().teams) {
      for (const p of t.players) {
        const ef = p.edit_flags;
        if (!ef.base_copy && p.base_copy_id !== p.id && p.base_copy_id !== 0)
          p.base_copy_id = 0;
        else if (ef.base_copy && (p.base_copy_id === p.id || p.base_copy_id === 0))
          ef.base_copy = false;
        for (const k of ["face", "hair", "physique", "strip"]) ef[k] = false;
      }
      if (t.edit_flags) t.edit_flags.strip = false;
      if (t.kit_slots) {
        t.kit_slots[0] = { number: 0, binding: t.id * 64 };
        t.kit_slots[1] = { number: 1, binding: t.id * 64 };
        t.kit_slots[2] = { number: 128, binding: t.id * 64 };
        for (let i = 3; i < 10; i++)
          t.kit_slots[i] = { number: 0, binding: 16777152 };
      }
    }
  });
}

// ---- Master: team selector, the cross-team filter, the player list ----
// SE-GUI-01/02/08. The filter matches on the colour-code-free display name,
// the shirt name or the id, across all teams whatever the selector shows.
function matches(p, q) {
  q = q.trim().toLowerCase();
  if (!q) return false;
  return displayName(p.name).toLowerCase().includes(q)
      || p.shirt_name.toLowerCase().includes(q)
      || String(p.id).includes(q);
}
function filteredPlayers() {
  return curSave().teams.flatMap(t =>
    t.players.filter(p => matches(p, S.filter)).map(p => ({ team: t, p })));
}
function renderMaster() {
  const box = h("div", { class: "plist" });
  const sel = combo([["all", "ALL"]].concat(curSave().teams.map(t => [String(t.id), t.name])),
    S.teamSel, v => { S.teamSel = v; });
  sel.id = "team-sel";
  // sample wording: the filter's placeholder and the rows' tooltips.
  const filter = h("input", { type: "text", id: "filter-box",
    placeholder: "Filter all teams (name, shirt, id)", value: S.filter,
    oninput: e => { S.filter = e.target.value; renderList(rows); } });
  const rows = h("div", { class: "rows", id: "player-rows" });
  box.append(sel, filter, rows);
  renderList(rows);

}
// One pass over the row container, so typing keeps the input's focus.
function renderList(rows) {
  rows.innerHTML = "";
  const entries = S.filter.trim()
    ? filteredPlayers()
    : (S.teamSel === "all" ? curSave().teams.flatMap(t => t.players.map(p => ({ team: t, p })))
                           : curTeam().players.map(p => ({ team: curTeam(), p })));
  for (const { team, p } of entries) rows.append(playerRow(team, p));

function playerRow(team, p) {
  const r = h("div", { class: "prow" + (S.sel && S.sel.team === team.id && S.sel.slot === p.slot ? " on" : ""),
      draggable: "true", "data-slot": p.slot, "data-team": team.id,
      onclick: () => { S.sel = { team: team.id, slot: p.slot }; render(); } },
    h("span", { class: "handle" }, "≡"),
    h("span", { class: "num" }, String(p.number)),
    h("span", { class: "pos" }, p.positions.registered),
    S.filter.trim() || S.teamSel === "all" ? h("span", { class: "tshort" }, team.name) : null,
    h("span", {}, ...nameSpans(p.name)),
    dirtyPlayer(p) ? h("span", { class: "dot", title: "Unsaved changes" }, "●") : null);
  // Sense::drag: the row moves onto the drop target's slot.
  r.addEventListener("dragstart", e => {
    e.dataTransfer.setData("text/plain", team.id + ":" + p.slot);
    e.dataTransfer.effectAllowed = "move";
  });
  r.addEventListener("dragover", e => { e.preventDefault(); r.classList.add("dragover"); });
  r.addEventListener("dragleave", () => r.classList.remove("dragover"));
  r.addEventListener("drop", e => {
    e.preventDefault(); r.classList.remove("dragover");
    const [tid, slot] = e.dataTransfer.getData("text/plain").split(":");
    if (Number(tid) === team.id) { movePlayer(team, Number(slot), p.slot); render(); }
  });
  return r;
}

// first version that has them, in the same place (a disabled widget shows no
// tooltip, so the hover-sensing span carries it; egui: on_disabled_hover_text).
function gated(widget, minV) {
  const off = version() < minV;
  if (!off) return widget;
  widget.querySelectorAll("input, select, button, .sel").forEach(w => {
    w.disabled = true; w.classList && w.classList.add("off");
  });
  return h("span", { class: "gate", title: "PES " + minV + "+" }, widget);
}

// ---- Team (SE-GUI-10) ----
// The save stores 6 bits per channel: a picked channel c is stored c*63/255
// rounded, a stored v is shown v*255/63 rounded (the view/ bullet's rule), so
// the shown colour is always the nearest the save can hold.
const chanToSave = c => Math.round(c * 63 / 255);
const chanToShow = v => Math.round(v * 255 / 63);
const shownHex = rgb => "#" + rgb.map(v => chanToShow(v).toString(16).padStart(2, "0")).join("");
function teamTab(t) {
  const nameIn = h("input", { type: "text", id: "team-name", value: t.name,
    onchange: e => { edit("team name", () => { t.name = e.target.value; }); render(); } });
  const shortIn = h("input", { type: "text", id: "team-short", class: "shirt", value: t.short_name,
    onchange: e => { edit("team short name", () => { t.short_name = e.target.value; }); render(); } });
  const colour = (key, label) => {
    const shown = shownHex(t[key]);
    const inp = h("input", { type: "color", id: "team-" + key, value: shown,
      title: "Stored " + t[key].join(", ") + ", shown " + shown.toUpperCase(),
      onchange: e => {
        const hex = e.target.value;
        const rgb = [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16))
          .map(chanToSave);
        edit(label, () => { t[key] = rgb; }); render();
      } });
    return h("td", {}, label + " ", inp, " ", h("span", { class: "mono weak" }, shown.toUpperCase()));
  };
  const num = (label, key, minV) => h("td", {}, gated(h("span", {}, label + " ",
    h("input", { type: "number", id: "team-" + key, value: t[key] ?? 0,
      onchange: e => { const v = parseInt(e.target.value, 10);
        if (!Number.isNaN(v)) { edit(label, () => { t[key] = v; }); render(); } } })), minV));
  const kits = t.kit_slots
    ? h("table", { class: "grid" }, t.kit_slots.map((ks, i) =>
        h("tr", {}, h("td", { class: "weak" }, "Slot " + (i + 1)),
          h("td", {}, "Number ", h("input", { type: "number", value: ks.number,
            onchange: e => { const v = parseInt(e.target.value, 10);
              if (!Number.isNaN(v)) { edit("kit slot number", () => { ks.number = v; }); render(); } } })),
          h("td", {}, "Bound team id ", h("input", { type: "number", style: "width:96px", value: ks.binding,
            onchange: e => { const v = parseInt(e.target.value, 10);
              if (!Number.isNaN(v)) { edit("kit slot binding", () => { ks.binding = v; }); render(); } } })))))
    : null;
  return h("div", {},
    h("table", { class: "grid info-grid" },
      h("tr", {}, h("td", {}, "Name ", nameIn), h("td", {}, "Short name ", shortIn)),
      h("tr", {}, colour("color_1", "Colour 1"), colour("color_2", "Colour 2")),
      h("tr", {}, num("Manager ID", "manager_id", 19), num("Stadium ID", "stadium_id", 19))),
    h("div", { class: "sep" }),
    strong("Kit slot assignments"),
    kits ? kits
      : h("span", { class: "gate", title: "PES 17 only" },
          h("div", { class: "row weak" }, "(no kit slot records on this version)")));
}

// ---- Tactics (SE-GUI-12, 25) ----
// The tab of "Tactics editor" in save_editor.md: the pitch is the editor
// (drag a marker to move it, click for the slot's detail popover), the XI
// and the bench are drag lists, roles are assigned by clicking pitch players,
// and the two small menus carry the preset/formation copies and swaps.
// Man marking rides in the data but is not drawn, as in the original (its
// codec comment calls those bytes useless for a save).
const tacPreset = t => t.tactics.presets[S.tac.preset];
const tacFormation = t => tacPreset(t).formations[S.tac.formation];
const rosterPlayer = (t, idx) => t.players.find(p => p.slot === idx + 1) || null;
const playerName = p => p ? displayName(p.name) : "(empty)";
function copyPreset(t, a, b) {
  edit("Copy preset " + (a + 1) + " to " + (b + 1), () => {
    t.tactics.presets[b] = clone(t.tactics.presets[a]); });
}
function swapPreset(t, a, b) {
  edit("Swap presets " + (a + 1) + " and " + (b + 1), () => {
    const p = t.tactics.presets, tmp = p[a]; p[a] = p[b]; p[b] = tmp; });
}
function copyFormation(t, a, b) {
  edit("Copy formation " + FORMATIONS[a] + " to " + FORMATIONS[b], () => {
    tacPreset(t).formations[b] = clone(tacPreset(t).formations[a]); });
}
function swapFormation(t, a, b) {
  edit("Swap formations " + FORMATIONS[a] + " and " + FORMATIONS[b], () => {
    const f = tacPreset(t).formations, tmp = f[a]; f[a] = f[b]; f[b] = tmp; });
}
// The lineup swap (SE-GUI-12): the two roster indices exchange, and every
// set-piece taker, join-attack slot and instruction target naming the
// outgoing player repoints to the incoming one (the role stays on the pitch).
// The captain is not repointed, matching the original.
function swapLineup(t, fieldIdx, benchIdx) {
  edit("Swap lineup", () => {
    const tac = t.tactics;
    const out = tac.starting_eleven[fieldIdx], inn = tac.bench_order[benchIdx];
    tac.starting_eleven[fieldIdx] = inn;
    tac.bench_order[benchIdx] = out;
    for (const k of ["free_kick_long", "free_kick_short", "free_kick_second",
        "corner_left", "corner_right", "penalty"])
      if (tac.set_pieces[k] === out) tac.set_pieces[k] = inn;
    for (const i of [0, 1, 2])
      if (tac.players_to_join_attack[i] === out) tac.players_to_join_attack[i] = inn;
    for (const p of tac.presets) if (p.instructions)
      for (const side of ["attack", "defence"])
        for (const ins of p.instructions[side])
          if (ins.player === out) ins.player = inn;
  });
}
// A drag between XI rows swaps the two slots' assigned players; a drag
// between bench rows moves the entry (the roster's bench order).
function swapStarters(t, i, j) {
  if (i === j) return;
  edit("Reorder lineup", () => {
    const s = t.tactics.starting_eleven, tmp = s[i]; s[i] = s[j]; s[j] = tmp; });
}
function moveBench(t, i, j) {
  if (i === j) return;
  edit("Reorder bench", () => {
    const b = t.tactics.bench_order, [m] = b.splice(i, 1); b.splice(j, 0, m); });
}
// Make GK: the picked player's roster index takes the GK formation slot, the
// keeper takes his (the formation slots keep their positions and coords; the
// game forces the GK's spot itself).
function makeGk(t, i) {
  edit("Make GK", () => {
    const f = tacFormation(t).players;
    const gk = f.findIndex(s => s.position === "GK");
    if (gk < 0 || gk === i) return;
    const s = t.tactics.starting_eleven, tmp = s[gk]; s[gk] = s[i]; s[i] = tmp;
  });
}
// A pitch click during an armed assignment mode writes the mode's field;
// the role modes (a taker, the captain) exit on assignment, the join-attack
// mode toggles members until Done.
function assignClick(t, fieldIdx) {
  const a = S.assign, tac = t.tactics;
  const roster = tac.starting_eleven[fieldIdx];
  if (!a) return false;
  if (a.kind === "join") {
    const at = tac.players_to_join_attack.indexOf(roster);
    const free = tac.players_to_join_attack.indexOf(255);
    if (at >= 0 || free >= 0) edit("Players to join attack", () => {
      if (at >= 0) tac.players_to_join_attack[at] = 255;
      else tac.players_to_join_attack[free] = roster;
    });
    render();
    return true;
  }
  const cur = a.kind === "captain" ? t.captain : tac.set_pieces[a.key];
  if (cur !== roster) edit("Assign " + a.label, () => {
    if (a.kind === "captain") t.captain = roster;
    else tac.set_pieces[a.key] = roster;
  });
  S.assign = null;
  render();
  return true;
}

// ---- The pitch (the egui Painter) ----
// One canvas painted per frame: the touchlines and the eleven markers. A
// marker is a chip with the slot's position label over the starter's name.
// The drag state lives in S.pitchDrag; marker hit tests are ui.interact rects.
function markerRect(t, i) {
  const s = tacFormation(t).players[i];
  return { x: pitchX(s.x) - 21, y: pitchY(s.y) - 16, w: 42, h: 26 };
}

// The selection grammar is the CLI's `--select`: player ids, target:donor

// The aesthetics rows indexed for the donor lookup: field -> pid -> old (the

const AES_ORDER = [], AES_OLD = {}, AES_NEW = {};

  if (r[4] === "a") {
    if (!AES_ORDER.includes(r[1])) AES_ORDER.push(r[1]);
    (AES_OLD[r[1]] = AES_OLD[r[1]] || {})[r[0]] = r[2];
    (AES_NEW[r[1]] = AES_NEW[r[1]] || {})[r[0]] = r[3];
  }

// field without a row is one the two saves share); for the open save as its
// own donor, the model's value alone. Null where the draft knows neither.
function donorValue(field, pid) {
  if (S.trn.donor === "autumn24q" && AES_OLD[field] && AES_OLD[field][pid] !== undefined)
    return AES_OLD[field][pid];
  const p = curSave().teams.flatMap(t => t.players).find(q => q.id === pid);
  const w = p && FIELD_STORE[field];

// The selection text -> [{t, d}] (target id -> donor id), expanding teams and

function parseSelection(text) {
  const pairs = [], notes = [];
  const add = (t, d) => pairs.push({ t, d });
  for (let item of text.split(",")) {
    item = item.trim();
    if (!item) continue;
    let m = item.match(/^(\d+):(\d+)$/);
    if (m) { add(Number(m[1]), Number(m[2])); continue; }
    m = item.match(/^(\d+)-(\d+)$/);
    if (m) {
      for (let tid = Number(m[1]); tid <= Number(m[2]); tid++) expandTeam(tid, add, notes);
      continue;
    }
    m = item.match(/^(\d+)$/);
    if (m) {
      const n = Number(m[1]);
      if (n >= 10000) add(n, n);
      else expandTeam(n, add, notes);
      continue;
    }
    notes.push("skipped " + item + ": not an id, pair, team or range");
  }

function expandTeam(tid, add, notes) {
  const t = curSave().teams.find(t => t.id === tid);
  if (!t) { notes.push("team " + tid + ": no sample data in the draft"); return; }
  for (const p of t.players) add(p.id, p.id);

    const target = allPlayers().find(q => q.id === t);
    for (const field of AES_ORDER) {

// The CLI reports the code and fields only; the panel's sentences per rule

function violationSentence(rule, kv) {
  const v = (k, d) => kv[k] ?? d;
  switch (rule) {
    case "RegisteredNotA": return "the registered position is not rated A";
    case "FieldedNotA": return "fielded at " + v("position") + " in preset " + v("preset") + " without an A rating";
    case "BRating": return "a B rating where the ruleset refuses one";
    case "GkSecondA": return "a second A rating at GK";
    case "Age": return "age " + v("age") + " outside " + v("min") + " to " + v("max");
    case "Weight": return "weight " + v("weight") + " outside " + v("min") + " to " + v("max");
    case "PositionRange": return "a registered position past the version's positions";
    case "PlayingStyleRange": return "a playing style the version does not allow";
    case "NoTier": return "fits no tier";
    case "Stat": return v("stat") + " " + v("value") + (v("at_most") === "true"
      ? " over the maximum " + v("target") : ", not the target " + v("target"));
    case "Form": return "form " + v("value") + ", not the target " + v("target");
    case "InjuryResistance": return "injury resistance " + v("value") + " over the maximum " + v("max");
    case "WeakFootUsage": return "weak foot usage " + v("value") + " over the maximum " + v("max");
    case "WeakFootAccuracy": return "weak foot accuracy " + v("value") + " over the maximum " + v("max");
    case "NameColor": return "name colour " + v("color", "none") + ", the tier wants " + v("expected", "none");
    case "Cards": return v("paid") + " paid cards over the limit of " + v("limit");
    case "MinCards": return v("paid") + " paid cards under the minimum of " + v("min");
    case "SkillCardCap": return v("count") + " skill cards over the cap of " + v("max");
    case "ComStyleCap": return v("count") + " COM styles over the cap of " + v("max");
    case "RequiredCard": return "the required card " + v("card") + " is not held";
    case "APositions": return v("count") + " A positions over the allowance of " + v("max");
    case "Height": return "height " + v("height") + " takes no bracket";
    case "TierCount": return v("count") + " " + v("tier") + " players, expected " + v("expected");
    case "BracketQuota": return v("count") + " players in bracket " + v("bracket")
      + " of " + v("system") + ", quota " + v("quota");
    case "MedalSystem": return "the tier counts match no medal system " + v("systems");
    case "ExtraHeight": return v("used") + " cm of extra height over the pool of " + v("total");
    case "Captain": return "no captain";
    case "Goalkeepers": return v("count") + " goalkeepers, the minimum is " + v("min");
    case "TeamSetting": return "team setting " + v("label") + ": " + v("setting") + " does not hold";
    case "FormationShape": return "formation " + v("formation") + " of preset " + v("preset")
      + " matches a forbidden shape " + v("shape");
    case "Special": return v("label") + ": " + v("text");
    case "Custom": return v("text");
    case "Unused": return "only " + v("used") + " of " + v("allowed") + " " + v("allowance") + " used";
    case "UnusedChoice": return "no option of " + v("special") + " taken";
  }
  return rule;
}
const kvOf = s => Object.fromEntries(s.split(";").map(p => p.split("=", 2)));
// The recognized tier fake of "How a player is read": the first tier whose
// `when` (the page fakes positions and captain conditions only) holds and
// whose expected rating (the highest rating-stat target) is at most the
// player's rating; if none fits, the last whose `when` holds.
function recognizedTier(p, rs) {
  const rating = Math.max(...RATING_STATS.map(s => p.stats[s] ?? 0));
  const whenOk = t => {
    if (!t.when) return true;
    if (t.when.positions && !t.when.positions.includes(p.positions.registered)) return false;
    if (t.when.captain !== undefined && (teamOf(p).captain === p.slot - 1) !== t.when.captain) return false;
    return true;
  };
  const ok = rs.tiers.filter(whenOk);
  if (!ok.length) return null;
  return ok.find(t => {
    const expected = Math.max(...RATING_STATS.map(s => (t.stats && t.stats[s] !== undefined ? t.stats[s] : t.rate)));
    return expected <= rating;
  }) || ok[ok.length - 1];
}
// The Unused suggestions under the active ruleset, derived from the page's
// sample values (sample values: the draft's own fake, not a real check's
// output - the CLI never prints them). Only the allowances the ruleset's
// `suggestions` list names, and only where the faked arithmetic reads them.
RULESETS.official.suggestions = ["cards", "tricks", "com", "weak_foot", "injury_resistance"];
RULESETS.dbc7.suggestions = [];
RULESETS.vtl11.suggestions = [];
function suggestionsFor(p, t) {
  const rs = RULESETS[D.ruleset], out = [];
  const list = rs.suggestions || [];
  if (!list.length) return out;
  const tier = recognizedTier(p, rs);
  if (!tier) return out;
  for (const word of list) {
    if (word === "cards") {
      const c = cardLimits(p, t, tier);
      if (c.paid < c.limit) out.push({ allowance: "cards", used: c.paid, allowed: c.limit });
    } else if (word === "a_positions") {
      let a = 0, b = 0;
      for (const r of Object.values(p.positions.playable)) { if (r === "A") a++; else if (r === "B") b++; }
      const used = a + (rs.b_uses_a ? b : 0);
      if (used < (tier.a_positions || 0)) out.push({ allowance: "a_positions", used, allowed: tier.a_positions });
    } else if (word === "weak_foot") {
      const used = Math.min(p.stats.weak_foot_usage + 1, p.stats.weak_foot_accuracy + 1);
      const allowed = Math.min(tier.weak_foot.usage, tier.weak_foot.accuracy);
      if (used < allowed) out.push({ allowance: "weak_foot", used, allowed });
    } else if (word === "injury_resistance") {
      const used = p.stats.injury_resistance + 1;
      if (used < tier.injury_resistance) out.push({ allowance: "injury_resistance", used, allowed: tier.injury_resistance });
    } else if (word === "free_cards") {
      const free = [], held = [];
      for (const s of rs.free_specials || []) {
        if (s.tiers && !s.tiers.includes(tier.id)) continue;
        if (s.captain && t.captain !== p.slot - 1) continue;
        if (s.positions && !s.positions.includes(p.positions.registered)) continue;
        free.push(s.card);
        if (p.skills.includes(s.card) || p.com_styles.includes(s.card)) held.push(s.card);
      }
      if (held.length < free.length) out.push({ allowance: "free_cards", used: held.length, allowed: free.length });
    } else {
      // A card group (`com` included): its free cards not all held.
      const group = word === "com" ? null : (rs.card_groups || {})[word];
      const held = word === "com" ? p.com_styles.length
        : group ? p.skills.filter(c => group.includes(c)).length : null;
      const allowed = (tier.free || {})[word] || 0;
      if (held !== null && held < allowed) out.push({ allowance: word, used: held, allowed });
    }
  }
  return out;
}
// The teams the active ruleset's sample run covers, in id order.
const aatfCovered = () => new Set((AATF_ROWS[D.ruleset] || []).map(r => r[1]));
function aatfRows() {
  const rows = S.saveKey === "pes17" ? (AATF_ROWS[D.ruleset] || []) : [];
  const ids = S.aatf.mode === "current" ? [curTeam().id]
    : Object.keys(S.aatf.teams).filter(k => S.aatf.teams[k]).map(Number);
  return rows.filter(r => ids.includes(r[1]));
}
function aatfPanel() {
  // The sample runs are the PES 17 save's; on the other sample the panel
  // says so rather than show another save's violations.
  const rows = S.saveKey === "pes17" ? (AATF_ROWS[D.ruleset] || []) : [];
  const covered = aatfCovered();
  const rs = RULESETS[D.ruleset];
  const c = h("div", {},
    h("div", { class: "row" },
      weak("Ruleset " + rs.label + " "),
      h("label", { class: "cb" }, h("input", { type: "radio", name: "aatf-mode",
        checked: S.aatf.mode === "current",
        onchange: () => { S.aatf.mode = "current"; render(); } }), " Current team"),
      h("label", { class: "cb" }, h("input", { type: "radio", name: "aatf-mode",
        checked: S.aatf.mode === "select",
        onchange: () => { S.aatf.mode = "select"; render(); } }), " Select teams"),
      cb("Show suggestions", S.aatf.sugg, v => S.aatf.sugg = v),
      button("Save a copy", () => {
        S.aatf.savedCopy = OFFICIAL_RHAI;
        S.status = "Wrote a copy of the embedded official ruleset (autumn26.rhai)";
        render();
      }, { title: "Write the embedded official ruleset out" })),
    h("div", { class: "row" },
      weak("Rules file "),
      combo([["dbc7_full.rhai", "dbc7_full.rhai"],
        ["dbc7_broken_syntax.rhai", "dbc7_broken_syntax.rhai"],
        ["dbc7_broken_key.rhai", "dbc7_broken_key.rhai"]],
        S.aatf.file || "dbc7_full.rhai", v => S.aatf.file = v),
      button("Validate rules", () => {
        const f = S.aatf.file || "dbc7_full.rhai";
        S.aatf.validate = { file: f, findings: VALIDATE17[f] ? [VALIDATE17[f]] : [] };
        render();
      }, { title: "The lib's load-time validation on the chosen file" })));
  if (S.aatf.validate) {
    const { file, findings } = S.aatf.validate;
    c.append(h("div", { class: "row" }, weak(file + ": "),
      findings.length ? findings.map(f => h("span", { class: "err mono" }, f))
        : weak("no findings")));
  }
  if (S.aatf.mode === "select") {
    const list = h("div", { class: "tlist" },
      Object.keys(TEAM17).map(id => {
        const on = covered.has(Number(id));
        return h("label", { class: "cb prow" + (on ? "" : " off"),
          title: on ? "" : "No sample run for this team in the draft" },
          h("input", { type: "checkbox", checked: !!S.aatf.teams[id], disabled: !on,
            onchange: e => { S.aatf.teams[id] = e.target.checked; render(); } }),
          " " + id + " " + TEAM17[id]);
      }));
    c.append(list);
  }
  if (!rows.length) {
    c.append(h("div", { class: "row weak" },
      D.ruleset === "vtl11" || S.saveKey !== "pes17"
        ? "No sample run for this ruleset or save in the draft."
        : "No violations."));
    return c;
  }
  const list = h("div", { id: "aatf-rows" });
  const these = aatfRows();
  let lastTeam = null, lastPid = null, lastIsTeam = null;
  for (const [sev, team, pid, rule, fields] of these) {
    if (team !== lastTeam) {
      list.append(h("div", { class: "grp" }, "Team " + team + (TEAM17[team] ? " " + TEAM17[team] : "")));
      lastTeam = team; lastPid = null; lastIsTeam = false;
    }
    if (pid === 0) {
      if (!lastIsTeam) { list.append(h("div", { class: "grp weak" }, "the team")); lastIsTeam = true; }
    } else if (pid !== lastPid) {
      const p = curSave().teams.flatMap(t => t.players).find(q => q.id === pid);
      list.append(h("div", { class: "grp weak" }, p ? displayName(p.name) + " (" + pid + ")" : "Player " + pid));
      lastPid = pid; lastIsTeam = false;
    }
    const kv = kvOf(fields);
    const row = h("div", { class: "drow sel " + (sev === "Error" ? "err" : sev === "Warning" ? "warn" : ""),
      onclick: () => {
        if (pid && curSave().teams.some(t => t.id === team)) { jumpToPlayer(team, pid % 100); render(); }
      }, title: pid ? "Select this player" : "A team-level violation" },
      h("span", { class: "f" }, rule), h("span", { class: "v" }, violationSentence(rule, kv)));
    list.append(row);
  }
  // The suggestions, apart from errors and warnings (the toggle's whole
  // point), derived from the sample values.
  if (S.aatf.sugg) {
    const ids = S.aatf.mode === "current" ? [curTeam().id]
      : Object.keys(S.aatf.teams).filter(k => S.aatf.teams[k]).map(Number);
    let any = false, lastSuggPid = null;
    for (const tid of ids) {
      const t = curSave().teams.find(t => t.id === tid);
      if (!t) continue;
      for (const p of t.players) {
        const sugs = suggestionsFor(p, t);
        if (!sugs.length) continue;
        if (!any) { list.append(h("div", { class: "grp" }, "Suggestions")); any = true; }
        if (p.id !== lastSuggPid) {
          list.append(h("div", { class: "grp weak" }, displayName(p.name) + " (" + p.id + ")"));
          lastSuggPid = p.id;
        }
        for (const s of sugs)
          list.append(h("div", { class: "drow sel",
            onclick: () => { jumpToPlayer(t.id, p.slot); render(); },
            title: "Select this player" },
            h("span", { class: "f" }, "Unused"),
            h("span", { class: "v" }, violationSentence("Unused", s))));
      }
    }
    if (!any && D.ruleset !== "official")
      list.append(h("div", { class: "row weak" }, "The active ruleset lists no suggestions."));
  }
  c.append(list);
  return c;
}

// ---- Apply aesthetics patch (SE-GUI-18) ----
// The one aesthetics write open by default. The version check refuses before
// anything is touched (the CLI's wording); the preview lists every player the
// patch changes with old -> new in the tabs' terms; Apply is one undoable
// edit, saved only on Save.
// sample wording: the panel's own labels.
function patOpen() {
  S.pat.loaded = true; S.pat.applied = false;
  if (PATCH21.pes_version !== version()) {
    S.pat.refused = PATCH21.path + ": the patch is for PES 20" + PATCH21.pes_version
      + ", the save is PES 20" + version();
    return;
  }
  S.pat.refused = null;
}
function patApply() {
  const targets = {};
  for (const t of curSave().teams) for (const p of t.players) targets[p.id] = p;
  edit("Apply aesthetics patch", () => {
    for (const [pid, field, , n] of PATCH21.rows) {
      const p = targets[pid];
      if (p) putStored(p, field, n);
    }
  });
  S.pat.applied = true;
}
function patchPanel() {
  const c = h("div", {},
    h("div", { class: "row" },
      button("Open patch\u2026", () => { patOpen(); render(); }, { title: "Pick a patch the Team compiler wrote" }),
      S.pat.loaded && !S.pat.refused
        ? weak(PATCH21.path.split("\\").pop() + ": team " + PATCH21.teams[0].id
            + " " + PATCH21.teams[0].name + ", players "
            + PATCH21.teams[0].players.map(s => String(s).padStart(2, "0")).join(", "))
        : null,
      S.pat.loaded && !S.pat.refused
        ? button("Apply", () => { patApply(); render(); },
            { disabled: S.pat.applied, title: "Write the patch into the save, one undoable edit" })
        : null));
  if (S.pat.refused)
    c.append(h("div", { class: "row err", id: "pat-refused" }, S.pat.refused));
  if (S.pat.loaded && !S.pat.refused) {
    let lastPid = null;
    const list = h("div", { id: "pat-rows" });
    for (const [pid, field, o, n] of PATCH21.rows) {
      if (pid !== lastPid) { list.append(h("div", { class: "grp weak" }, "Player " + pid)); lastPid = pid; }
      const d = diffRowDraw(field, o, n);
      list.append(h("div", { class: "drow sel",
        onclick: () => { jumpToPlayer(Math.floor(pid / 100), pid % 100); render(); },
        title: "Select this player" },
        h("span", { class: "f" }, d.label),
        h("span", { class: "v" }, d.oldV + " \u2192 " + d.newV)));
    }
    c.append(list);
  }
  if (S.pat.applied) c.append(h("div", { class: "row" }, weak("Applied; unsaved until Save.")));
  return c;
}

function renderPanel() {
  if (!S.panel || !S.save) return null;
  const [id, title, body] =
    S.panel === "comparator" ? ["panel-comparator", "Comparator", comparatorPanel()]
    : S.panel === "transplant" ? ["panel-transplant", "Aesthetics transplant", transplantPanel()]
    : S.panel === "aatf" ? ["panel-aatf", "AATF violations (" + RULESETS[D.ruleset].label + ")", aatfPanel()]
    : ["panel-patch", "Apply aesthetics patch", patchPanel()];
  return panelWindow(id, title, body);
}

openSave(D.sample); // the draft control's open save
render();
