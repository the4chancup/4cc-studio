<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -2027 1401 2458">
  <!-- U+2261 IDENTICAL TO. Font units (2048 per em), y up from the baseline: the group flips
       them into SVG's y-down; the view box is the line the strokes were laid
       out on, from ascent to descent; its width is the glyph's advance. -->
  <g transform="scale(1 -1)">
    <rect x="232" y="105" width="940" height="129"/>
    <rect x="232" y="529" width="940" height="129"/>
    <rect x="232" y="953" width="940" height="129"/>
  </g>
</svg>
